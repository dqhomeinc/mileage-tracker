services:
  - type: web
    name: mileage-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      # DATABASE_URL: set to your Neon connection string (Neon dashboard →
      # Connection Details). Any ?sslmode=... suffix is fine — main.py strips it.
      # Set BREVO_API_KEY and BREVO_SENDER_EMAIL (a verified Brevo sender)
      # manually in the Render dashboard after deployment
      # (Dashboard → mileage-tracker → Environment)
