<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Vehicles — Mileage Tracker</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary:    #4F46E5;
      --violet:     #7C3AED;
      --grad:       linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      --bg:         #F1F5F9;
      --surface:    #FFFFFF;
      --text:       #0F172A;
      --muted:      #64748B;
      --border:     #E2E8F0;
      --radius:     16px;
      --radius-sm:  10px;
      --shadow:     0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(79,70,229,.08);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .page { max-width: 680px; margin: 0 auto; padding: 32px 16px 56px; }
    .panel {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      margin-bottom: 20px;
    }
    .panel-heading {
      display: flex; align-items: center; gap: 10px;
      font-size: 1rem; font-weight: 600; color: var(--text);
      margin-bottom: 22px;
    }
    .panel-heading-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #EEF2FF, #DDD6FE);
      display: flex; align-items: center; justify-content: center;
      color: var(--primary); font-size: 0.8rem;
    }

    /* ── Vehicle management panel ────────────── */
    .vehicles-empty { text-align: center; padding: 18px 0; color: var(--muted); font-size: .85rem; }
    .vehicle-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .vehicle-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); background: #FAFBFD;
    }
    .vehicle-info { flex: 1; min-width: 0; }
    .vehicle-name { font-weight: 600; font-size: .88rem; color: var(--text); }
    .vehicle-sub-text { font-size: .75rem; color: var(--muted); margin-top: 1px; }
    .vehicle-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .vehicle-edit, .vehicle-del {
      width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0;
      background: transparent; border: none; color: #CBD5E1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: .75rem; transition: all .2s;
    }
    .vehicle-edit:hover { background: #EEF2FF; color: var(--primary); }
    .vehicle-del:hover { background: #FEF2F2; color: #EF4444; }
    .btn-add-vehicle {
      padding: 5px 12px; border-radius: 8px; white-space: nowrap;
      border: 1.5px dashed var(--border); background: transparent;
      color: var(--muted); font-size: .8rem; font-weight: 600;
      font-family: 'Inter', sans-serif; cursor: pointer;
      display: flex; align-items: center; gap: 5px; transition: all .2s;
    }
    .btn-add-vehicle:hover { border-color: var(--primary); color: var(--primary); background: #EEF2FF; }
    .vehicle-add-form {
      margin-top: 14px; padding: 14px;
      border: 1.5px solid #C7D2FE; border-radius: var(--radius-sm);
      background: #EEF2FF; display: none;
    }
    .vehicle-add-form.show { display: block; }
    .v-form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .v-form-full { margin-bottom: 10px; }
    .v-form-input {
      width: 100%; padding: 9px 12px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-family: 'Inter', sans-serif; font-size: .85rem; color: var(--text);
      outline: none; background: white; transition: border-color .2s;
    }
    .v-form-input:focus { border-color: var(--primary); }
    .v-form-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .v-form-error { font-size: .78rem; color: #EF4444; margin-top: 6px; display: none; }
    .v-form-error.show { display: block; }
    .field-label {
      display: block; font-size: 0.74rem; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .btn-modal-cancel {
      padding: 10px 18px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border); background: white;
      color: var(--muted); font-size: .88rem; font-weight: 600;
      cursor: pointer; font-family: 'Inter', sans-serif; transition: background .15s;
    }
    .btn-modal-cancel:hover { background: var(--bg); }
    .btn-modal-save {
      padding: 10px 20px; border-radius: var(--radius-sm);
      background: var(--grad); border: none; color: white;
      font-size: .88rem; font-weight: 600; cursor: pointer;
      font-family: 'Inter', sans-serif; transition: opacity .15s;
    }
    .btn-modal-save:hover { opacity: .9; }
    .btn-modal-save:disabled { opacity: .6; cursor: not-allowed; }

    @media (max-width: 480px) {
      .v-form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

{% include '_navbar.html' %}

<div class="page">

  <div class="panel">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div class="panel-heading" style="margin-bottom:0">
        <div class="panel-heading-icon"><i class="fas fa-car"></i></div>
        My Vehicles
      </div>
      <button class="btn-add-vehicle" id="showVehicleFormBtn" onclick="toggleVehicleForm()">
        <i class="fas fa-plus"></i> Add Vehicle
      </button>
    </div>

    <div class="vehicle-add-form" id="vehicleAddForm">
      <div class="v-form-full">
        <label class="field-label" for="vehicleName">Nickname</label>
        <input type="text" id="vehicleName" class="v-form-input" placeholder="e.g. Daily Driver, Work Truck">
      </div>
      <div class="v-form-row">
        <div>
          <label class="field-label" for="vehicleYear">Year</label>
          <input type="text" id="vehicleYear" class="v-form-input" placeholder="2020" maxlength="4">
        </div>
        <div>
          <label class="field-label" for="vehicleMake">Make</label>
          <input type="text" id="vehicleMake" class="v-form-input" placeholder="Honda">
        </div>
        <div>
          <label class="field-label" for="vehicleModel">Model</label>
          <input type="text" id="vehicleModel" class="v-form-input" placeholder="Civic">
        </div>
      </div>
      <div class="v-form-error" id="vehicleFormError"></div>
      <div class="v-form-footer">
        <button class="btn-modal-cancel" onclick="hideVehicleForm()">Cancel</button>
        <button class="btn-modal-save" id="addVehicleBtn" onclick="saveVehicle()">Add Vehicle</button>
      </div>
    </div>

    <div class="vehicle-list" id="vehicleList">
      <div class="vehicles-empty" id="vehiclesEmpty">No vehicles yet. Add one to track which car you use.</div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let vehiclesList = [];
let editingVehicleId = null;

async function loadVehicles() {
  try {
    const resp = await fetch('/vehicles');
    vehiclesList = await resp.json();
    renderVehicleList();
  } catch { /* non-fatal */ }
}

function renderVehicleList() {
  const listEl  = document.getElementById('vehicleList');
  const emptyEl = document.getElementById('vehiclesEmpty');
  listEl.querySelectorAll('.vehicle-item').forEach(el => el.remove());
  if (!vehiclesList.length) { emptyEl.style.display = ''; return; }
  emptyEl.style.display = 'none';
  vehiclesList.forEach(v => {
    const item = document.createElement('div');
    item.className = 'vehicle-item';
    item.id = `vehicle-${v.id}`;
    item.innerHTML = `
      <div class="vehicle-info">
        <div class="vehicle-name">${escHtml(v.name)}</div>
        ${v.sub ? `<div class="vehicle-sub-text">${escHtml(v.sub)}</div>` : ''}
      </div>
      <div class="vehicle-actions">
        <button class="vehicle-edit" onclick="editVehicle(${v.id})" title="Edit vehicle">
          <i class="fas fa-pen"></i>
        </button>
        <button class="vehicle-del" onclick="deleteVehicle(${v.id})" title="Remove vehicle">
          <i class="fas fa-trash-alt"></i>
        </button>
      </div>`;
    listEl.appendChild(item);
  });
}

function toggleVehicleForm() {
  const form = document.getElementById('vehicleAddForm');
  const willShow = !form.classList.contains('show');
  if (willShow) {
    editingVehicleId = null;
    document.getElementById('addVehicleBtn').textContent = 'Add Vehicle';
    ['vehicleName','vehicleYear','vehicleMake','vehicleModel'].forEach(id => {
      document.getElementById(id).value = '';
    });
  }
  form.classList.toggle('show', willShow);
  if (willShow) document.getElementById('vehicleName').focus();
}

function hideVehicleForm() {
  document.getElementById('vehicleAddForm').classList.remove('show');
  ['vehicleName','vehicleYear','vehicleMake','vehicleModel'].forEach(id => {
    document.getElementById(id).value = '';
  });
  const errEl = document.getElementById('vehicleFormError');
  errEl.textContent = '';
  errEl.classList.remove('show');
  editingVehicleId = null;
  document.getElementById('addVehicleBtn').textContent = 'Add Vehicle';
}

function editVehicle(id) {
  const v = vehiclesList.find(v => v.id === id);
  if (!v) return;
  editingVehicleId = id;
  document.getElementById('vehicleName').value  = v.name  || '';
  document.getElementById('vehicleYear').value  = v.year  || '';
  document.getElementById('vehicleMake').value  = v.make  || '';
  document.getElementById('vehicleModel').value = v.model || '';
  const errEl = document.getElementById('vehicleFormError');
  errEl.textContent = '';
  errEl.classList.remove('show');
  document.getElementById('addVehicleBtn').textContent = 'Save Changes';
  document.getElementById('vehicleAddForm').classList.add('show');
  document.getElementById('vehicleName').focus();
}

async function saveVehicle() {
  const name  = document.getElementById('vehicleName').value.trim();
  const year  = document.getElementById('vehicleYear').value.trim();
  const make  = document.getElementById('vehicleMake').value.trim();
  const model = document.getElementById('vehicleModel').value.trim();
  const errEl = document.getElementById('vehicleFormError');
  errEl.classList.remove('show');

  if (!name) {
    errEl.textContent = 'Nickname is required.';
    errEl.classList.add('show');
    document.getElementById('vehicleName').focus();
    return;
  }

  const isEdit = editingVehicleId !== null;
  const btn = document.getElementById('addVehicleBtn');
  btn.disabled = true;
  btn.textContent = isEdit ? 'Saving…' : 'Adding…';
  try {
    const resp = await fetch(isEdit ? `/vehicles/${editingVehicleId}` : '/vehicles', {
      method: isEdit ? 'PATCH' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, year, make, model })
    });
    const data = await resp.json();
    if (!resp.ok) {
      errEl.textContent = data.error || `Failed to ${isEdit ? 'save' : 'add'} vehicle.`;
      errEl.classList.add('show');
      return;
    }
    if (isEdit) {
      const idx = vehiclesList.findIndex(v => v.id === editingVehicleId);
      if (idx !== -1) vehiclesList[idx] = data;
    } else {
      vehiclesList.push(data);
    }
    vehiclesList.sort((a, b) => a.name.localeCompare(b.name));
    renderVehicleList();
    hideVehicleForm();
  } catch {
    errEl.textContent = `Network error. Could not ${isEdit ? 'save' : 'add'} vehicle.`;
    errEl.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = isEdit ? 'Save Changes' : 'Add Vehicle';
  }
}

async function deleteVehicle(id) {
  if (!confirm('Remove this vehicle? Trips using it will have the vehicle cleared.')) return;
  try {
    const resp = await fetch(`/vehicles/${id}`, { method: 'DELETE' });
    if (!resp.ok) return;
    vehiclesList = vehiclesList.filter(v => v.id !== id);
    document.getElementById(`vehicle-${id}`)?.remove();
    if (!vehiclesList.length) document.getElementById('vehiclesEmpty').style.display = '';
  } catch { /* silent */ }
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

loadVehicles();
</script>
</body>
</html>
