<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mileage Tracker</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary:    #4F46E5;
      --violet:     #7C3AED;
      --grad:       linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      --bg:         #F1F5F9;
      --surface:    #FFFFFF;
      --text:       #0F172A;
      --muted:      #64748B;
      --border:     #E2E8F0;
      --radius:     16px;
      --radius-sm:  10px;
      --shadow:     0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(79,70,229,.08);
      /* Width the trip history needs before its columns get cramped;
         below it the history scrolls sideways instead. */
      --trips-min-width: 600px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Navbar ─────────────────────────────── */
    /* ── Layout ─────────────────────────────── */
    .page { max-width: 680px; margin: 0 auto; padding: 32px 16px 56px; }

    /* ── Cards ──────────────────────────────── */
    .panel {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      margin-bottom: 20px;
    }
    .panel-heading {
      display: flex; align-items: center; gap: 10px;
      font-size: 1rem; font-weight: 600; color: var(--text);
      margin-bottom: 22px;
    }
    .panel-heading-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #EEF2FF, #DDD6FE);
      display: flex; align-items: center; justify-content: center;
      color: var(--primary); font-size: 0.8rem;
    }

    /* ── Location inputs ─────────────────────── */
    .field-label {
      display: block; font-size: 0.74rem; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .autocomplete-wrapper { position: relative; }
    .input-row {
      display: flex; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border); overflow: hidden;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-row:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,70,229,.12);
    }
    .loc-icon {
      display: flex; align-items: center; padding: 0 13px;
      background: #F8FAFC; border-right: 1.5px solid var(--border);
      color: var(--muted); font-size: 0.7rem; flex-shrink: 0;
    }
    .loc-input {
      flex: 1; border: none; outline: none;
      padding: 12px 14px; background: transparent;
      font-family: 'Inter', sans-serif; font-size: 0.88rem; color: var(--text);
    }
    .loc-input::placeholder { color: #CBD5E1; }
    .loc-input.is-valid { background: #F0FDF4; }
    .mic-btn {
      border: none; border-left: 1.5px solid var(--border);
      background: transparent; padding: 0 13px;
      color: var(--muted); cursor: pointer; font-size: 0.82rem;
      transition: all .2s; flex-shrink: 0;
    }
    .mic-btn:hover { background: #F8FAFC; color: var(--primary); }
    .mic-btn.recording { background: #FEF2F2; color: #EF4444; }
    .mic-btn.resolving { background: #EFF6FF; color: var(--primary); }
    .mic-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Autocomplete dropdown ───────────────── */
    .autocomplete-dropdown {
      position: absolute; top: calc(100% + 3px); left: 0; right: 0; z-index: 200;
      background: white; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: 0 8px 24px rgba(0,0,0,.1);
      max-height: 210px; overflow-y: auto;
    }
    .autocomplete-section {
      padding: 6px 14px 4px; font-size: .66rem; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
      background: #FAFBFC; border-bottom: 1px solid #F1F5F9;
    }
    .autocomplete-item .ac-icon { color: #CBD5E1; font-size: .72rem; flex-shrink: 0; }
    .autocomplete-item.is-recent .ac-icon { color: var(--primary); }
    .autocomplete-item {
      padding: 9px 14px; cursor: pointer; font-size: 0.85rem; color: var(--text);
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid #F8FAFC;
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item::before {
      content: '\f3c5'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
      color: #CBD5E1; font-size: 0.7rem; flex-shrink: 0;
    }
    .autocomplete-item:hover, .autocomplete-item.active {
      background: #F1F5F9; color: var(--primary);
    }
    .autocomplete-item:hover::before, .autocomplete-item.active::before { color: var(--primary); }

    /* ── Route connector ─────────────────────── */
    .stops-list { display: flex; flex-direction: column; gap: 8px; }
    .stops-list:empty { display: none; }
    /* Every location on a trip is one of these rows. Which one is the start and
       which the end is a matter of position, so the badge is rendered from the
       row's index and re-rendered whenever the order changes. */
    .loc-badge {
      flex-shrink: 0; width: 46px; padding: 2px 0; margin-top: 6px;
      font-size: .58rem; font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase; text-align: center; border-radius: 5px;
      background: #F1F5F9; color: var(--muted);
    }
    .loc-badge.is-start { background: #ECFDF5; color: #047857; }
    .loc-badge.is-end   { background: #FEF2F2; color: #B91C1C; }
    .stop-row { display: flex; align-items: flex-start; gap: 6px; }
    .stop-row .stop-field { flex: 1 1 auto; min-width: 0; }
    .stop-actions { display: flex; gap: 2px; padding-top: 7px; flex-shrink: 0; }
    .stop-btn {
      width: 26px; height: 26px; border: none; border-radius: 6px; flex-shrink: 0;
      background: transparent; color: #94A3B8; cursor: pointer; font-size: .72rem;
      display: flex; align-items: center; justify-content: center; transition: all .2s;
    }
    .stop-btn:hover:not(:disabled) { background: #EEF2FF; color: var(--primary); }
    .stop-btn.stop-del:hover:not(:disabled) { background: #FEF2F2; color: #EF4444; }
    .stop-btn:disabled { opacity: .3; cursor: default; }
    .btn-add-stop {
      margin: 8px 0 2px; padding: 5px 12px; border-radius: 8px;
      border: 1.5px dashed var(--border); background: transparent;
      color: var(--muted); font-size: .78rem; font-weight: 600; cursor: pointer;
      font-family: 'Inter', sans-serif; transition: all .2s;
    }
    .btn-add-stop:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: #EEF2FF; }
    .btn-add-stop:disabled { opacity: .5; cursor: default; }
    .trip-stops-text {
      font-size: .72rem; color: var(--muted); margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* ── Voice confirm bar ───────────────────── */
    .confirm-bar {
      display: none; align-items: center; gap: 8px;
      padding: 8px 12px; margin-top: 6px;
      background: #FFFBEB; border: 1.5px solid #FCD34D;
      border-radius: 8px; font-size: 0.8rem;
    }
    .confirm-bar.show { display: flex; }
    .confirm-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #92400E; }
    .confirm-yes, .confirm-edit {
      padding: 3px 10px; border-radius: 6px; font-size: 0.77rem;
      font-weight: 600; cursor: pointer; border: none; white-space: nowrap;
      transition: background .15s;
    }
    .confirm-yes { background: #D1FAE5; color: #065F46; }
    .confirm-yes:hover { background: #A7F3D0; }
    .confirm-edit { background: white; color: var(--muted); border: 1px solid var(--border); }
    .confirm-edit:hover { background: var(--bg); }

    /* ── Feasibility warning ─────────────────── */
    .speed-warning {
      display: none; align-items: flex-start; gap: 8px;
      padding: 8px 12px; margin-top: 10px;
      background: #FFFBEB; border: 1.5px solid #FCD34D;
      border-radius: 8px; font-size: 0.8rem; color: #92400E;
    }
    .speed-warning.show { display: flex; }
    .speed-warning i { flex-shrink: 0; margin-top: 1px; }

    /* ── Calculate button ────────────────────── */
    .btn-calc {
      width: 100%; margin-top: 20px; padding: 13px;
      background: var(--grad); border: none; border-radius: var(--radius-sm);
      color: white; font-weight: 600; font-size: 0.93rem;
      font-family: 'Inter', sans-serif; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity .2s, transform .1s;
    }
    .btn-calc:hover { opacity: 0.92; }
    .btn-calc:active { transform: scale(0.99); }
    .btn-calc:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ── Alerts ──────────────────────────────── */
    .alert-strip {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; border-radius: var(--radius-sm);
      font-size: 0.86rem; margin-top: 14px;
    }
    .alert-err { background: #FEF2F2; border: 1.5px solid #FECACA; color: #7F1D1D; }
    .alert-ok  { background: #F0FDF4; border: 1.5px solid #BBF7D0; color: #14532D; }
    .alert-close {
      margin-left: auto; background: none; border: none; cursor: pointer;
      color: inherit; opacity: 0.6; padding: 0; font-size: 0.85rem;
    }
    .alert-close:hover { opacity: 1; }

    /* ── Stats bar ───────────────────────────── */
    .stats-bar {
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 20px 28px;
      margin-bottom: 20px; display: flex; align-items: center;
    }
    .stat-item { flex: 1; text-align: center; }
    .stat-value { font-size: 2rem; font-weight: 700; color: var(--primary); line-height: 1; }
    .stat-label {
      font-size: 0.7rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em; margin-top: 5px;
    }
    .stat-divider { width: 1px; height: 44px; background: var(--border); flex-shrink: 0; }

    /* ── History ─────────────────────────────── */
    .history-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .export-btns { display: flex; gap: 6px; }
    .export-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 8px; border: 1.5px solid var(--border);
      background: white; color: var(--muted); font-size: 0.78rem; font-weight: 600;
      cursor: pointer; font-family: 'Inter', sans-serif; transition: all .15s;
      white-space: nowrap;
    }
    .export-btn:hover { border-color: var(--primary); color: var(--primary); background: #EEF2FF; }
    @media (max-width: 480px) { .export-label { display: none; } }
    /* Narrower than --trips-min-width the columns scroll sideways inside
       #historyWrap rather than being dropped, so a phone can still reach
       every column. */
    #historyWrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .trips-header {
      display: grid; grid-template-columns: 130px 1fr 1fr 60px 68px;
      min-width: var(--trips-min-width);
      gap: 8px; padding-bottom: 8px;
      font-size: 0.72rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.05em;
      border-bottom: 1.5px solid var(--border);
    }
    .trip-row {
      display: grid; grid-template-columns: 130px 1fr 1fr 60px 68px;
      min-width: var(--trips-min-width);
      gap: 8px; align-items: start; padding: 11px 0;
      border-bottom: 1px solid var(--border); font-size: 0.85rem;
    }
    .trip-row:last-child { border-bottom: none; }
    .trip-loc { color: var(--text); overflow-wrap: break-word; }
    .trip-mi  { font-weight: 700; color: var(--primary); }
    .trip-row-pending .trip-mi { font-weight: 500; font-style: italic; color: var(--muted); }
    .trip-date { color: var(--muted); font-size: 0.78rem; }
    .trip-actions { display: flex; gap: 4px; align-items: center; }
    .trip-del, .trip-edit {
      width: 30px; height: 30px; border-radius: 7px;
      background: transparent; border: none; color: #CBD5E1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 0.78rem; transition: all .2s;
    }
    .trip-del:hover  { background: #FEF2F2; color: #EF4444; }
    .trip-edit:hover { background: #EEF2FF; color: var(--primary); }

    /* ── Edit modal ──────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 500;
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: white; border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      width: 100%; max-width: 540px;
      /* Never taller than the viewport, less the overlay's 16px padding each
         side. The overlay is position:fixed and centres its child, so without
         this cap a modal taller than the window overflows in both directions
         and its top — the close button included — sits above the viewport
         where nothing can scroll it into reach.

         Laid out as a column so the header and footer stay put and only the
         fields scroll, keeping Save and Cancel reachable without scrolling to
         the bottom. Padding moves onto the three sections so the scrollbar
         tracks the edge of the box rather than floating inside the padding. */
      max-height: calc(100vh - 32px);
      display: flex; flex-direction: column;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 28px 28px 0; margin-bottom: 20px; flex-shrink: 0;
    }
    .modal-body {
      padding: 0 28px; overflow-y: auto; flex: 1 1 auto;
    }
    .modal-title { font-size: 1.05rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 8px; background: none; border: none;
      color: var(--muted); cursor: pointer; font-size: 1rem;
      display: flex; align-items: center; justify-content: center; transition: background .15s;
    }
    .modal-close:hover { background: var(--bg); }
    .modal-field { margin-bottom: 14px; }
    .modal-field label { display: block; font-size: .73rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
    .modal-field input {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif; font-size: .9rem; color: var(--text);
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .modal-field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
    /* The live distance on the log form: quiet until there is a number, so an
       empty form does not lead with a dash. */
    .route-measure {
      display: flex; align-items: center; gap: 8px; margin-top: 10px;
      padding: 9px 12px; border-radius: var(--radius-sm);
      background: #EEF2FF; border: 1.5px solid #C7D2FE;
      font-size: .82rem; color: #3730A3;
    }
    .route-measure.is-idle { background: #F8FAFC; border-color: var(--border); color: var(--muted); }
    .route-measure .rm-miles { font-weight: 700; }
    .route-measure .rm-sub { color: #6366F1; font-size: .76rem; }
    .route-measure.is-idle .rm-sub { color: var(--muted); }

    .modal-dist-row { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
    .modal-miles-box {
      flex: 1; padding: 11px 14px; background: #F8FAFC;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-weight: 700; color: var(--primary); font-size: .9rem;
    }
    .btn-recalc {
      padding: 10px 14px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border); background: white;
      color: var(--muted); font-size: .82rem; font-weight: 600;
      cursor: pointer; font-family: 'Inter', sans-serif;
      display: flex; align-items: center; gap: 6px; transition: all .15s; white-space: nowrap;
    }
    .btn-recalc:hover { border-color: var(--primary); color: var(--primary); }
    .btn-recalc:disabled { opacity: .6; cursor: not-allowed; }
    .modal-footer {
      display: flex; gap: 10px; justify-content: flex-end;
      padding: 20px 28px 28px; flex-shrink: 0;
    }
    .btn-modal-cancel {
      padding: 10px 18px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border); background: white;
      color: var(--muted); font-size: .88rem; font-weight: 600;
      cursor: pointer; font-family: 'Inter', sans-serif; transition: background .15s;
    }
    .btn-modal-cancel:hover { background: var(--bg); }
    .btn-modal-save {
      padding: 10px 20px; border-radius: var(--radius-sm);
      background: var(--grad); border: none; color: white;
      font-size: .88rem; font-weight: 600; cursor: pointer;
      font-family: 'Inter', sans-serif; transition: opacity .15s;
    }
    .btn-modal-save:hover { opacity: .9; }
    .btn-modal-save:disabled { opacity: .6; cursor: not-allowed; }
    .history-empty {
      text-align: center; padding: 44px 0; color: var(--muted); font-size: 0.9rem;
    }
    .empty-icon { font-size: 2rem; display: block; margin-bottom: 10px; opacity: 0.2; }

    /* ── Trip form extra fields ──────────────── */
    .trip-extras { margin-top: 16px; padding-top: 16px; border-top: 1.5px solid var(--border); }
    .trip-extras-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px; }
    /* Start date beside start time, end date beside end time. The pairing is
       the layout, so neither row has to be labelled as a pair. */
    .datetime-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-top: 10px;
    }
    /* The modal's date and time inputs carry no .form-input class of their own,
       so they are sized here rather than stretching to their intrinsic width. */
    .datetime-grid > * { min-width: 0; }
    .datetime-grid input { width: 100%; box-sizing: border-box; }
    .form-input {
      width: 100%; padding: 10px 13px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif; font-size: .88rem; color: var(--text);
      outline: none; background: white; transition: border-color .2s, box-shadow .2s;
    }
    .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
    .vehicle-hint { font-size: .75rem; color: var(--muted); margin-top: 4px; min-height: 16px; }
    .trip-notes {
      width: 100%; box-sizing: border-box; resize: vertical;
      min-height: 58px; font-family: 'Inter', sans-serif;
    }
    .notes-counter { font-size: .68rem; color: var(--muted); text-align: right; margin-top: 2px; }

    /* ── Attachments ─────────────────────────── */
    .attach-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .attach-list:empty { display: none; }
    .attach-row {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 9px; border: 1.5px solid var(--border); border-radius: 8px;
      background: #F8FAFC; font-size: .78rem; min-width: 0;
    }
    .attach-row .attach-icon { color: var(--muted); flex-shrink: 0; font-size: .85rem; }
    .attach-row.is-pending { border-style: dashed; color: var(--muted); }
    .attach-name {
      flex: 1 1 auto; min-width: 0; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      text-decoration: none;
    }
    a.attach-name:hover { color: var(--primary); text-decoration: underline; }
    .attach-size { flex-shrink: 0; color: var(--muted); font-size: .7rem; }
    .attach-del {
      flex-shrink: 0; width: 24px; height: 24px; border: none; border-radius: 6px;
      background: transparent; color: #CBD5E1; cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: .72rem;
    }
    .attach-del:hover { background: #FEF2F2; color: #EF4444; }
    .attach-thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .attach-thumb {
      width: 56px; height: 56px; border-radius: 8px; object-fit: cover;
      border: 1.5px solid var(--border); cursor: pointer; background: #F1F5F9;
    }
    .trip-attach-count {
      font-size: .72rem; color: var(--muted); margin-top: 2px;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .trip-note-text {
      font-size: .72rem; color: var(--muted); margin-top: 2px;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .vehicle-add-link {
      font-size: .74rem; font-weight: 600; color: var(--primary);
      text-decoration: none;
    }
    .vehicle-add-link:hover { text-decoration: underline; }

    /* ── Trip row subtext ────────────────────── */
    .trip-sub { font-size: .72rem; color: var(--muted); margin-top: 2px; }
    .trip-mi { padding-top: 2px; }
    .trip-actions { padding-top: 1px; }

    /* ── Edit modal extras ───────────────────── */
    /* Sits inline beside the mileage box rather than under a field, so it does
       not take the vehicle hint's top margin. */
    .measure-error { margin-top: 0; }
    .modal-field select {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif; font-size: .9rem; color: var(--text);
      outline: none; transition: border-color .2s, box-shadow .2s;
      background: white;
    }

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ─── Time format ──────────────────────────────────────────────────────────

let timeFormat = localStorage.getItem('timeFormat') || '12h';

function setTimeFormat(fmt) {
  timeFormat = fmt;
  localStorage.setItem('timeFormat', fmt);
  document.getElementById('toggle12h').classList.toggle('active', fmt === '12h');
  document.getElementById('toggle24h').classList.toggle('active', fmt === '24h');
  refreshTimeDisplays();
}

function formatTime(hhmm) {
  if (!hhmm) return '';
  const [h, m] = hhmm.split(':').map(Number);
  if (timeFormat === '24h') return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  const ampm = h < 12 ? 'AM' : 'PM';
  return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${ampm}`;
}

// The end date a trip's times imply on their own: its trip date, or the day
// after when the clock wrapped. Mirrors _derived_end_date() in main.py, and like
// it can only say same-day or next-day — a longer trip needs the field.
// days is how many midnights the trip crossed. Passed in when it is known from
// the drive's own length; otherwise inferred from the times, which can only ever
// tell same-day from next-day.
function addDays(tripDate, days) {
  const [y, mo, dd] = (tripDate || '').split('-').map(Number);
  if ([y, mo, dd].some(Number.isNaN)) return '';
  const d = new Date(y, mo - 1, dd + days);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

const MAX_TRIP_DAYS = 30;

// Mirrors validate_end_date() in main.py. An end date in the future is allowed:
// a trip that sets out at 23:30 and arrives at 01:00 is logged before it ends,
// and the start time defaults to now, so refusing that would refuse the very
// case the estimate exists for.
function validateEndDate(endDate, tripDate) {
  if (!endDate) return null;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(endDate)) return 'Please enter a valid end date.';
  if (!tripDate) return null;
  if (endDate < tripDate) return 'End date cannot be before the trip date.';
  const days = Math.round((new Date(endDate) - new Date(tripDate)) / 86400000);
  if (days > MAX_TRIP_DAYS) return `A trip cannot run longer than ${MAX_TRIP_DAYS} days.`;
  return null;
}

function derivedEndDate(tripDate, start, end, days = null) {
  if (!tripDate || !end) return '';
  return addDays(tripDate, days != null ? days : (endsNextDay(start, end) ? 1 : 0));
}

// Keeps the log form's end date in step with the times. The field is revealed
// only once the trip does not end on its own date, and follows the times until
// the user sets it themselves — at which point it is theirs, the same rule the
// end time follows.
// Says how long the modal's trip spans, so a date two days after the trip date
// reads as deliberate rather than as a typo.
// The modal's end date followed nothing: it was prefilled from the stored trip
// and then sent back unchanged, so editing an overnight trip to end at 22:00
// kept the next day's date and stored a 24-hour trip. It now tracks the times
// the same way the log form's does.
//
// Whether the stored date counts as the user's own is decided by comparing it
// against what the stored times imply: a date that matches is derived and should
// keep following, while one that differs can only have been set deliberately —
// a multi-day trip — and must not be overwritten.
function syncEditEndDate() {
  const dateEl = document.getElementById('editEndDate');
  const tripDate = document.getElementById('editTripDate').value;
  if (!dateEl) return;
  if (!dateEl._userSet) {
    dateEl.value = derivedEndDate(tripDate,
                                  document.getElementById('editStartTime').value,
                                  document.getElementById('editEndTime').value);
  }
  dateEl.min = tripDate || '';
  dateEl.removeAttribute('max');
  syncEditEndDateHint();
}

function syncEditEndDateHint() {
  const hint = document.getElementById('editEndDateHint');
  if (!hint) return;
  const tripDate = document.getElementById('editTripDate').value;
  const endDate  = document.getElementById('editEndDate').value;
  if (!tripDate || !endDate || endDate === tripDate) { hint.textContent = ''; return; }
  const days = Math.round((new Date(endDate) - new Date(tripDate)) / 86400000);
  hint.textContent = days === 1
    ? 'Ends the next day.'
    : days > 1 ? `Ends ${days} days later.` : 'End date is before the trip date.';
}

// A date the user types into the end field is theirs; clearing it hands it back.
['input', 'change'].forEach(ev =>
  document.getElementById('editEndDate').addEventListener(ev, e => {
    e.target._userSet = !!e.target.value;
    syncEditEndDateHint();
  }));
// Anything that moves the span re-derives the end date.
['editTripDate', 'editStartTime', 'editEndTime'].forEach(id =>
  ['input', 'change'].forEach(ev =>
    document.getElementById(id).addEventListener(ev, syncEditEndDate)));

// Keeps the end date in step with the times. The field is always on screen, so
// this only fills it: it follows the times until the user sets it themselves, at
// which point it is theirs — the same rule the end time follows.
function syncTripEndDate() {
  const dateEl = document.getElementById('tripEndDate');
  const tripDate = document.getElementById('tripDate').value;
  const start = document.getElementById('tripStartTime').value;
  const end = document.getElementById('tripEndTime').value;
  if (!dateEl) return;

  // The estimate knows how many days its drive spanned; a time the user typed
  // does not, so that falls back to what the clock alone can imply.
  const days = document.getElementById('tripEndTime')._derived ? estimatedEndDays : null;
  if (!dateEl._userSet) dateEl.value = derivedEndDate(tripDate, start, end, days);
  dateEl.min = tripDate || '';
  // No max: a trip logged as it sets out legitimately ends tomorrow.
  dateEl.removeAttribute('max');
}

['input', 'change'].forEach(ev =>
  document.getElementById('tripEndDate').addEventListener(ev, e => {
    // Cleared, so it goes back to following the times.
    e.target._userSet = !!e.target.value;
    syncTripEndDate();
  }));

// Mirrors _ends_next_day() in main.py: an end time strictly earlier than the
// start is the only way one trip date can say the clock crossed midnight.
// Strictly earlier, so equal times stay a zero-length trip.
//
// This and derivedEndDate() and elapsedSeconds() all restate server rules,
// because the form has to show an answer before it submits anything. The server
// decides what is stored and never trusts these, so a drift shows up as the page
// disagreeing with what it saved rather than as bad data — but keep the pairs in
// step, and keep .github/scripts/check_trip_times.py as the record of what the
// rules are:
//   endsNextDay     ↔ _ends_next_day
//   derivedEndDate  ↔ _derived_end_date
//   elapsedSeconds  ↔ _elapsed_seconds
//   validateEndDate ↔ validate_end_date
function endsNextDay(start, end) {
  if (!start || !end) return false;
  const mins = v => { const [h, m] = v.split(':').map(Number);
                      return Number.isNaN(h) || Number.isNaN(m) ? null : h * 60 + m; };
  const s = mins(start), e = mins(end);
  return s !== null && e !== null && e < s;
}

// How many days after the trip date the trip ended. Taken from the two dates
// when both are known, because a trip spanning more than one night can have an
// end time later in the clock than its start and would otherwise look same-day.
// Falls back to the times for a trip stored before end_date existed.
function dayOffset(startTime, endTime, tripDate, endDate) {
  if (tripDate && endDate) {
    return Math.round((new Date(endDate) - new Date(tripDate)) / 86400000);
  }
  return endsNextDay(startTime, endTime) ? 1 : 0;
}

// A trip that ends on another day names that day beside its arrival time, rather
// than carrying a "+1 day" the reader has to apply to a date elsewhere on the
// row. The year is repeated only when the trip crosses into a different one.
function formatTimeRange(s, e, tripDate, endDate) {
  if (!s && !e) return '';
  if (!s || !e) return formatTime(s || e);
  if (dayOffset(s, e, tripDate, endDate) <= 0) {
    return `${formatTime(s)} – ${formatTime(e)}`;
  }
  const shown = endDate || derivedEndDate(tripDate, s, e);
  if (!shown) return `${formatTime(s)} – ${formatTime(e)}`;
  const sameYear = !!tripDate && shown.slice(0, 4) === tripDate.slice(0, 4);
  return `${formatTime(s)} – ${formatTripDate(shown, { withYear: !sameYear })} ${formatTime(e)}`;
}

const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// withYear is dropped where the year is already established nearby — an end date
// shown beside its start date repeats it for no one's benefit, unless the trip
// happens to cross New Year.
function formatTripDate(dateStr, { withYear = true } = {}) {
  if (!dateStr) return '';
  const [y, mo, d] = dateStr.split('-').map(Number);
  if ([y, mo, d].some(Number.isNaN)) return '';
  return `${MONTH_NAMES[mo - 1]} ${d}${withYear ? `, ${y}` : ''}`;
}

// A date and a time as one phrase, for places that show a single moment.
function formatDateTime(dateStr, hhmm) {
  return [formatTripDate(dateStr), formatTime(hhmm)].filter(Boolean).join(' ');
}

function refreshTimeDisplays() {
  document.querySelectorAll('.trip-time-display').forEach(el => {
    el.textContent = formatTimeRange(el.dataset.rawStart, el.dataset.rawEnd,
                                     el.dataset.tripDate, el.dataset.endDate) || '–';
  });
}


// ─── Vehicle management ───────────────────────────────────────────────────
// Full CRUD lives on the /my-vehicles page; the dashboard only needs the
// list to populate trip-form vehicle selects.

let vehiclesList = [];

async function loadVehicles() {
  try {
    const resp = await fetch('/vehicles');
    vehiclesList = await resp.json();
    populateVehicleSelects();
  } catch { /* non-fatal */ }
}

function populateVehicleSelects() {
  document.querySelectorAll('.vehicle-select').forEach(sel => {
    const cur = sel.value;
    sel.innerHTML = '<option value="">— No vehicle (optional) —</option>';
    vehiclesList.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.id;
      opt.textContent = v.name;
      opt.dataset.sub = v.sub || '';
      sel.appendChild(opt);
    });
    sel.value = cur;
  });
  applyDefaultVehicle();
}

// The default vehicle preselects the new-trip form only, and only while the
// user hasn't chosen something themselves. The edit modal is deliberately
// excluded: it shows the vehicle a trip was logged with, and defaulting there
// would silently rewrite that on save. Vehicle stays optional — this picks the
// starting value, it doesn't stop anyone clearing it.
function applyDefaultVehicle() {
  const sel = document.getElementById('tripVehicle');
  if (!sel || sel.value) return;
  const def = vehiclesList.find(v => v.is_default);
  if (!def) return;
  sel.value = def.id;
  vehicleHintChange('tripVehicle', 'tripVehicleHint');
}

// Date and start time default to now, so logging a trip just after taking it —
// the common case — needs no date or time entry at all. Like the default
// vehicle, this only fills empty fields, so a restored draft or a value the
// user already chose is never overwritten.
//
// Both are read fresh on every call rather than from the cached TODAY_ISO: the
// page can sit open across midnight, and logging several trips in a row should
// stamp each with the time it was actually logged, not when the page loaded.
//
// _userSet is set deliberately. getTimeValue() only submits a time the user is
// taken to have chosen, so without it the form would display a start time that
// silently never reached the saved trip. The end time is left empty on purpose:
// it isn't known until the trip is over, and guessing it would put a wrong
// duration into the feasibility check.
function applyTripDateTimeDefaults() {
  const dateEl = document.getElementById('tripDate');
  if (dateEl && !dateEl.value) {
    dateEl.value = localToday();
    dateEl._defaulted = true;   // page-filled: saveTripDraft leaves it out
  }

  const timeEl = document.getElementById('tripStartTime');
  if (timeEl && !timeEl.value) {
    timeEl.value = localNowTime();
    timeEl._userSet = true;
    timeEl._defaulted = true;
  }
}

// The stamp above is only as fresh as the last time it ran, and a phone user
// rarely reloads: the page is opened, backgrounded while the trip is driven,
// and brought back hours later, when a trip logged from it would carry the
// time the page was opened. Restamp whenever the page becomes visible again,
// but only fields still holding the page's own value — anything the user
// picked is theirs to keep. Today's date is re-derived at the same moment,
// since a page carried across midnight would otherwise treat today as the
// future and refuse the trip.
function refreshTripDateTimeDefaults() {
  applyTripMaxDate();

  // An end time means the user is logging a trip that is already over, so
  // "now" has stopped being a sensible guess at when it started: restamping
  // could push the start past the end, which elapsedSeconds() would read as
  // an overnight trip and warn about. Leave the form alone from then on.
  const endEl = document.getElementById('tripEndTime');
  if (endEl && endEl._userSet && endEl.value && !endEl._derived) return;

  const dateEl = document.getElementById('tripDate');
  if (dateEl && dateEl._defaulted) dateEl.value = localToday();

  const timeEl = document.getElementById('tripStartTime');
  if (timeEl && timeEl._defaulted) timeEl.value = localNowTime();

  // Setting .value fires no input event, so nothing else would move the
  // estimated end time along with the start it is measured from.
  applyEndTimeEstimate();
}

// pageshow covers a restore from the back/forward cache, where no script
// re-runs at all; visibilitychange covers tab and app switching.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refreshTripDateTimeDefaults();
});
window.addEventListener('pageshow', refreshTripDateTimeDefaults);

let businessesList = [];

async function loadBusinesses() {
  try {
    const resp = await fetch('/businesses');
    businessesList = await resp.json();
    populateBusinessSelects();
  } catch { /* non-fatal */ }
}

function populateBusinessSelects() {
  document.querySelectorAll('.business-select').forEach(sel => {
    const cur = sel.value;
    sel.innerHTML = '<option value="">— No business (optional) —</option>';
    businessesList.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b.id;
      opt.textContent = b.name;
      sel.appendChild(opt);
    });
    sel.value = cur;
  });
  applyDefaultBusiness();
}

// Same rules as the default vehicle: fills the new-trip form only, only when
// nothing is chosen, and never the edit modal — defaulting there would rewrite
// which business an existing trip was attributed to on save.
function applyDefaultBusiness() {
  const sel = document.getElementById('tripBusiness');
  if (!sel || sel.value) return;
  const def = businessesList.find(b => b.is_default);
  if (!def) return;
  sel.value = def.id;
}

const NOTES_MAX = 500;

// Shows remaining characters only as the limit approaches, so the counter is
// not noise on a short note. maxlength already stops typing past the cap; the
// server truncates too, since maxlength is trivially bypassed.
function wireNotesCounter(textareaId, counterId) {
  const el = document.getElementById(textareaId);
  const out = document.getElementById(counterId);
  if (!el || !out) return;
  const update = () => {
    const left = NOTES_MAX - el.value.length;
    out.textContent = left <= 100 ? `${left} characters left` : '';
  };
  el.addEventListener('input', update);
  update();
}

function vehicleHintChange(selectId, hintId) {
  const sel  = document.getElementById(selectId);
  const hint = document.getElementById(hintId);
  const opt  = sel.options[sel.selectedIndex];
  hint.textContent = opt?.dataset.sub || '';
}


// ─── Trip form draft ──────────────────────────────────────────────────────
// Navigating to /my-vehicles (e.g. the "+ Add" link, or the navbar's
// Vehicles item) can replace this page in place rather than opening a new
// tab — notably when installed as a standalone PWA, where target="_blank"
// has no tab strip to open into. Snapshot the in-progress trip form before
// leaving and restore it if/when the user comes back to this page.
const TRIP_DRAFT_KEY = 'tripFormDraft';

function saveTripDraft() {
  const el = id => document.getElementById(id);
  // Every row, blanks included, because a label's position is what makes it the
  // start or the end. Dropping blanks first would slide the rest up: an address
  // typed into the end row of an otherwise empty form would come back as the
  // start, silently changing which way the trip ran.
  //
  // Still left undefined when every row is blank, so an untouched form is not a
  // draft: an array is truthy whatever it holds, and saving one would bring back
  // the bug where returning to the page wiped the preselected default vehicle.
  const locations = tripRoute.allRows().map(l => l.label);
  const draft = {
    notes:   el('tripNotes').value,
    locations: locations.some(Boolean) ? locations : undefined,
  };
  // An estimated end time is left out for the same reason as the stamped start
  // time: it is the page's value, not the user's, and restoring it would freeze
  // an estimate made for a route or a start time that may since have changed.
  if (!el('tripEndTime')._derived) draft.endTime = el('tripEndTime').value;
  // A draft records what the user chose or typed — not what the page filled in
  // for them. A vehicle or business that is only there because it's the
  // default is left out, so coming back applies whatever the default is *then*
  // rather than the one in force when they left; saving it is what wiped a
  // newly starred default, and reinstated an old one after switching. The date
  // and start time the page stamps are left out for the same reason, and
  // because restoring them would bring back a stale "now" instead of a fresh one.
  if (el('tripVehicle')._userSet)      draft.vehicleId  = el('tripVehicle').value;
  if (el('tripBusiness')._userSet)     draft.businessId = el('tripBusiness').value;
  if (!el('tripDate')._defaulted)      draft.tripDate   = el('tripDate').value;
  if (!el('tripStartTime')._defaulted) draft.startTime  = el('tripStartTime').value;

  // An untouched form is not a draft, or every return to the page would
  // restore emptiness over what the page sets up. A vehicle or business the
  // user picked counts even when it's "No vehicle" — that is a deliberate
  // clear, and it should survive.
  const hasContent = Object.values(draft).some(Boolean) || 'vehicleId' in draft || 'businessId' in draft;
  if (!hasContent) {
    sessionStorage.removeItem(TRIP_DRAFT_KEY);
    return;
  }
  sessionStorage.setItem(TRIP_DRAFT_KEY, JSON.stringify(draft));
}
window.addEventListener('pagehide', saveTripDraft);

function restoreTripDraft() {
  const raw = sessionStorage.getItem(TRIP_DRAFT_KEY);
  if (!raw) return;
  sessionStorage.removeItem(TRIP_DRAFT_KEY);

  let draft;
  try { draft = JSON.parse(raw); } catch { return; }

  // Tested for presence rather than truthiness so an empty value restores too:
  // that means the user had deliberately cleared the vehicle before leaving,
  // and a draft is a record of what they actually had on screen, so it wins
  // over the default that populateVehicleSelects just applied.
  // The draft only holds a vehicle or business the user picked, so one that
  // comes back is marked as picked and survives the next trip away.
  if ('vehicleId' in draft) {
    const sel = document.getElementById('tripVehicle');
    sel.value = draft.vehicleId;
    sel._userSet = true;
    vehicleHintChange('tripVehicle', 'tripVehicleHint');
  }
  if ('businessId' in draft) {
    const sel = document.getElementById('tripBusiness');
    sel.value = draft.businessId;
    sel._userSet = true;
  }
  if ('notes' in draft) document.getElementById('tripNotes').value = draft.notes;
  // Text only, never a place ID, so a restored location routes by address. This
  // runs after an await, so a fast user may already have picked a suggestion —
  // setAll replaces the rows outright rather than pairing their fresh place ID
  // with the draft's text.
  if (Array.isArray(draft.locations)) {
    tripRoute.setAll(draft.locations.map(label => ({ label })));
    refreshPlaceWarnings();
  }
  if (draft.tripDate) {
    const dateEl = document.getElementById('tripDate');
    dateEl.value = draft.tripDate;
    dateEl._defaulted = false;
  }
  [['tripStartTime', draft.startTime], ['tripEndTime', draft.endTime]].forEach(([id, val]) => {
    if (!val) return;
    const el = document.getElementById(id);
    el.value = val;
    el._userSet = true;
    el._defaulted = false;
  });
}


// ─── Address autocomplete (Google Places) ─────────────────────────────────

const MAPS_BROWSER_KEY = {{ maps_browser_key | tojson }};

// Autocomplete is billed per request, not per session, because we take the
// placeId straight off the prediction and never call Place Details. These two
// knobs are the whole API bill: at ~6 requests per field the free tier covers
// roughly 830 trips/month, at ~4 it covers about 2,500. Raise them further if
// usage climbs; lower them only if the suggestions feel unresponsive.
const AUTOCOMPLETE_DEBOUNCE_MS = 800;
const AUTOCOMPLETE_MIN_CHARS   = 5;

// Recent addresses are matched locally against history already in memory, so
// they cost nothing and can appear earlier and more eagerly than Places results.
const RECENT_MIN_CHARS = 2;
const RECENT_MAX       = 3;

// Where this user's trips actually happen, remembered from the last route the
// server resolved. Without it Places resolves a bare name like "Home Depot"
// against the requester's IP, which picks a branch by network location rather
// than by where the user drives — a few miles off in the same city at best,
// another state at worst. Per-device and non-essential, so a browser that
// refuses storage just gets unbiased suggestions.
const BIAS_KEY = 'tripBiasCenter';
// Roughly a metro area, and the maximum a Places circle bias accepts.
const BIAS_RADIUS_M = 50000;

function rememberBiasCenter(endpoints) {
  const pts = [endpoints?.start, endpoints?.end].filter(p => p && typeof p.lat === 'number');
  if (!pts.length) return;
  const center = { lat: pts.reduce((a, p) => a + p.lat, 0) / pts.length,
                   lng: pts.reduce((a, p) => a + p.lng, 0) / pts.length };
  try { localStorage.setItem(BIAS_KEY, JSON.stringify(center)); } catch { /* non-essential */ }
}

function autocompleteBias() {
  let c;
  try { c = JSON.parse(localStorage.getItem(BIAS_KEY) || 'null'); } catch { return null; }
  if (!c || typeof c.lat !== 'number' || typeof c.lng !== 'number') return null;
  return { circle: { center: { latitude: c.lat, longitude: c.lng }, radius: BIAS_RADIUS_M } };
}

// A location routed by text rather than a place ID is geocoded server-side,
// where there is no user to bias toward. That is accurate for a street address
// and a coin toss for a chain name, so the two are told apart before warning.
const STREET_SUFFIXES = /\b(st|street|ave|avenue|rd|road|dr|drive|ln|lane|blvd|boulevard|way|ct|court|cir|circle|pkwy|parkway|hwy|highway|ter|terrace|pl|place|trail|trl|loop|pike)\b\.?/i;
function looksLikeStreetAddress(text) {
  const t = (text || '').trim();
  if (!t) return true;
  if (/^\d+\s/.test(t)) return true;               // "4400 Sharon Road"
  if (/\b\d{5}(-\d{4})?\b/.test(t)) return true;   // has a ZIP
  // A street suffix alone is not enough: plenty of businesses end in Court,
  // Place or Way, and treating those as addresses swallowed the warning for
  // exactly the names it is meant to catch. A street with no number geocodes
  // to the middle of the street anyway, so it is worth warning about too.
  return /\d/.test(t) && STREET_SUFFIXES.test(t);
}

// Place ID of the suggestion the user picked for each field, keyed by input id.
// Null whenever the text was typed or dictated rather than chosen, in which
// case the server routes by address string instead.
// Keyed by input id. Every location row is created at runtime, so there are no
// fixed entries; a row's id is deleted along with its row.
const selectedPlaceIds = {};

// Setting .value in code does not fire an input event, so the listener that
// normally clears a field's place ID never runs. Any programmatic write must
// therefore invalidate it here, or the field can show one address while the
// trip routes by a place ID belonging to an entirely different location —
// mileage for somewhere the user never saw. Callers that immediately assign a
// real place ID (applySuggestion, a successful voice resolution) set it after.
function setLocationText(input, text) {
  input.value = text;
  selectedPlaceIds[input.id] = null;
  // The voice confirm bar and the valid tick both vouch for the text that was
  // there, and both are otherwise dismissed only by a real input event — which
  // setting .value does not fire. Left alone, a cleared field keeps a bar
  // offering the old address, and accepting it marks an empty input valid.
  input.classList.remove('is-valid');
  const wrapper = input.closest('.autocomplete-wrapper');
  wrapper?.querySelector('.confirm-bar')?.classList.remove('show');
  const dd = wrapper?.querySelector('.autocomplete-dropdown');
  if (dd) hideDropdown(dd);
}

function setupAutocomplete(inputId, dropdownId) {
  const input = document.getElementById(inputId);
  const dropdown = document.getElementById(dropdownId);
  let debounceTimer = null;

  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    // Typing invalidates any previously picked suggestion — the text no longer
    // describes that place, so fall back to address routing until they pick again.
    selectedPlaceIds[inputId] = null;
    refreshPlaceWarnings();
    const q = input.value.trim();
    // Recent addresses need no request, so show them straight away rather than
    // making the user wait out a debounce meant for the Places call.
    const recents = recentAddressMatches(q, RECENT_MAX);
    if (q.length < AUTOCOMPLETE_MIN_CHARS) {
      renderDropdown(input, dropdown, recents, []);
      return;
    }
    renderDropdown(input, dropdown, recents, []);
    debounceTimer = setTimeout(() => fetchSuggestions(q, input, dropdown), AUTOCOMPLETE_DEBOUNCE_MS);
  });

  input.addEventListener('keydown', (e) => {
    // Indexed over the items rather than walking siblings: the list now carries
    // section headings between entries, and a sibling step would land on one,
    // highlighting a row that cannot be chosen and leaving Enter with no label.
    const items = [...dropdown.querySelectorAll('.autocomplete-item')];
    const active = dropdown.querySelector('.autocomplete-item.active');
    const at = items.indexOf(active);
    const moveTo = (i) => {
      if (!items.length) return;
      active && active.classList.remove('active');
      const el = items[(i + items.length) % items.length];
      el.classList.add('active');
      el.scrollIntoView({ block: 'nearest' });
    };
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      moveTo(at + 1);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      moveTo(at === -1 ? items.length - 1 : at - 1);
    } else if (e.key === 'Enter' && active) {
      e.preventDefault();
      applySuggestion(input, dropdown, active.dataset.label, active.dataset.placeId);
    } else if (e.key === 'Escape') {
      hideDropdown(dropdown);
    }
  });

  document.addEventListener('click', (e) => {
    if (!input.contains(e.target) && !dropdown.contains(e.target)) hideDropdown(dropdown);
  });
}

// Addresses already used on a trip, newest first, deduped by text. Both ends of
// every trip are candidates. The place ID recorded with the trip comes along,
// so re-picking a known address routes by ID exactly as the original trip did —
// and costs no Places request at all.
//
// Read from tripsData, which the history already holds, so this needs no
// endpoint and no query of its own.
function recentAddressMatches(query, limit) {
  const q = query.trim().toLowerCase();
  if (q.length < RECENT_MIN_CHARS) return [];
  // Every word must appear somewhere in the address, rather than the whole
  // query appearing as one run of characters. Addresses carry street, city and
  // state between the parts a user actually types, so "home depot charlotte"
  // has to match "The Home Depot, Albemarle Road, Charlotte, NC, USA" — a
  // contiguous test misses it on the road name sitting in the middle.
  const terms = q.split(/\s+/).filter(Boolean);
  const seen = new Set();
  const out = [];
  for (const t of tripsData) {
    const places = [[t.start, t.start_place_id],
                    ...(t.stops || []).map(st => [st.label, st.place_id]),
                    [t.end, t.end_place_id]];
    for (const [label, placeId] of places) {
      if (!label) continue;
      const key = label.toLowerCase();
      if (seen.has(key)) continue;
      seen.add(key);
      if (terms.every(term => key.includes(term))) out.push({ label, placeId: placeId || null });
      if (out.length >= limit) return out;
    }
  }
  return out;
}

function buildAutocompleteItem(input, dropdown, label, placeId, isRecent) {
  const item = document.createElement('div');
  item.className = 'autocomplete-item' + (isRecent ? ' is-recent' : '');
  item.dataset.label = label;
  if (placeId) item.dataset.placeId = placeId;
  const icon = document.createElement('i');
  icon.className = `ac-icon fas ${isRecent ? 'fa-clock-rotate-left' : 'fa-location-dot'}`;
  const text = document.createElement('span');
  text.textContent = label;
  item.append(icon, text);
  item.addEventListener('mousedown', (e) => {
    e.preventDefault();
    applySuggestion(input, dropdown, label, placeId);
  });
  return item;
}

function addSectionHeading(dropdown, text) {
  const h = document.createElement('div');
  h.className = 'autocomplete-section';
  h.textContent = text;
  dropdown.appendChild(h);
}

// Renders both sections. Recent addresses lead because they are the ones the
// user has actually driven; Places results follow. A Places result matching a
// recent address is dropped rather than listed twice.
function renderDropdown(input, dropdown, recents, predictions) {
  const taken = new Set(recents.map(r => r.label.toLowerCase()));
  const fresh = predictions.filter(p => !taken.has(p.text.text.toLowerCase()));
  if (!recents.length && !fresh.length) { hideDropdown(dropdown); return; }

  dropdown.innerHTML = '';
  if (recents.length) {
    addSectionHeading(dropdown, 'Recent addresses');
    recents.forEach(r => dropdown.appendChild(
      buildAutocompleteItem(input, dropdown, r.label, r.placeId, true)));
  }
  if (fresh.length) {
    if (recents.length) addSectionHeading(dropdown, 'Search results');
    fresh.slice(0, 6).forEach(p => dropdown.appendChild(
      buildAutocompleteItem(input, dropdown, p.text.text, p.placeId, false)));
  }
  dropdown.classList.remove('d-none');
  fitDropdownToScroller(dropdown);
}

// Commit a suggestion to the input, remembering its place ID so the trip is
// routed by the exact place rather than by re-resolving this text.
function applySuggestion(input, dropdown, label, placeId) {
  input.value = label;
  selectedPlaceIds[input.id] = placeId || null;
  hideDropdown(dropdown);
  refreshPlaceWarnings();
}

// Places Autocomplete (New). Only the placeId and the display text are used.
//
// No session token is sent, deliberately. Sessions only pay off when they end
// in a billable Place Details call; we take the placeId straight off the
// prediction and never call Place Details, so each request bills individually
// under the Essentials "Autocomplete Requests" SKU either way. Adding a token
// would move this onto session billing for no benefit.
//
// The region is deliberately unrestricted. Pinning it to the US made a foreign
// address resolve to a plausible but wrong domestic one ("123 Yonge Street,
// Toronto, ON" came back as "123 Utopia Street, North Topsail Beach") rather
// than simply returning nothing — the exact silent-wrong-place failure this
// migration set out to remove. Results are already biased toward the user's
// location by their IP, so nearby matches surface without the hard filter.
// A name with no place ID is the case that silently mismeasures: the server
// geocodes the text with nothing to go on, so "Home Depot" can land on any
// branch. Say so rather than blocking — the text may well be a real address
// the autocomplete never offered, and the distance is still worth having.
// Every location on a trip is routed the same way, so every one of them —
// start, end and each stop, on the new-trip form and in the edit modal — is
// checked by the same rule. A stop routed by name is as wrong as an endpoint
// routed by name, and the edit modal is where a trip logged that way gets
// looked at again.
function namedLocations(fields) {
  return fields
    .filter(f => f.value && !f.placeId && !looksLikeStreetAddress(f.value))
    .map(f => f.name);
}

function placeWarningText(names) {
  if (!names.length) return null;
  const list = names.length === 1 ? names[0]
    : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
  return `Pick the ${list} location${names.length > 1 ? 's' : ''} from the suggestions ` +
         `for an exact distance — a name on its own can match a different branch ` +
         `than the one you meant.`;
}

// Reads the live rows rather than a snapshot: locations are added, removed and
// reordered while the form is open, and each is named by the position it holds
// now — so moving a row changes which one the warning calls the start.
function routeFields(editor) {
  const rows = editor.allRows();
  return rows.map((l, i) => ({
    name: i === 0 ? 'start' : i === rows.length - 1 ? 'end' : `stop ${i}`,
    value: l.label,
    placeId: l.place_id,
  }));
}

function updatePlaceWarning() {
  updateSpeedWarning('tripPlaceWarning', 'tripPlaceWarningText',
                     placeWarningText(namedLocations(routeFields(tripRoute))));
}

// setupAutocomplete drives the fields of both forms, so it cannot know which
// one a given input belongs to. Refresh both; the edit one is a no-op unless
// the modal is open.
function refreshPlaceWarnings() {
  updatePlaceWarning();
  updateEditPlaceWarning();
  // Every edit, addition, removal and move of a location reaches this one
  // function, which makes it the reliable place to remeasure from. The route
  // key makes a change that leaves the route identical a no-op rather than a
  // request, so calling it for both forms costs nothing. The estimated end time
  // follows from the trip form's measurement, so it needs no call of its own.
  scheduleRouteMeasurements();
}

// The modal's rows carry their own place IDs, cleared the moment a row's text is
// edited, so one rule now covers both forms — no equivalent of placeIdsForEdit's
// text comparison is needed to tell a reopened location from a retyped one.
function updateEditPlaceWarning() {
  if (!editingTrip) return;
  updateSpeedWarning('editPlaceWarning', 'editPlaceWarningText',
                     placeWarningText(namedLocations(routeFields(editRoute))));
}

// Both Places calls send the same body, so the bias is applied in one place
// rather than remembered separately at each call site.
function placesBody(query) {
  const bias = autocompleteBias();
  return bias ? { input: query, locationBias: bias } : { input: query };
}

function fetchSuggestions(query, input, dropdown) {
  fetch('https://places.googleapis.com/v1/places:autocomplete', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Goog-Api-Key': MAPS_BROWSER_KEY,
    },
    body: JSON.stringify(placesBody(query))
  })
    .then(r => {
      // An error status still carries a JSON body, so without this check a 403
      // from a misconfigured key would fall through to the empty-results path
      // and look identical to "no matches".
      if (!r.ok) throw new Error(`Places autocomplete failed: HTTP ${r.status}`);
      return r.json();
    })
    .then(data => {
      // A response for text the user has since changed is stale: the input
      // listener has already drawn recents for the current text, and a newer
      // request may be on its way. Rendering this one would put back results
      // for a query that is no longer in the box.
      if (input.value.trim() !== query) return;
      const predictions = (data.suggestions || [])
        .map(s => s.placePrediction)
        .filter(p => p && p.placeId && p.text && p.text.text);
      // Recomputed rather than captured when the request was fired, so the
      // sections stay consistent if history loaded while it was in flight.
      renderDropdown(input, dropdown, recentAddressMatches(query, RECENT_MAX), predictions);
    })
    .catch(err => {
      // Log rather than swallow: a blocked provider, an expired key and a
      // dropped connection otherwise all present as an empty dropdown, which
      // makes an outage indistinguishable from a query with no matches.
      console.warn('[autocomplete]', err);
      // Keep the recent addresses: they come from history in memory and have
      // nothing to do with the request that failed, so a Places outage — or an
      // extension blocking the domain — shouldn't take them down with it.
      if (input.value.trim() !== query) return;
      renderDropdown(input, dropdown, recentAddressMatches(query, RECENT_MAX), []);
    });
}

// The edit modal's fields scroll, and a scroll container clips absolutely
// positioned descendants — this dropdown included, since its containing block
// (.autocomplete-wrapper) sits inside it. Fit the list to the room actually
// below the input, then nudge the container if it still overhangs, so
// suggestions are never cut off. Measured rather than assumed because the room
// depends on the window height: at a half-screen 1080p window the End Location
// list would otherwise be clipped. A no-op on the main form, which has no
// scrolling ancestor.
const DROPDOWN_MAX_H = 210;  // matches .autocomplete-dropdown's CSS max-height
const DROPDOWN_MIN_H = 96;   // still shows a usable list in a very short window

function fitDropdownToScroller(dropdown) {
  const scroller = dropdown.closest('.modal-body');
  if (!scroller) { dropdown.style.maxHeight = ''; return; }
  const room = scroller.getBoundingClientRect().bottom
             - dropdown.getBoundingClientRect().top - 8;
  dropdown.style.maxHeight =
    `${Math.max(DROPDOWN_MIN_H, Math.min(DROPDOWN_MAX_H, room))}px`;
  const overhang = dropdown.getBoundingClientRect().bottom
                 - scroller.getBoundingClientRect().bottom;
  if (overhang > 0) scroller.scrollTop += overhang + 8;
}

function hideDropdown(dropdown) {
  dropdown.classList.add('d-none');
  dropdown.innerHTML = '';
  dropdown.style.maxHeight = '';
}



// ─── Intermediate stops ───────────────────────────────────────────────────

// Mirrors MAX_STOPS in main.py: past 10 intermediates Routes bills at the Pro
// rate, so the server rejects more rather than silently changing the cost.
const MAX_STOPS = 10;
let stopSeq = 0;

function parseStops(raw) {
  try { const v = JSON.parse(raw || '[]'); return Array.isArray(v) ? v : []; }
  catch { return []; }
}

// Same shape of read for the attachment metadata parked on each trip row.
function parseAttachments(raw) {
  try { const v = JSON.parse(raw || '[]'); return Array.isArray(v) ? v : []; }
  catch { return []; }
}

// Identity of a route for "has this changed since the distance was calculated":
// the labels in order. Order is part of it — the same locations in a different
// order are a different drive, and a different mileage.
// Always built from allRows(), on both sides of the comparison: a key made from
// the non-blank rows could never match one made from all of them, and every save
// would recalculate.
function routeKey(locations) { return JSON.stringify(locations.map(l => l.label)); }

// A trip is one ordered list of locations, and nothing about a row says whether
// it is the start, the end or somewhere in between — that is purely its
// position. So there is a single kind of row, with the same autocomplete, voice
// input and place-ID tracking on all of them, and moving one carries its input
// (and therefore its place ID) with it. The server still stores a start, an end
// and the intermediates; routePayload() derives those three from the order.
//
// MIN_LOCATIONS is 2 because a route needs somewhere to leave from and somewhere
// to arrive at. The list never shrinks below that: the remove button on the last
// two rows clears the text instead of deleting the row, so the form always has
// the shape of a trip.
const MIN_LOCATIONS = 2;
const MAX_LOCATIONS = MAX_STOPS + 2;

function routeEditor(listId, addBtnId, variant, hintId) {
  const list = document.getElementById(listId);
  const addBtn = document.getElementById(addBtnId);
  const rows = () => [...list.querySelectorAll('.stop-row')];

  // Called after anything that changes the order or the number of rows, because
  // every row's badge, placeholder and available actions depend on where it sits.
  function refresh() {
    const rs = rows();
    rs.forEach((r, i) => {
      const last = i === rs.length - 1;
      const role = i === 0 ? 'start' : last ? 'end' : `stop ${i}`;
      const badge = r.querySelector('.loc-badge');
      badge.textContent = role;
      badge.classList.toggle('is-start', i === 0);
      badge.classList.toggle('is-end', last && rs.length > 1);
      r.querySelector('input').placeholder =
        i === 0 ? 'Where did you start?' : last ? 'Where did you end up?' : `Stop ${i}`;
      const icon = r.querySelector('.loc-icon i');
      if (icon) {
        icon.className = last && rs.length > 1 ? 'fas fa-map-marker-alt' : 'fas fa-circle';
        icon.style.color = i === 0 ? '#10B981' : last ? '#EF4444' : '#F59E0B';
        icon.style.fontSize = last && rs.length > 1 ? '.75rem' : '.45rem';
      }
      r.querySelector('[data-act="up"]').disabled = i === 0;
      r.querySelector('[data-act="down"]').disabled = last;
      const del = r.querySelector('[data-act="remove"]');
      del.title = rs.length > MIN_LOCATIONS ? 'Remove this location' : 'Clear this location';
    });
    addBtn.disabled = rs.length >= MAX_LOCATIONS;
    addBtn.title = rs.length >= MAX_LOCATIONS
      ? `A trip can have up to ${MAX_LOCATIONS} locations` : '';
    if (hintId) updateRouteHint(hintId, rs.length);
  }

  // Deleting a row below the minimum would leave a list that cannot describe a
  // trip, so the button empties the row instead. The user sees the same button
  // either way; its tooltip says which it will do.
  function remove(row) {
    if (rows().length > MIN_LOCATIONS) {
      delete selectedPlaceIds[row.querySelector('input').id];
      row.remove();
    } else {
      setLocationText(row.querySelector('input'), '');
    }
    refresh();
    refreshPlaceWarnings();
  }

  function add(label = '', placeId = null) {
    if (rows().length >= MAX_LOCATIONS) return null;
    const id = `${listId}-${++stopSeq}`;
    const row = document.createElement('div');
    row.className = 'stop-row';
    // The trip form has room for the icon and mic; the modal is narrower and
    // carries the plain input, as its fields did before.
    row.innerHTML =
      `<div class="loc-badge"></div>` +
      (variant === 'trip'
      ? `<div class="autocomplete-wrapper stop-field">
           <div class="input-row">
             <span class="loc-icon"><i class="fas fa-circle" style="color:#F59E0B;font-size:.45rem"></i></span>
             <input type="text" id="${id}" class="loc-input" autocomplete="off">
             <button class="mic-btn" type="button" id="${id}-mic" title="Voice input">
               <i class="fas fa-microphone"></i>
             </button>
           </div>
           <div class="autocomplete-dropdown d-none" id="${id}-dd"></div>
           <div class="confirm-bar" id="${id}-cb">
             <i class="fas fa-map-marker-alt" style="color:#F59E0B;flex-shrink:0;font-size:.8rem"></i>
             <span class="confirm-text" id="${id}-ct"></span>
             <button class="confirm-yes" id="${id}-cy">&#10003; Correct</button>
             <button class="confirm-edit" id="${id}-ce">&#9998; Edit</button>
           </div>
         </div>`
      : `<div class="autocomplete-wrapper stop-field">
           <input type="text" id="${id}" autocomplete="off">
           <div class="autocomplete-dropdown d-none" id="${id}-dd"></div>
         </div>`) +
      `<div class="stop-actions">
         <button type="button" class="stop-btn" data-act="up" title="Move earlier"><i class="fas fa-arrow-up"></i></button>
         <button type="button" class="stop-btn" data-act="down" title="Move later"><i class="fas fa-arrow-down"></i></button>
         <button type="button" class="stop-btn stop-del" data-act="remove"><i class="fas fa-times"></i></button>
       </div>`;
    list.appendChild(row);

    const input = row.querySelector('input');
    setupAutocomplete(id, `${id}-dd`);
    if (variant === 'trip') {
      setupVoice(`${id}-mic`, id, `${id}-cb`, `${id}-ct`, `${id}-cy`, `${id}-ce`, `${id}-dd`);
    }
    setLocationText(input, label);
    // After setLocationText, which clears it: a location restored from a saved
    // trip or a draft keeps its place ID until its text is edited.
    selectedPlaceIds[id] = placeId || null;

    refreshPlaceWarnings();
    row.querySelector('.stop-actions').addEventListener('click', (e) => {
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (!act) return;
      // remove() refreshes and re-warns for itself, either branch it takes.
      if (act === 'remove') { remove(row); return; }
      if (act === 'up' && row.previousElementSibling) list.insertBefore(row, row.previousElementSibling);
      else if (act === 'down' && row.nextElementSibling) list.insertBefore(row.nextElementSibling, row);
      refresh();
      // Moving a row changes which location is the start or the end, and the
      // warning names them by the role each one now holds.
      refreshPlaceWarnings();
    });
    refresh();
    return input;
  }

  // Empties the list back to the minimum shape rather than to nothing, so the
  // form is immediately usable again after a trip is logged.
  function reset() {
    rows().forEach(r => { delete selectedPlaceIds[r.querySelector('input').id]; r.remove(); });
    for (let i = 0; i < MIN_LOCATIONS; i++) add();
    refresh();
  }

  // Replaces the whole list with the given locations, keeping their order. An
  // empty list needs no placeholder entries: the pad below brings any short
  // list, including none at all, up to the minimum shape.
  function setAll(locations) {
    rows().forEach(r => { delete selectedPlaceIds[r.querySelector('input').id]; r.remove(); });
    locations.forEach(l => add(l.label || '', l.place_id || null));
    while (rows().length < MIN_LOCATIONS) add();
    refresh();
  }

  // Locations in visit order, blanks dropped, each with the place ID picked for
  // it. Blanks are dropped rather than rejected so an empty middle row is
  // simply not a location, the way an empty stop always was.
  function values() {
    return rows()
      .map(r => { const inp = r.querySelector('input');
                  return { label: inp.value.trim(), place_id: selectedPlaceIds[inp.id] || null }; })
      .filter(l => l.label);
  }

  // Every row, blank ones included, for the warning to name by position.
  function allRows() {
    return rows().map(r => { const inp = r.querySelector('input');
                             return { label: inp.value.trim(), place_id: selectedPlaceIds[inp.id] || null }; });
  }

  // Appends, then lifts the new row above the last one. Plain appending would
  // make a blank row the destination and demote the trip's actual end to a
  // stop, which looks broken even though a single arrow click undoes it. The
  // row is still free to move anywhere afterwards, including past the end.
  function addStop() {
    const input = add();
    if (!input) return null;
    const rs = rows();
    // Below this the appended row is the whole second half of the minimum
    // shape, and lifting it would make it the start instead.
    if (rs.length > MIN_LOCATIONS) list.insertBefore(rs[rs.length - 1], rs[rs.length - 2]);
    refresh();
    refreshPlaceWarnings();
    return input;
  }

  addBtn.addEventListener('click', () => addStop()?.focus());
  return { add, addStop, reset, setAll, values, allRows, count: () => rows().length };
}

// Tells the user what the list currently amounts to, so "start" and "end"
// meaning first and last is stated rather than left to be inferred.
function updateRouteHint(hintId, count) {
  const hint = document.getElementById(hintId);
  if (!hint) return;
  const stops = Math.max(0, count - 2);
  hint.textContent = stops
    ? `first is the start, last is the end · ${stops} stop${stops === 1 ? '' : 's'} between`
    : 'first is the start, last is the end';
}

// The server still takes a start, an end and the intermediates, so the order on
// screen is turned into that shape here — the one place that knows the first and
// last locations are special.
//
// Built from every row, not from the non-blank ones: dropping blanks first would
// slide the rest up, so a blank first row would submit the next location as the
// start while its badge still called it a stop. The ends are required exactly
// where they sit; a blank row in the middle is simply not a stop.
function routeFromLocations(rows) {
  const first = rows[0], last = rows[rows.length - 1];
  if (rows.length < MIN_LOCATIONS || !first.label || !last.label) return null;
  return {
    start: first.label,
    start_place_id: first.place_id,
    end: last.label,
    end_place_id: last.place_id,
    stops: rows.slice(1, -1).filter(l => l.label),
  };
}

function routePayload(editor) { return routeFromLocations(editor.allRows()); }

// Declared here rather than beside their use: building the first rows refreshes
// the warnings, which schedules a route measurement and asks whether the modal
// is open, and a binding further down the file is still in its dead zone then.
let editingTrip = null;
const MEASURE_DEBOUNCE_MS = 700;
// One measurement per form. The estimated end time reads its duration from
// tripMeasure rather than keeping a second copy of the same request.
const tripMeasure = newMeasureState();
const editMeasure = newMeasureState();
// The exact string the estimate last wrote into the end time field. Whether the
// field still holds the estimate is decided by comparing against this rather
// than by which event arrived: one user edit fires input and then change, so a
// flag cleared on the first and set on the second (or the reverse) flips back.
let estimatedEndValue = null;
// How many midnights the estimated drive crossed. Null whenever the end time is
// not the estimate's, in which case only the times are available and they can
// say at most "next day".
let estimatedEndDays = null;

const tripRoute = routeEditor('tripRoute', 'tripAddStop', 'trip', 'routeHint');
const editRoute = routeEditor('editRoute', 'editAddStop', 'edit');
tripRoute.reset();


// ─── Voice input ──────────────────────────────────────────────────────────

function setupVoice(buttonId, inputId, confirmBarId, confirmTextId, confirmYesId, confirmEditId, dropdownId) {
  const btn         = document.getElementById(buttonId);
  const input       = document.getElementById(inputId);
  const bar         = document.getElementById(confirmBarId);
  const confirmText = document.getElementById(confirmTextId);
  const confirmYes  = document.getElementById(confirmYesId);
  const confirmEdit = document.getElementById(confirmEditId);
  const dropdown    = document.getElementById(dropdownId);

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    btn.disabled = true;
    btn.title = 'Voice input not supported in this browser (try Chrome or Edge)';
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  btn.addEventListener('click', () => {
    btn.classList.add('recording');
    bar.classList.remove('show');
    recognition.start();
  });

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    // Invalidate before resolving, not after: if the lookup below finds no
    // prediction or throws, the field keeps the raw transcript and must fall
    // back to address routing rather than the place ID of whatever the user
    // had picked here previously.
    setLocationText(input, transcript);
    stopRecording();

    // Show resolving state while we look up the best address match
    btn.classList.add('resolving');
    btn.querySelector('i').className = 'fas fa-spinner fa-spin';

    // Resolve the transcript through the same Places autocomplete the typed
    // path uses, taking the top prediction. This keeps the place ID, so a
    // dictated address is routed as precisely as a picked one.
    fetch('https://places.googleapis.com/v1/places:autocomplete', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Goog-Api-Key': MAPS_BROWSER_KEY,
      },
      body: JSON.stringify(placesBody(transcript))
    })
      .then(r => {
        if (!r.ok) throw new Error(`Places autocomplete failed: HTTP ${r.status}`);
        return r.json();
      })
      .then(data => {
        const top = (data.suggestions || [])
          .map(s => s.placePrediction)
          .find(p => p && p.placeId && p.text && p.text.text);
        if (top) {
          input.value = top.text.text;
          selectedPlaceIds[input.id] = top.placeId;
        }
        doneResolving();
        showConfirmBar(input.value);
      })
      .catch(err => {
        // Fall back to the raw transcript, which the confirm bar still shows
        // for the user to accept or correct — but say why in the console.
        console.warn('[voice autocomplete]', err);
        doneResolving();
        showConfirmBar(input.value);
      });
  };

  function doneResolving() {
    btn.classList.remove('resolving');
    btn.querySelector('i').className = 'fas fa-microphone';
  }

  recognition.onerror = (event) => {
    stopRecording();
    const msgs = {
      'not-allowed':    'Microphone access was denied. Click the lock icon in your address bar and allow microphone access, then try again.',
      'no-speech':      'No speech detected. Please try again.',
      'audio-capture':  'No microphone found. Make sure one is connected.',
      'network':        'Network error during voice recognition. Try again.',
    };
    showError(msgs[event.error] || 'Voice input failed. Please type the address instead.');
  };
  recognition.onend = stopRecording;

  function stopRecording() { btn.classList.remove('recording'); }

  function showError(msg) {
    const err = document.createElement('div');
    err.textContent = msg;
    err.style.cssText = 'font-size:.8rem;color:#EF4444;margin-top:5px;';
    const existing = btn.parentElement.querySelector('.voice-err');
    if (existing) existing.remove();
    err.className = 'voice-err';
    btn.parentElement.appendChild(err);
    setTimeout(() => err.remove(), 5000);
  }

  function showConfirmBar(address) {
    if (!address.trim()) return;
    confirmText.textContent = address;
    bar.classList.add('show');
  }

  confirmYes.addEventListener('click', () => {
    input.classList.add('is-valid');
    bar.classList.remove('show');
  });

  confirmEdit.addEventListener('click', () => {
    bar.classList.remove('show');
    input.classList.remove('is-valid');
    input.focus();
    input.select();
  });

  input.addEventListener('input', () => {
    input.classList.remove('is-valid');
    bar.classList.remove('show');
  });
}


// Init time toggle state
setTimeFormat(timeFormat);

// Called once per field at load, and again after each logged trip to clear the
// form for the next one. Clearing runs every time; the listeners are attached
// only on the first call, or every trip logged in a sitting would leave another
// copy of them on the field.
function initTimeInput(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.value = '';
  el._userSet = false;
  el._defaulted = false;
  el._derived = false;
  if (el._timeInputWired) return;
  el._timeInputWired = true;
  el.addEventListener('change', function() { this._userSet = true; this._defaulted = false; });
  // A half-typed time reads as an empty value and fires no 'change' yet, so
  // without this a restamp on returning to the page would land on a field the
  // user was partway through and throw the entry away. Only _defaulted is
