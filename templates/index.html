<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mileage Tracker</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary:    #4F46E5;
      --violet:     #7C3AED;
      --grad:       linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
      --bg:         #F1F5F9;
      --surface:    #FFFFFF;
      --text:       #0F172A;
      --muted:      #64748B;
      --border:     #E2E8F0;
      --radius:     16px;
      --radius-sm:  10px;
      --shadow:     0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(79,70,229,.08);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Navbar ─────────────────────────────── */
    /* ── Layout ─────────────────────────────── */
    .page { max-width: 680px; margin: 0 auto; padding: 32px 16px 56px; }

    /* ── Cards ──────────────────────────────── */
    .panel {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      margin-bottom: 20px;
    }
    .panel-heading {
      display: flex; align-items: center; gap: 10px;
      font-size: 1rem; font-weight: 600; color: var(--text);
      margin-bottom: 22px;
    }
    .panel-heading-icon {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #EEF2FF, #DDD6FE);
      display: flex; align-items: center; justify-content: center;
      color: var(--primary); font-size: 0.8rem;
    }

    /* ── Location inputs ─────────────────────── */
    .field-label {
      display: block; font-size: 0.74rem; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .autocomplete-wrapper { position: relative; }
    .input-row {
      display: flex; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border); overflow: hidden;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-row:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,70,229,.12);
    }
    .loc-icon {
      display: flex; align-items: center; padding: 0 13px;
      background: #F8FAFC; border-right: 1.5px solid var(--border);
      color: var(--muted); font-size: 0.7rem; flex-shrink: 0;
    }
    .loc-input {
      flex: 1; border: none; outline: none;
      padding: 12px 14px; background: transparent;
      font-family: 'Inter', sans-serif; font-size: 0.88rem; color: var(--text);
    }
    .loc-input::placeholder { color: #CBD5E1; }
    .loc-input.is-valid { background: #F0FDF4; }
    .mic-btn {
      border: none; border-left: 1.5px solid var(--border);
      background: transparent; padding: 0 13px;
      color: var(--muted); cursor: pointer; font-size: 0.82rem;
      transition: all .2s; flex-shrink: 0;
    }
    .mic-btn:hover { background: #F8FAFC; color: var(--primary); }
    .mic-btn.recording { background: #FEF2F2; color: #EF4444; }
    .mic-btn.resolving { background: #EFF6FF; color: var(--primary); }
    .mic-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Autocomplete dropdown ───────────────── */
    .autocomplete-dropdown {
      position: absolute; top: calc(100% + 3px); left: 0; right: 0; z-index: 200;
      background: white; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: 0 8px 24px rgba(0,0,0,.1);
      max-height: 210px; overflow-y: auto;
    }
    .autocomplete-item {
      padding: 9px 14px; cursor: pointer; font-size: 0.85rem; color: var(--text);
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid #F8FAFC;
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item::before {
      content: '\f3c5'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
      color: #CBD5E1; font-size: 0.7rem; flex-shrink: 0;
    }
    .autocomplete-item:hover, .autocomplete-item.active {
      background: #F1F5F9; color: var(--primary);
    }
    .autocomplete-item:hover::before, .autocomplete-item.active::before { color: var(--primary); }

    /* ── Route connector ─────────────────────── */
    .route-divider {
      display: flex; align-items: center; gap: 10px;
      margin: 10px 0; color: #CBD5E1; font-size: 0.75rem;
    }
    .route-divider::before, .route-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* ── Voice confirm bar ───────────────────── */
    .confirm-bar {
      display: none; align-items: center; gap: 8px;
      padding: 8px 12px; margin-top: 6px;
      background: #FFFBEB; border: 1.5px solid #FCD34D;
      border-radius: 8px; font-size: 0.8rem;
    }
    .confirm-bar.show { display: flex; }
    .confirm-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #92400E; }
    .confirm-yes, .confirm-edit {
      padding: 3px 10px; border-radius: 6px; font-size: 0.77rem;
      font-weight: 600; cursor: pointer; border: none; white-space: nowrap;
      transition: background .15s;
    }
    .confirm-yes { background: #D1FAE5; color: #065F46; }
    .confirm-yes:hover { background: #A7F3D0; }
    .confirm-edit { background: white; color: var(--muted); border: 1px solid var(--border); }
    .confirm-edit:hover { background: var(--bg); }

    /* ── Feasibility warning ─────────────────── */
    .speed-warning {
      display: none; align-items: flex-start; gap: 8px;
      padding: 8px 12px; margin-top: 10px;
      background: #FFFBEB; border: 1.5px solid #FCD34D;
      border-radius: 8px; font-size: 0.8rem; color: #92400E;
    }
    .speed-warning.show { display: flex; }
    .speed-warning i { flex-shrink: 0; margin-top: 1px; }

    /* ── Calculate button ────────────────────── */
    .btn-calc {
      width: 100%; margin-top: 20px; padding: 13px;
      background: var(--grad); border: none; border-radius: var(--radius-sm);
      color: white; font-weight: 600; font-size: 0.93rem;
      font-family: 'Inter', sans-serif; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: opacity .2s, transform .1s;
    }
    .btn-calc:hover { opacity: 0.92; }
    .btn-calc:active { transform: scale(0.99); }
    .btn-calc:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ── Alerts ──────────────────────────────── */
    .alert-strip {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; border-radius: var(--radius-sm);
      font-size: 0.86rem; margin-top: 14px;
    }
    .alert-err { background: #FEF2F2; border: 1.5px solid #FECACA; color: #7F1D1D; }
    .alert-ok  { background: #F0FDF4; border: 1.5px solid #BBF7D0; color: #14532D; }
    .alert-close {
      margin-left: auto; background: none; border: none; cursor: pointer;
      color: inherit; opacity: 0.6; padding: 0; font-size: 0.85rem;
    }
    .alert-close:hover { opacity: 1; }

    /* ── Stats bar ───────────────────────────── */
    .stats-bar {
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 20px 28px;
      margin-bottom: 20px; display: flex; align-items: center;
    }
    .stat-item { flex: 1; text-align: center; }
    .stat-value { font-size: 2rem; font-weight: 700; color: var(--primary); line-height: 1; }
    .stat-label {
      font-size: 0.7rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em; margin-top: 5px;
    }
    .stat-divider { width: 1px; height: 44px; background: var(--border); flex-shrink: 0; }

    /* ── History ─────────────────────────────── */
    .history-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .export-btns { display: flex; gap: 6px; }
    .export-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 8px; border: 1.5px solid var(--border);
      background: white; color: var(--muted); font-size: 0.78rem; font-weight: 600;
      cursor: pointer; font-family: 'Inter', sans-serif; transition: all .15s;
      white-space: nowrap;
    }
    .export-btn:hover { border-color: var(--primary); color: var(--primary); background: #EEF2FF; }
    @media (max-width: 480px) { .export-label { display: none; } }
    .trips-header {
      display: grid; grid-template-columns: 1fr 1fr 60px 130px 68px;
      gap: 8px; padding-bottom: 8px;
      font-size: 0.72rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.05em;
      border-bottom: 1.5px solid var(--border);
    }
    .trip-row {
      display: grid; grid-template-columns: 1fr 1fr 60px 130px 68px;
      gap: 8px; align-items: start; padding: 11px 0;
      border-bottom: 1px solid var(--border); font-size: 0.85rem;
    }
    .trip-row:last-child { border-bottom: none; }
    .trip-loc { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .trip-mi  { font-weight: 700; color: var(--primary); }
    .trip-row-pending .trip-mi { font-weight: 500; font-style: italic; color: var(--muted); }
    .trip-date { color: var(--muted); font-size: 0.78rem; }
    .trip-actions { display: flex; gap: 4px; align-items: center; }
    .trip-del, .trip-edit {
      width: 30px; height: 30px; border-radius: 7px;
      background: transparent; border: none; color: #CBD5E1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 0.78rem; transition: all .2s;
    }
    .trip-del:hover  { background: #FEF2F2; color: #EF4444; }
    .trip-edit:hover { background: #EEF2FF; color: var(--primary); }

    /* ── Edit modal ──────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 500;
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: white; border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      width: 100%; max-width: 540px; padding: 28px;
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
    }
    .modal-title { font-size: 1.05rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 8px; background: none; border: none;
      color: var(--muted); cursor: pointer; font-size: 1rem;
      display: flex; align-items: center; justify-content: center; transition: background .15s;
    }
    .modal-close:hover { background: var(--bg); }
    .modal-field { margin-bottom: 14px; }
    .modal-field label { display: block; font-size: .73rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
    .modal-field input {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif; font-size: .9rem; color: var(--text);
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    .modal-field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
    .modal-dist-row { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
    .modal-miles-box {
      flex: 1; padding: 11px 14px; background: #F8FAFC;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-weight: 700; color: var(--primary); font-size: .9rem;
    }
    .btn-recalc {
      padding: 10px 14px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border); background: white;
      color: var(--muted); font-size: .82rem; font-weight: 600;
      cursor: pointer; font-family: 'Inter', sans-serif;
      display: flex; align-items: center; gap: 6px; transition: all .15s; white-space: nowrap;
    }
    .btn-recalc:hover { border-color: var(--primary); color: var(--primary); }
    .btn-recalc:disabled { opacity: .6; cursor: not-allowed; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-modal-cancel {
      padding: 10px 18px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--border); background: white;
      color: var(--muted); font-size: .88rem; font-weight: 600;
      cursor: pointer; font-family: 'Inter', sans-serif; transition: background .15s;
    }
    .btn-modal-cancel:hover { background: var(--bg); }
    .btn-modal-save {
      padding: 10px 20px; border-radius: var(--radius-sm);
      background: var(--grad); border: none; color: white;
      font-size: .88rem; font-weight: 600; cursor: pointer;
      font-family: 'Inter', sans-serif; transition: opacity .15s;
    }
    .btn-modal-save:hover { opacity: .9; }
    .btn-modal-save:disabled { opacity: .6; cursor: not-allowed; }
    .history-empty {
      text-align: center; padding: 44px 0; color: var(--muted); font-size: 0.9rem;
    }
    .empty-icon { font-size: 2rem; display: block; margin-bottom: 10px; opacity: 0.2; }

    @media (max-width: 560px) {
      .trips-header, .trip-row { grid-template-columns: 1fr 1fr 60px 68px; }
      .trips-header > :nth-child(4), .trip-row > :nth-child(4) { display: none; }
    }

    /* ── Trip form extra fields ──────────────── */
    .trip-extras { margin-top: 16px; padding-top: 16px; border-top: 1.5px solid var(--border); }
    .trip-extras-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px; }
    .form-input {
      width: 100%; padding: 10px 13px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif; font-size: .88rem; color: var(--text);
      outline: none; background: white; transition: border-color .2s, box-shadow .2s;
    }
    .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
    .vehicle-hint { font-size: .75rem; color: var(--muted); margin-top: 4px; min-height: 16px; }
    .vehicle-add-link {
      font-size: .74rem; font-weight: 600; color: var(--primary);
      text-decoration: none;
    }
    .vehicle-add-link:hover { text-decoration: underline; }

    /* ── Trip row subtext ────────────────────── */
    .trip-sub { font-size: .72rem; color: var(--muted); margin-top: 2px; }
    .trip-mi { padding-top: 2px; }
    .trip-actions { padding-top: 1px; }

    /* ── Edit modal extras ───────────────────── */
    .modal-row-3 {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 10px; margin-bottom: 14px;
    }
    .modal-row-3 > * { min-width: 0; }
    .modal-row-3 input { min-width: 0; width: 100%; }
    .modal-field select {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-family: 'Inter', sans-serif; font-size: .9rem; color: var(--text);
      outline: none; transition: border-color .2s, box-shadow .2s;
      background: white;
    }
    .modal-field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }

    @media (max-width: 480px) {
      .trip-extras-row { grid-template-columns: 1fr; }
      .modal-row-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

{% set show_time_toggle = true %}
{% include '_navbar.html' %}

<div class="page">

  <!-- Log a Trip -->
  <div class="panel">
    <div class="panel-heading">
      <div class="panel-heading-icon"><i class="fas fa-map-marker-alt"></i></div>
      Log a Trip
    </div>

    <div style="margin-bottom:16px">
      <label class="field-label" for="start">Start Location</label>
      <div class="autocomplete-wrapper">
        <div class="input-row">
          <span class="loc-icon"><i class="fas fa-circle" style="color:#10B981;font-size:.45rem"></i></span>
          <input type="text" id="start" class="loc-input" placeholder="Where are you starting?" autocomplete="off">
          <button class="mic-btn" type="button" id="voiceStart" title="Voice input">
            <i class="fas fa-microphone"></i>
          </button>
        </div>
        <div class="autocomplete-dropdown d-none" id="startDropdown"></div>
      </div>
      <div class="confirm-bar" id="startConfirmBar">
        <i class="fas fa-map-marker-alt" style="color:#F59E0B;flex-shrink:0;font-size:.8rem"></i>
        <span class="confirm-text" id="startConfirmText"></span>
        <button class="confirm-yes" id="startConfirmYes">&#10003; Correct</button>
        <button class="confirm-edit" id="startConfirmEdit">&#9998; Edit</button>
      </div>
    </div>

    <div class="route-divider"><i class="fas fa-arrow-down"></i></div>

    <div>
      <label class="field-label" for="end">End Location</label>
      <div class="autocomplete-wrapper">
        <div class="input-row">
          <span class="loc-icon"><i class="fas fa-map-marker-alt" style="color:#EF4444;font-size:.75rem"></i></span>
          <input type="text" id="end" class="loc-input" placeholder="Where are you going?" autocomplete="off">
          <button class="mic-btn" type="button" id="voiceEnd" title="Voice input">
            <i class="fas fa-microphone"></i>
          </button>
        </div>
        <div class="autocomplete-dropdown d-none" id="endDropdown"></div>
      </div>
      <div class="confirm-bar" id="endConfirmBar">
        <i class="fas fa-map-marker-alt" style="color:#F59E0B;flex-shrink:0;font-size:.8rem"></i>
        <span class="confirm-text" id="endConfirmText"></span>
        <button class="confirm-yes" id="endConfirmYes">&#10003; Correct</button>
        <button class="confirm-edit" id="endConfirmEdit">&#9998; Edit</button>
      </div>
    </div>

    <div class="trip-extras">
      <div style="margin-bottom:12px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <label class="field-label" for="tripVehicle" style="margin-bottom:0">Vehicle</label>
          <a href="/my-vehicles" class="vehicle-add-link" target="_blank" rel="noopener">+ Add</a>
        </div>
        <select id="tripVehicle" class="form-input vehicle-select">
          <option value="">— No vehicle (optional) —</option>
        </select>
        <div class="vehicle-hint" id="tripVehicleHint"></div>
      </div>
      <div class="trip-extras-row">
        <div>
          <label class="field-label" for="tripDate">Trip Date</label>
          <input type="date" id="tripDate" class="form-input">
        </div>
        <div>
          <label class="field-label" for="tripStartTime">Start Time</label>
          <input type="time" id="tripStartTime" class="form-input">
        </div>
        <div>
          <label class="field-label" for="tripEndTime">End Time</label>
          <input type="time" id="tripEndTime" class="form-input">
        </div>
      </div>
      <div class="speed-warning" id="tripSpeedWarning">
        <i class="fas fa-triangle-exclamation"></i>
        <span id="tripSpeedWarningText"></span>
      </div>
    </div>

    <button id="logTripBtn" class="btn-calc">
      <i class="fas fa-plus-circle"></i> Log Trip
    </button>

    <div id="errorAlert" class="alert-strip alert-err d-none">
      <i class="fas fa-exclamation-circle"></i>
      <span id="errorMsg"></span>
      <button class="alert-close" id="errorClose"><i class="fas fa-times"></i></button>
    </div>

    <div id="successAlert" class="alert-strip alert-ok d-none">
      <i class="fas fa-check-circle"></i> Trip logged successfully!
    </div>
  </div>

  <!-- Stats Summary -->
  <div class="stats-bar d-none" id="statsBar">
    <div class="stat-item">
      <div class="stat-value" id="statTotalMiles">0</div>
      <div class="stat-label">Total Miles</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
      <div class="stat-value" id="statTripCount">0</div>
      <div class="stat-label">Trips Logged</div>
    </div>
  </div>

  <!-- Trip History -->
  <div class="panel">
    <div class="history-top">
      <div class="panel-heading" style="margin-bottom:0">
        <div class="panel-heading-icon"><i class="fas fa-history"></i></div>
        Trip History
      </div>
      <div class="export-btns d-none" id="exportBtns">
        <button class="export-btn" onclick="exportPDF()" title="Export as PDF">
          <i class="fas fa-file-pdf"></i><span class="export-label"> PDF</span>
        </button>
        <button class="export-btn" onclick="exportExcel()" title="Export as Excel (.xlsx)">
          <i class="fas fa-file-excel"></i><span class="export-label"> Excel</span>
        </button>
        <button class="export-btn" onclick="exportCSV()" title="Export as CSV">
          <i class="fas fa-file-csv"></i><span class="export-label"> CSV</span>
        </button>
      </div>
    </div>

    <div id="historyWrap">
      <div class="history-empty" id="emptyState">
        <span class="empty-icon"><i class="fas fa-route"></i></span>
        No trips logged yet. Calculate your first trip above!
      </div>
    </div>
  </div>

</div>

<!-- Edit trip modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title"><i class="fas fa-pencil-alt" style="color:var(--primary)"></i> Edit Trip</div>
      <button class="modal-close" onclick="closeEditModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-field">
      <label>Start Location</label>
      <div class="autocomplete-wrapper">

<script>
// ─── Time format ──────────────────────────────────────────────────────────

let timeFormat = localStorage.getItem('timeFormat') || '12h';

function setTimeFormat(fmt) {
  timeFormat = fmt;
  localStorage.setItem('timeFormat', fmt);
  document.getElementById('toggle12h').classList.toggle('active', fmt === '12h');
  document.getElementById('toggle24h').classList.toggle('active', fmt === '24h');
  refreshTimeDisplays();
}

function formatTime(hhmm) {
  if (!hhmm) return '';
  const [h, m] = hhmm.split(':').map(Number);
  if (timeFormat === '24h') return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  const ampm = h < 12 ? 'AM' : 'PM';
  return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${ampm}`;
}

function formatTimeRange(s, e) {
  if (s && e) return `${formatTime(s)} – ${formatTime(e)}`;
  if (s) return formatTime(s);
  if (e) return formatTime(e);
  return '';
}

function formatTripDate(dateStr) {
  if (!dateStr) return '';
  const [y, mo, d] = dateStr.split('-').map(Number);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[mo - 1]} ${d}, ${y}`;
}

function refreshTimeDisplays() {
  document.querySelectorAll('.trip-time-display').forEach(el => {
    el.textContent = formatTimeRange(el.dataset.rawStart, el.dataset.rawEnd) || '–';
  });
}


// ─── Vehicle management ───────────────────────────────────────────────────
// Full CRUD lives on the /my-vehicles page; the dashboard only needs the
// list to populate trip-form vehicle selects.

let vehiclesList = [];

async function loadVehicles() {
  try {
    const resp = await fetch('/vehicles');
    vehiclesList = await resp.json();
    populateVehicleSelects();
  } catch { /* non-fatal */ }
}

function populateVehicleSelects() {
  document.querySelectorAll('.vehicle-select').forEach(sel => {
    const cur = sel.value;
    sel.innerHTML = '<option value="">— No vehicle (optional) —</option>';
    vehiclesList.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.id;
      opt.textContent = v.name;
      opt.dataset.sub = v.sub || '';
      sel.appendChild(opt);
    });
    sel.value = cur;
  });
}

function vehicleHintChange(selectId, hintId) {
  const sel  = document.getElementById(selectId);
  const hint = document.getElementById(hintId);
  const opt  = sel.options[sel.selectedIndex];
  hint.textContent = opt?.dataset.sub || '';
}


// ─── Autocomplete ─────────────────────────────────────────────────────────

function setupAutocomplete(inputId, dropdownId) {
  const input = document.getElementById(inputId);
  const dropdown = document.getElementById(dropdownId);
  let debounceTimer = null;

  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const q = input.value.trim();
    if (q.length < 3) { hideDropdown(dropdown); return; }
    debounceTimer = setTimeout(() => fetchSuggestions(q, input, dropdown), 500);
  });

  input.addEventListener('keydown', (e) => {
    const items = dropdown.querySelectorAll('.autocomplete-item');
    const active = dropdown.querySelector('.autocomplete-item.active');
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      const next = active ? active.nextElementSibling : items[0];
      if (next) { active && active.classList.remove('active'); next.classList.add('active'); }
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      const prev = active ? active.previousElementSibling : items[items.length - 1];
      if (prev) { active && active.classList.remove('active'); prev.classList.add('active'); }
    } else if (e.key === 'Enter' && active) {
      e.preventDefault();
      input.value = active.dataset.label;
      hideDropdown(dropdown);
    } else if (e.key === 'Escape') {
      hideDropdown(dropdown);
    }
  });

  document.addEventListener('click', (e) => {
    if (!input.contains(e.target) && !dropdown.contains(e.target)) hideDropdown(dropdown);
  });
}

function fetchSuggestions(query, input, dropdown) {
  const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(query)}&limit=6&addressdetails=1`;
  fetch(url, { headers: { 'Accept-Language': 'en' } })
    .then(r => r.json())
    .then(data => {
      if (!data.length) { hideDropdown(dropdown); return; }
      dropdown.innerHTML = '';
      data.forEach(result => {
        const a = result.address || {};
        const road = a.road || a.pedestrian || a.footway || a.path;
        const street = [a.house_number, road].filter(Boolean).join(' ');
        const parts = [
          street,
          a.city || a.town || a.village || a.municipality || a.suburb,
          a.state,
          a.country
        ].filter(Boolean);
        const label = parts.length >= 2 ? parts.join(', ') : result.display_name;
        const item = document.createElement('div');
        item.className = 'autocomplete-item';
        item.textContent = label;
        item.dataset.label = label;
        item.addEventListener('mousedown', (e) => {
          e.preventDefault();
          input.value = label;
          hideDropdown(dropdown);
        });
        dropdown.appendChild(item);
      });
      dropdown.classList.remove('d-none');
    })
    .catch(() => hideDropdown(dropdown));
}

function hideDropdown(dropdown) {
  dropdown.classList.add('d-none');
  dropdown.innerHTML = '';
}

setupAutocomplete('start', 'startDropdown');
setupAutocomplete('end', 'endDropdown');


// ─── Voice input ──────────────────────────────────────────────────────────

function setupVoice(buttonId, inputId, confirmBarId, confirmTextId, confirmYesId, confirmEditId, dropdownId) {
  const btn         = document.getElementById(buttonId);
  const input       = document.getElementById(inputId);
  const bar         = document.getElementById(confirmBarId);
  const confirmText = document.getElementById(confirmTextId);
  const confirmYes  = document.getElementById(confirmYesId);
  const confirmEdit = document.getElementById(confirmEditId);
  const dropdown    = document.getElementById(dropdownId);

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    btn.disabled = true;
    btn.title = 'Voice input not supported in this browser (try Chrome or Edge)';
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  btn.addEventListener('click', () => {
    btn.classList.add('recording');
    bar.classList.remove('show');
    recognition.start();
  });

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    input.value = transcript;
    stopRecording();

    // Show resolving state while we look up the best address match
    btn.classList.add('resolving');
    btn.querySelector('i').className = 'fas fa-spinner fa-spin';

    const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(transcript)}&limit=1&addressdetails=1`;
    fetch(url, { headers: { 'Accept-Language': 'en' } })
      .then(r => r.json())
      .then(data => {
        if (data && data.length) {
          const a = data[0].address || {};
          const road = a.road || a.pedestrian || a.footway || a.path;
          const street = [a.house_number, road].filter(Boolean).join(' ');
          const city = a.city || a.town || a.village || a.municipality || a.suburb;
          const parts = [street, city, a.state, a.country].filter(Boolean);
          // For city-only results (no street), just use city + state
          input.value = parts.length >= 2 ? parts.join(', ') : data[0].display_name;
        }
        doneResolving();
        showConfirmBar(input.value);
      })
      .catch(() => { doneResolving(); showConfirmBar(input.value); });
  };

  function doneResolving() {
    btn.classList.remove('resolving');
    btn.querySelector('i').className = 'fas fa-microphone';
  }

  recognition.onerror = (event) => {
    stopRecording();
    const msgs = {
      'not-allowed':    'Microphone access was denied. Click the lock icon in your address bar and allow microphone access, then try again.',
      'no-speech':      'No speech detected. Please try again.',
      'audio-capture':  'No microphone found. Make sure one is connected.',
      'network':        'Network error during voice recognition. Try again.',
    };
    showError(msgs[event.error] || 'Voice input failed. Please type the address instead.');
  };
  recognition.onend = stopRecording;

  function stopRecording() { btn.classList.remove('recording'); }

  function showError(msg) {
    const err = document.createElement('div');
    err.textContent = msg;
    err.style.cssText = 'font-size:.8rem;color:#EF4444;margin-top:5px;';
    const existing = btn.parentElement.querySelector('.voice-err');
    if (existing) existing.remove();
    err.className = 'voice-err';
    btn.parentElement.appendChild(err);
    setTimeout(() => err.remove(), 5000);
  }

  function showConfirmBar(address) {
    if (!address.trim()) return;
    confirmText.textContent = address;
    bar.classList.add('show');
  }

  confirmYes.addEventListener('click', () => {
    input.classList.add('is-valid');
    bar.classList.remove('show');
  });

  confirmEdit.addEventListener('click', () => {
    bar.classList.remove('show');
    input.classList.remove('is-valid');
    input.focus();
    input.select();
  });

  input.addEventListener('input', () => {
    input.classList.remove('is-valid');
    bar.classList.remove('show');
  });
}

setupVoice('voiceStart', 'start', 'startConfirmBar', 'startConfirmText', 'startConfirmYes', 'startConfirmEdit', 'startDropdown');
setupVoice('voiceEnd',   'end',   'endConfirmBar',   'endConfirmText',   'endConfirmYes',   'endConfirmEdit',   'endDropdown');

// Init time toggle state
setTimeFormat(timeFormat);

function initTimeInput(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.value = '';
  el._userSet = false;
  el.addEventListener('change', function() { this._userSet = true; });

function getTimeValue(id) {

initTimeInput('tripStartTime');
initTimeInput('tripEndTime');

initTimeInput('editEndTime');


// ─── Trip time feasibility check ───────────────────────────────────────────

const FEASIBILITY_MIN_RATIO = 0.5;
const FEASIBILITY_MAX_RATIO = 3.0;

function elapsedSeconds(startTime, endTime) {
  if (!startTime || !endTime) return null;
  const [sh, sm] = startTime.split(':').map(Number);
  const [eh, em] = endTime.split(':').map(Number);
  if ([sh, sm, eh, em].some(Number.isNaN)) return null;
  let startMin = sh * 60 + sm, endMin = eh * 60 + em;
  if (endMin <= startMin) endMin += 24 * 60;
  return (endMin - startMin) * 60;
}

function feasibilityWarning(startTime, endTime, distanceMiles, durationSeconds) {
  if (durationSeconds == null || !distanceMiles) return null;
  const elapsed = elapsedSeconds(startTime, endTime);
  if (elapsed == null || elapsed <= 0) return null;
  const elapsedMin = Math.round(elapsed / 60), expectedMin = Math.round(durationSeconds / 60);
  if (elapsed < durationSeconds * FEASIBILITY_MIN_RATIO) {
    return `${distanceMiles} miles in ${elapsedMin} min is much faster than the ` +
           `typical ~${expectedMin} min for this route — double check the times.`;
  }
  if (elapsed > durationSeconds * FEASIBILITY_MAX_RATIO) {
    return `${distanceMiles} miles in ${elapsedMin} min is much longer than the ` +
           `typical ~${expectedMin} min for this route — double check the times.`;
  }
  return null;
}

function updateSpeedWarning(warningElId, textElId, warning) {
  document.getElementById(textElId).textContent = warning || '';
  document.getElementById(warningElId).classList.toggle('show', !!warning);
}

function checkEditSpeedLive() {
  const w = editingTrip && feasibilityWarning(
    getTimeValue('editStartTime'), getTimeValue('editEndTime'),
    editingTrip.miles, editingTrip.durationSeconds
  );
  updateSpeedWarning('editSpeedWarning', 'editSpeedWarningText', w);
}
document.getElementById('editStartTime').addEventListener('change', checkEditSpeedLive);
document.getElementById('editEndTime').addEventListener('change', checkEditSpeedLive);


document.getElementById('tripVehicle').addEventListener('change', () => vehicleHintChange('tripVehicle', 'tripVehicleHint'));
document.getElementById('editVehicle').addEventListener('change', () => vehicleHintChange('editVehicle', 'editVehicleHint'));


// ─── Log trip ─────────────────────────────────────────────────────────────

document.getElementById('logTripBtn').addEventListener('click', async () => {
  const start = document.getElementById('start').value.trim();
  const end   = document.getElementById('end').value.trim();
  hideError();
  updateSpeedWarning('tripSpeedWarning', 'tripSpeedWarningText', null);

  if (!start || !end) { showError('Please enter both a start and end location.'); return; }

  const btn = document.getElementById('logTripBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Logging…';

  const vehicleVal = document.getElementById('tripVehicle').value;
  const payload = {
    start, end,
    vehicle_id: vehicleVal ? parseInt(vehicleVal) : null,
    trip_date:  document.getElementById('tripDate').value      || null,
    start_time: getTimeValue('tripStartTime'),
    end_time:   getTimeValue('tripEndTime'),
  };

  try {
    const resp = await fetch('/log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if (!resp.ok) { showError(data.error || 'Failed to log trip.'); return; }

    tripsData.unshift(data.trip);
    prependTripRow(data.trip);
    updateTotal(data.trip.miles, true);

    document.getElementById('start').value = '';
    document.getElementById('end').value   = '';
    document.getElementById('start').classList.remove('is-valid');
    document.getElementById('end').classList.remove('is-valid');
    document.getElementById('tripVehicle').value   = '';
    document.getElementById('tripVehicleHint').textContent = '';
    document.getElementById('tripDate').value      = '';
    initTimeInput('tripStartTime');
    initTimeInput('tripEndTime');

    if (data.distance_error) {
      showError(`Trip logged, but distance couldn't be calculated automatically (${data.distance_error}). You can add it later by editing the trip.`);
    } else {
      const ok = document.getElementById('successAlert');
      ok.classList.remove('d-none');
      setTimeout(() => ok.classList.add('d-none'), 3000);
    }

    if (data.warning) {
      updateSpeedWarning('tripSpeedWarning', 'tripSpeedWarningText', data.warning);
      setTimeout(() => updateSpeedWarning('tripSpeedWarning', 'tripSpeedWarningText', null), 6000);
    } else {
      updateSpeedWarning('tripSpeedWarning', 'tripSpeedWarningText', null);
    }
  } catch {
    showError('Network error. Could not save trip.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-plus-circle"></i> Log Trip';
  }
});


// ─── History ──────────────────────────────────────────────────────────────

let totalMilesAccum = 0;
let tripCount       = 0;
let tripsData       = [];
let headerInserted  = false;

async function loadHistory() {
  try {
    const resp  = await fetch('/history');
    const trips = await resp.json();
    if (!trips.length) return;

    document.getElementById('emptyState')?.remove();
    totalMilesAccum = 0;
    tripCount = trips.length;
    tripsData = [...trips];
    trips.forEach(t => { prependTripRow(t, false); totalMilesAccum += t.miles; });
    updateTotalDisplay();
  } catch { /* non-fatal */ }
}

function prependTripRow(trip, prepend = true) {
  document.getElementById('emptyState')?.remove();
  const wrap = document.getElementById('historyWrap');

  if (!headerInserted) {
    const hdr = document.createElement('div');
    hdr.className = 'trips-header';
    hdr.id = 'tripsHeader';
    hdr.innerHTML = '<span>Start</span><span>End</span><span>Miles</span><span>Date / Time</span><span></span>';
    wrap.insertBefore(hdr, wrap.firstChild);
    headerInserted = true;
  }

  const timeRangeTxt = formatTimeRange(trip.start_time, trip.end_time) || '–';
  const dateTxt = trip.trip_date
    ? formatTripDate(trip.trip_date)
    : escHtml((trip.timestamp || '').replace(/\s+\d{1,2}:\d{2}\s*[AP]M$/i, '').trim());

  const row = document.createElement('div');
  row.className = trip.miles == null ? 'trip-row trip-row-pending' : 'trip-row';
  row.id = `trip-${trip.id}`;
  row.dataset.start       = trip.start;
  row.dataset.end         = trip.end;
  row.dataset.miles       = trip.miles ?? '';
  row.dataset.vehicleId   = trip.vehicle_id   || '';
  row.dataset.vehicleName = trip.vehicle_name || '';
  row.dataset.vehicleSub  = trip.vehicle_sub  || '';
  row.dataset.tripDate    = trip.trip_date    || '';
  row.dataset.startTime   = trip.start_time   || '';
  row.dataset.endTime     = trip.end_time     || '';
  row.dataset.durationSeconds = trip.duration_seconds || '';
  row.innerHTML = `
    <div class="trip-loc">
      <div class="trip-loc-main" title="${escHtml(trip.start)}">${escHtml(trip.start)}</div>
      <div class="trip-vehicle-sub trip-sub" style="${trip.vehicle_name ? '' : 'display:none'}">${escHtml(trip.vehicle_name || '')}</div>
    </div>
    <div class="trip-loc">
      <div class="trip-loc-main" title="${escHtml(trip.end)}">${escHtml(trip.end)}</div>
    </div>
    <div class="trip-mi">${milesDisplay(trip.miles)}</div>
    <div class="trip-date">
      <div class="trip-date-main">${dateTxt}</div>
      <div class="trip-time-display trip-sub" data-raw-start="${escHtml(trip.start_time||'')}" data-raw-end="${escHtml(trip.end_time||'')}">${timeRangeTxt}</div>
    </div>
    <div class="trip-actions">
      <button class="trip-edit" onclick="openEditModal(${trip.id})" title="Edit trip">
        <i class="fas fa-pencil-alt"></i>
      </button>
      <button class="trip-del" onclick="deleteTrip(${trip.id}, ${trip.miles})" title="Delete trip">
        <i class="fas fa-trash-alt"></i>
      </button>
    </div>
  `;

  const hdr = document.getElementById('tripsHeader');
  if (prepend && hdr) {
    hdr.insertAdjacentElement('afterend', row);
  } else {
    wrap.appendChild(row);
  }
}

async function deleteTrip(id, miles) {
  if (!confirm('Delete this trip?')) return;
  try {
    const resp = await fetch(`/history/${id}`, { method: 'DELETE' });
    if (!resp.ok) return;
    document.getElementById(`trip-${id}`).remove();
    tripsData = tripsData.filter(t => t.id !== id);
    updateTotal(miles, false);

    const wrap = document.getElementById('historyWrap');
    if (!wrap.querySelector('.trip-row')) {
      document.getElementById('tripsHeader')?.remove();
      headerInserted = false;
      wrap.innerHTML = `
        <div class="history-empty" id="emptyState">
          <span class="empty-icon"><i class="fas fa-route"></i></span>
          No trips logged yet. Calculate your first trip above!
        </div>
      `;
    }
  } catch { /* silent */ }
}

function updateTotal(miles, add) {
  totalMilesAccum = add ? totalMilesAccum + miles : totalMilesAccum - miles;
  tripCount       = add ? tripCount + 1 : tripCount - 1;
  updateTotalDisplay();
}

function updateTotalDisplay() {
  const bar = document.getElementById('statsBar');
  const btns = document.getElementById('exportBtns');
  if (tripCount > 0) {
    document.getElementById('statTotalMiles').textContent =
      (Math.round(totalMilesAccum * 100) / 100).toLocaleString();
    document.getElementById('statTripCount').textContent = tripCount;
    bar.classList.remove('d-none');
    btns.classList.remove('d-none');
  } else {
    bar.classList.add('d-none');
    btns.classList.add('d-none');
  }
}


// ─── Helpers ──────────────────────────────────────────────────────────────

function showError(msg) {
  const el = document.getElementById('errorAlert');
  document.getElementById('errorMsg').textContent = msg;
  el.classList.remove('d-none');
}
function hideError()  { document.getElementById('errorAlert').classList.add('d-none'); }

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function parseMiles(str) {
  if (!str) return null;
  const n = parseFloat(str);
  return Number.isNaN(n) ? null : n;
}
function milesDisplay(miles) {
  return miles != null ? miles : '— (pending)';
}

document.getElementById('errorClose').addEventListener('click', hideError);


// ─── Edit modal ───────────────────────────────────────────────────────────

let editingTrip = null;

function openEditModal(id) {
  const row = document.getElementById(`trip-${id}`);
  editingTrip = {
    id,
    miles: parseMiles(row.dataset.miles),
    durationSeconds: row.dataset.durationSeconds ? parseInt(row.dataset.durationSeconds, 10) : null,
    calcStart: row.dataset.start,
    calcEnd:   row.dataset.end,
  };
  document.getElementById('editStart').value = row.dataset.start;
  document.getElementById('editEnd').value   = row.dataset.end;
  document.getElementById('editMiles').textContent = editingTrip.miles != null ? editingTrip.miles : 'Pending';

  const vehicleSel = document.getElementById('editVehicle');
  vehicleSel.value = row.dataset.vehicleId || '';
  const selOpt = vehicleSel.options[vehicleSel.selectedIndex];
  document.getElementById('editVehicleHint').textContent = selOpt?.dataset.sub || '';
  document.getElementById('editTripDate').value  = row.dataset.tripDate  || '';
  ['editStartTime', 'editEndTime'].forEach((id, i) => {
    const val = [row.dataset.startTime, row.dataset.endTime][i] || '';
    const el  = document.getElementById(id);
    el.value   = val;
    el._userSet = !!val;
  });
  checkEditSpeedLive();

  document.getElementById('editModal').classList.add('open');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('open');
  editingTrip = null;
  updateSpeedWarning('editSpeedWarning', 'editSpeedWarningText', null);
}

document.getElementById('editModal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('editModal')) closeEditModal();
});

// Calls /calculate for the given start/end and, on success, updates
// editingTrip's miles/duration (and the locations they're now current
// for) in place. Returns whether it succeeded; never throws.
async function fetchEditDistance(start, end) {
  try {
    const resp = await fetch('/calculate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ start, end })
    });
    const data = await resp.json();
    if (resp.ok) {
      editingTrip.miles = data.distance_miles;
      editingTrip.durationSeconds = data.duration_seconds;
      editingTrip.calcStart = start;
      editingTrip.calcEnd   = end;
      document.getElementById('editMiles').textContent = data.distance_miles;
      checkEditSpeedLive();
      return true;
    }
  } catch { /* fall through to false */ }
  return false;
}

async function recalcEditDistance() {
  const start = document.getElementById('editStart').value.trim();
  const end   = document.getElementById('editEnd').value.trim();
  if (!start || !end) return;
  const btn = document.getElementById('recalcBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Calculating…';
  try {
    await fetchEditDistance(start, end);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-route"></i> Recalculate';
  }
}

async function saveEdit() {
  if (!editingTrip) return;
  const start = document.getElementById('editStart').value.trim();
  const end   = document.getElementById('editEnd').value.trim();
  if (!start || !end) return;

  const btn = document.getElementById('saveEditBtn');

  // The distance in editingTrip is only valid for the locations it was last
  // calculated for. If the user edited start/end without hitting Recalculate,
  // it's now stale — recalculate here so a location change is never silently
  // saved with the old trip's mileage.
  if (start !== editingTrip.calcStart || end !== editingTrip.calcEnd) {
    btn.disabled = true;
    btn.textContent = 'Recalculating…';
    const ok = await fetchEditDistance(start, end);
    if (!ok) {
      alert('Could not recalculate distance for the new location(s). Please check the address and try again.');
      btn.disabled = false;
      btn.textContent = 'Save Changes';
      return;
    }
  }

  const vehicleVal = document.getElementById('editVehicle').value;
  const payload = {
    start, end, distance_miles: editingTrip.miles,
    duration_seconds: editingTrip.durationSeconds,
    vehicle_id: vehicleVal ? parseInt(vehicleVal) : null,
    trip_date:  document.getElementById('editTripDate').value  || null,
    start_time: getTimeValue('editStartTime'),
    end_time:   getTimeValue('editEndTime'),
  };

  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const resp = await fetch(`/history/${editingTrip.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if (!resp.ok) { alert(data.error || 'Failed to save.'); return; }

    const row = document.getElementById(`trip-${data.id}`);
    const oldMiles = parseMiles(row.dataset.miles);
    row.classList.toggle('trip-row-pending', data.miles == null);
    row.dataset.start       = data.start;
    row.dataset.end         = data.end;
    row.dataset.miles       = data.miles ?? '';
    row.dataset.vehicleId   = data.vehicle_id   || '';
    row.dataset.vehicleName = data.vehicle_name || '';
    row.dataset.vehicleSub  = data.vehicle_sub  || '';
    row.dataset.tripDate    = data.trip_date    || '';
    row.dataset.startTime   = data.start_time   || '';
    row.dataset.endTime     = data.end_time     || '';
    row.dataset.durationSeconds = data.duration_seconds || '';

    const mainStart = row.querySelector('.trip-loc-main');
    mainStart.textContent = data.start; mainStart.title = data.start;
    const vSub = row.querySelector('.trip-vehicle-sub');
    if (vSub) { vSub.textContent = data.vehicle_name || ''; vSub.style.display = data.vehicle_name ? '' : 'none'; }
    const mainEnd = row.querySelectorAll('.trip-loc-main')[1];
    mainEnd.textContent = data.end; mainEnd.title = data.end;
    row.querySelector('.trip-mi').textContent = milesDisplay(data.miles);
    const dateMain = row.querySelector('.trip-date-main');
    if (dateMain) dateMain.textContent = data.trip_date
      ? formatTripDate(data.trip_date)
      : (data.timestamp || '').replace(/\s+\d{1,2}:\d{2}\s*[AP]M$/i, '').trim();
    const timeEl = row.querySelector('.trip-time-display');
    if (timeEl) {
      timeEl.dataset.rawStart = data.start_time || '';
      timeEl.dataset.rawEnd   = data.end_time   || '';
      timeEl.textContent = formatTimeRange(data.start_time, data.end_time) || '–';
    }
    row.querySelector('.trip-del').setAttribute('onclick', `deleteTrip(${data.id}, ${data.miles})`);

    const idx = tripsData.findIndex(t => t.id === data.id);
    if (idx !== -1) {
      tripsData[idx] = { ...tripsData[idx], ...data };
      totalMilesAccum = totalMilesAccum - (oldMiles ?? 0) + (data.miles ?? 0);
      updateTotalDisplay();
    }
    if (data.warning) alert(data.warning);
    closeEditModal();
  } catch { alert('Network error. Could not save changes.'); }
  finally { btn.disabled = false; btn.textContent = 'Save Changes'; }
}

// Trips are grouped by year for the PDF export (one page per year). A trip's
// year comes from its trip_date when set, else the year embedded in its
// "MMM DD, YYYY h:mm AM/PM" logged-at timestamp string.
function tripYear(t) {
  if (t.trip_date) return t.trip_date.slice(0, 4);
  const m = (t.timestamp || '').match(/,\s*(\d{4})/);
  return m ? m[1] : 'Unknown';
}

function groupTripsByYear(trips) {
  const groups = new Map();
  trips.forEach(t => {
    const year = tripYear(t);
    if (!groups.has(year)) groups.set(year, []);
    groups.get(year).push(t);
  });
  const years = [...groups.keys()].sort((a, b) => {
    if (a === 'Unknown') return 1;
    if (b === 'Unknown') return -1;
    return b - a;
  });
  return years.map(year => ({ year, trips: groups.get(year) }));
}

// Per-vehicle trip count/miles for one year's trips, sorted by miles
// descending. Trips with no vehicle assigned are bucketed under "No
// vehicle". Returns [] if nobody used a vehicle that year — nothing
// useful to break down.
function vehicleSummary(trips) {
  if (!trips.some(t => t.vehicle_name)) return [];
  const map = new Map();
  trips.forEach(t => {
    const name = t.vehicle_name || 'No vehicle';
    if (!map.has(name)) map.set(name, { trips: 0, miles: 0 });
    const entry = map.get(name);
    entry.trips += 1;
    entry.miles += t.miles ?? 0;
  });
  return [...map.entries()]
    .map(([name, v]) => ({ name, ...v }))
    .sort((a, b) => b.miles - a.miles);
}

function exportPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape' });
  const yearGroups = groupTripsByYear(tripsData);

  doc.setFontSize(16);
  doc.setTextColor(79, 70, 229);
  doc.text('Mileage Log', 14, 18);

  doc.setFontSize(9);
  doc.setTextColor(100, 116, 139);
  doc.text(`Exported on ${new Date().toLocaleDateString()}  ·  ${tripCount} trips  ·  ${(Math.round(totalMilesAccum * 100) / 100).toLocaleString()} mi total`, 14, 25);

  yearGroups.forEach((group, i) => {
    const headingY = i === 0 ? 32 : 20;
    if (i > 0) doc.addPage();

    const yearMiles = group.trips.reduce((sum, t) => sum + (t.miles ?? 0), 0);
    const yearLabel = group.year === 'Unknown' ? 'Unknown Year' : group.year;

    doc.setFontSize(13);
    doc.setTextColor(30, 41, 59);
    doc.text(yearLabel, 14, headingY);

    doc.setFontSize(9);
    doc.setTextColor(100, 116, 139);
    doc.text(
      `${group.trips.length} trip${group.trips.length === 1 ? '' : 's'}  ·  ${(Math.round(yearMiles * 100) / 100).toLocaleString()} mi total`,
      14, headingY + 6
    );

    let tableStartY = headingY + 11;
    const vehicleRows = vehicleSummary(group.trips);
    if (vehicleRows.length) {
      doc.setFontSize(8);
      doc.setTextColor(30, 41, 59);
      doc.text('By Vehicle', 14, tableStartY);
      tableStartY += 3;

      doc.autoTable({
        startY: tableStartY,
        head: [['Vehicle', 'Trips', 'Miles']],
        body: vehicleRows.map(v => [v.name, v.trips, Math.round(v.miles * 100) / 100]),
        theme: 'plain',
        styles: { fontSize: 7, cellPadding: 1 },
        headStyles: { fontStyle: 'bold', textColor: [100, 116, 139] },
        columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right' } },
        tableWidth: 90,
        margin: { left: 14, right: 14 },
      });
      tableStartY = doc.lastAutoTable.finalY + 6;
    }

    doc.autoTable({
      startY: tableStartY,
      head: [['Start Location', 'End Location', 'Miles', 'Vehicle', 'Trip Date', 'Start Time', 'End Time']],
      body: group.trips.map(t => [
        t.start, t.end, t.miles ?? '',
        t.vehicle_name || '',
        t.trip_date    || '',
        t.start_time   || '',
        t.end_time     || ''
      ]),
      foot: [['', 'Total', Math.round(yearMiles * 100) / 100, '', '', '', '']],
      headStyles:  { fillColor: [79, 70, 229], fontSize: 7, fontStyle: 'bold' },
      footStyles:  { fillColor: [238, 242, 255], textColor: [79, 70, 229], fontStyle: 'bold', fontSize: 7 },
      bodyStyles:  { fontSize: 7 },
      columnStyles: { 2: { halign: 'right' } },
      alternateRowStyles: { fillColor: [248, 250, 252] },
      margin: { left: 14, right: 14 },
    });
  });

  doc.save('mileage-log.pdf');
}

function triggerDownload(filename, type, content) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}
