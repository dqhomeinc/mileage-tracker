function showError(msg) {
  const el = document.getElementById('errorAlert');
  document.getElementById('errorMsg').textContent = msg;
  el.classList.remove('d-none');
}
function hideError()  { document.getElementById('errorAlert').classList.add('d-none'); }

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function parseMiles(str) {
  if (!str) return null;
  const n = parseFloat(str);
  return Number.isNaN(n) ? null : n;
}
function milesDisplay(miles) {
  return miles != null ? miles : '— (pending)';
}

document.getElementById('errorClose').addEventListener('click', hideError);


// ─── Edit modal ───────────────────────────────────────────────────────────

function openEditModal(id) {
  const row = document.getElementById(`trip-${id}`);
  const storedStops = parseStops(row.dataset.stops);
  // The trip as one ordered list, which is how the modal now shows it.
  const storedRoute = [
    { label: row.dataset.start, place_id: row.dataset.startPlaceId || null },
    ...storedStops,
    { label: row.dataset.end,   place_id: row.dataset.endPlaceId   || null },
  ];
  editingTrip = {
    id,
    // Metadata only — the bytes are fetched by the download route when the user
    // actually opens one, so the trip list never carries them.
    attachments: parseAttachments(row.dataset.attachments),
    miles: parseMiles(row.dataset.miles),
    durationSeconds: row.dataset.durationSeconds ? parseInt(row.dataset.durationSeconds, 10) : null,
    // What the stored distance and duration were calculated for: the whole
    // route in order, so reordering counts as a change the same way editing a
    // location does.
    calcRouteKey:  routeKey(storedRoute),
    calcStopCount: storedStops.length,
  };
  // The stored place IDs are loaded onto the rows themselves, where each one
  // survives exactly as long as its own text is untouched — a row's input
  // listener clears it. That is what placeIdsForEdit used to work out by
  // comparing text against the original.
  editRoute.setAll(storedRoute);
  document.getElementById('editMiles').textContent = editingTrip.miles != null ? editingTrip.miles : 'Pending';

  document.getElementById('editBusiness').value = row.dataset.businessId || '';
  document.getElementById('editNotes').value = row.dataset.notes || '';
  document.getElementById('editNotesCounter').textContent = '';
  const vehicleSel = document.getElementById('editVehicle');
  vehicleSel.value = row.dataset.vehicleId || '';
  const selOpt = vehicleSel.options[vehicleSel.selectedIndex];
  document.getElementById('editVehicleHint').textContent = selOpt?.dataset.sub || '';
  document.getElementById('editTripDate').value  = row.dataset.tripDate  || '';
  ['editStartTime', 'editEndTime'].forEach((id, i) => {
    const val = [row.dataset.startTime, row.dataset.endTime][i] || '';
    const el  = document.getElementById(id);
    el.value   = val;
    el._userSet = !!val;
  });
  // Seeded after the times, because whether the stored end date counts as the
  // user's own is decided by comparing it against what those times imply.
  const editEnd = document.getElementById('editEndDate');
  const stored  = row.dataset.endDate || '';
  const implied = derivedEndDate(row.dataset.tripDate, row.dataset.startTime, row.dataset.endTime);
  editEnd.value = stored;
  // A stored date matching the times is derived and keeps following them; one
  // that differs is a span only a person could have set, so it is left alone.
  editEnd._userSet = !!stored && stored !== implied;
  syncEditEndDate();
  checkEditSpeedLive();
  updateEditPlaceWarning();
  renderEditAttachments();
  document.getElementById('editAttachHint').textContent = '';
  // Seeded from what the trip was last measured as, so the modal opens showing
  // a number rather than a dash; it is only remeasured if the route changes.
  // Cleared first: building the rows above already scheduled a measurement, and
  // overwriting timer with null would leave that one running unreferenced.
  resetMeasure(editMeasure);
  editMeasure.key = editingTrip.calcRouteKey;
  editMeasure.miles = editingTrip.miles;
  editMeasure.durationSeconds = editingTrip.durationSeconds;
  document.getElementById('editMeasureError').textContent = '';

  document.getElementById('editModal').classList.add('open');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('open');
  editingTrip = null;
  document.getElementById('editAttachList').innerHTML = '';
  document.getElementById('editAttachHint').textContent = '';
  // A pending or in-flight remeasure would otherwise land after the modal is
  // gone and write a number into it, or into the next trip opened. The timer is
  // cancellable; a request already sent is not, so the generation bump makes
  // measureRoute discard its answer instead of rendering it.
  resetMeasure(editMeasure);
  updateSpeedWarning('editSpeedWarning', 'editSpeedWarningText', null);
  updateSpeedWarning('editPlaceWarning', 'editPlaceWarningText', null);
}

document.getElementById('editModal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('editModal')) closeEditModal();
});


// Measures the modal's route now, waiting for a debounced or in-flight
// measurement rather than starting a competing one. renderEditMeasure writes
// the answer into editingTrip, so there is one path by which the modal's
// distance changes. Never throws; returns null on success, or a reason the
// caller turns into a message.
//
// Success means the measurement describes the route on screen *now*.
// measureRoute leaves its state untouched when an edit lands mid-request — that
// answer is for a route nobody is looking at any more — so a non-null mileage
// alone would read as success while holding the older route's distance, which
// is exactly what a save must not store.
async function fetchEditDistance() {
  await currentMeasurement(editMeasure, editRoute, renderEditMeasure);
  if (editMeasure.miles == null) return 'could-not-measure';
  if (editMeasure.key !== routeKey(editRoute.allRows())) return 'changed-while-measuring';
  return null;
}

async function recalcEditDistance() {
  if (!routePayload(editRoute)) return;
  // Pressed deliberately, so everything already known is discarded and a fresh
  // request is made — otherwise the button would do nothing after a failed
  // measurement or a transient network problem.
  //
  // The whole state goes, not just the key: currentMeasurement waits for a
  // request already in flight, and that request sets the key on its way back,
  // so clearing the key alone left the button returning the answer it was
  // about to receive instead of asking again. resetMeasure also bumps the
  // generation, which makes that in-flight answer be discarded rather than
  // rendered over this one.
  resetMeasure(editMeasure);
  const btn = document.getElementById('recalcBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Calculating…';
  try {
    await fetchEditDistance();
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-route"></i> Recalculate';
  }
}

async function saveEdit() {
  if (!editingTrip) return;
  if (!routePayload(editRoute)) {
    alert('Fill in the first and last locations — where the trip started and where it ended.');
    return;
  }

  const tripDateError = validateTripDate(document.getElementById('editTripDate').value);
  if (tripDateError) { alert(tripDateError); return; }

  const endDateError = validateEndDate(document.getElementById('editEndDate').value,
                                       document.getElementById('editTripDate').value);
  if (endDateError) { alert(endDateError); return; }

  const btn = document.getElementById('saveEditBtn');

  // The distance in editingTrip is only valid for the route it was last
  // calculated for. Editing any location, adding or removing one, or just
  // moving one, all change the route — so one key over the whole ordered list
  // covers every case, and a stale distance is recalculated rather than saved.
  // The route is normally measured while it is edited, so this usually finds
  // the answer already there. It still runs, because a save can land inside the
  // debounce window or while a request is in flight — the distance stored must
  // be the one for the route being saved, not the one before the last edit.
  if (routeKey(editRoute.allRows()) !== editingTrip.calcRouteKey) {
    btn.disabled = true;
    btn.textContent = 'Recalculating…';
    const problem = await fetchEditDistance();
    // The modal can be closed while that was measuring, which resets the state
    // and leaves nothing to save. Without this the reset reads as a failed
    // measurement and the user is told the distance could not be worked out,
    // about a trip they have already dismissed.
    if (!editingTrip) return;
    btn.disabled = false;
    btn.textContent = 'Save Changes';
    if (problem === 'changed-while-measuring') {
      alert('The route changed while the distance was being measured. Press Save again to store the new one.');
      return;
    }
    if (problem) {
      alert('Could not measure the distance for these locations. Check the addresses and try again.');
      return;
    }
  }

  // Rebuilt after the await, not reused from the top of this function: the
  // locations may have moved while the measurement was in flight, and the body
  // has to describe the same route the distance was measured for.
  const route = routePayload(editRoute);
  if (!route || routeKey(editRoute.allRows()) !== editingTrip.calcRouteKey) {
    alert('The route changed while the distance was being measured. Press Save again to store the new one.');
    return;
  }

  const vehicleVal = document.getElementById('editVehicle').value;
  const businessVal = document.getElementById('editBusiness').value;
  const payload = {
    ...route,
    distance_miles: editingTrip.miles,
    duration_seconds: editingTrip.durationSeconds,
    vehicle_id: vehicleVal ? parseInt(vehicleVal) : null,
    business_id: businessVal ? parseInt(businessVal) : null,
    notes:      document.getElementById('editNotes').value,
    trip_date:  document.getElementById('editTripDate').value  || null,
    end_date:   document.getElementById('editEndDate').value   || null,
    start_time: getTimeValue('editStartTime'),
    end_time:   getTimeValue('editEndTime'),
    client_today: localToday(),
  };

  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const resp = await fetch(`/history/${editingTrip.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if (!resp.ok) { alert(data.error || 'Failed to save.'); return; }

    // Full re-render rather than patching the row in place: the trip's date
    // may have changed, which can change where it belongs in the recency-
    // sorted list, not just its own content.
    await loadHistory();
    if (data.warning) alert(data.warning);
    closeEditModal();
  } catch { alert('Network error. Could not save changes.'); }
  finally { btn.disabled = false; btn.textContent = 'Save Changes'; }
}


// Stamp date and start time before the draft is restored, so a draft's own
// values still take precedence — same ordering as the default vehicle, which
// loadVehicles() applies once the list arrives.
applyTripDateTimeDefaults();
// Restore the draft only once BOTH lists are in. Each load applies its own
// default when it resolves, so restoring earlier would let a late-arriving
// list overwrite a value the draft had deliberately cleared.
wireNotesCounter('tripNotes', 'tripNotesCounter');
wireNotesCounter('editNotes', 'editNotesCounter');
Promise.all([loadVehicles(), loadBusinesses()]).then(restoreTripDraft);
loadHistory();


// ─── Export ───────────────────────────────────────────────────────────────

const round2 = n => Math.round(n * 100) / 100;

// The "Exported on ... · N trips · X mi total" summary row shared by the
// CSV file and the first sheet of the Excel workbook.
function exportHeaderRow() {
  return [`Exported on ${new Date().toLocaleDateString()}`, `${tripCount} trips`, `${round2(totalMilesAccum)} mi total`];
}

// Shared by CSV/Excel/PDF: the row block for one year's trips — a heading,
// the "By Vehicle" breakdown (if any), the trip table, and its total row.
function yearRowBlock(group) {
  const yearMiles = group.trips.reduce((sum, t) => sum + (t.miles ?? 0), 0);
  const yearLabel = group.year === 'Unknown' ? 'Unknown Year' : group.year;
  const rows = [
    [yearLabel],
    [`${group.trips.length} trip${group.trips.length === 1 ? '' : 's'}`, `${round2(yearMiles)} mi total`],
    [],
  ];

  const vehicleRows = vehicleSummary(group.trips);
  if (vehicleRows.length) {
    rows.push(['By Vehicle']);
    rows.push(['Vehicle', 'Trips', 'Miles']);
    vehicleRows.forEach(v => rows.push([v.name, v.trips, round2(v.miles)]));
    rows.push([]);
  }

  const businessRows = businessSummary(group.trips);
  if (businessRows.length) {
    rows.push(['By Business']);
    rows.push(['Business', 'Trips', 'Miles']);
    businessRows.forEach(b => rows.push([b.name, b.trips, round2(b.miles)]));
    rows.push([]);
  }

  // ISO dates rather than "Oct 2, 2026": a spreadsheet sorts and filters these
  // correctly, which is the point of exporting to one.
  rows.push(['Start Location', 'Stops', 'End Location', 'Miles', 'Vehicle', 'Business',
             'Start Date', 'Start Time', 'End Date', 'End Time', 'Logged At', 'Notes']);
  group.trips.forEach(t => rows.push([
    t.start, stopsText(t), t.end, t.miles ?? '',
    t.vehicle_name  || '',
    t.business_name || '',
    t.trip_date    || '',
    t.start_time   || '',
    (t.end_date || derivedEndDate(t.trip_date, t.start_time, t.end_time) || ''),
    t.end_time     || '',
    t.timestamp,
    t.notes        || ''
  ]));
  rows.push(['', '', 'TOTAL', round2(yearMiles), '', '', '', '', '', '', '']);
  return rows;
}

function exportCSV() {
  const yearGroups = groupTripsByYear(tripsData);
  const rows = [exportHeaderRow(), []];
  yearGroups.forEach(group => {
    rows.push(...yearRowBlock(group));
    rows.push([]);
  });

  const csv = rows.map(r =>
    r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')
  ).join('\r\n');
  triggerDownload('mileage-log.csv', 'text/csv;charset=utf-8;', csv);
}

function exportExcel() {
  const yearGroups = groupTripsByYear(tripsData);
  const wb = XLSX.utils.book_new();

  yearGroups.forEach((group, i) => {
    const rows = [];
    if (i === 0) {
      rows.push(exportHeaderRow());
      rows.push([]);
    }
    rows.push(...yearRowBlock(group));

    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{ wch: 34 }, { wch: 40 }, { wch: 34 }, { wch: 8 }, { wch: 18 }, { wch: 18 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 22 }, { wch: 46 }];
    const sheetName = group.year === 'Unknown' ? 'Unknown Year' : group.year;
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });

  XLSX.writeFile(wb, 'mileage-log.xlsx');
}

// Trips are grouped by year for the PDF export (one page per year). A trip's
// year comes from its trip_date when set, else the year embedded in its
// "MMM DD, YYYY h:mm AM/PM" logged-at timestamp string.
// Stops for export, in visit order. "; " rather than an arrow: jsPDF's built-in
// fonts have no glyph for "→" and would print garbage in its place.
function stopsText(t) { return (t.stops || []).map(st => st.label).join('; '); }

function businessSummary(trips) {
  if (!trips.some(t => t.business_name)) return [];
  return groupSummary(trips, t => t.business_name || 'No business');
}

function tripYear(t) {
  if (t.trip_date) return t.trip_date.slice(0, 4);
  const m = (t.timestamp || '').match(/,\s*(\d{4})/);
  return m ? m[1] : 'Unknown';
}

// Trips grouped by business name for the PDF sections. Trips with no business
// are kept in a trailing "No business" group rather than dropped: they are
// still deductible mileage and must appear in the year's total.
function groupTripsByBusiness(trips) {
  const groups = new Map();
  trips.forEach(t => {
    const name = t.business_name || 'No business';
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push(t);
  });
  return [...groups.entries()]
    .map(([name, ts]) => ({ name, trips: ts }))
    .sort((a, b) => {
      if (a.name === 'No business') return 1;
      if (b.name === 'No business') return -1;
      return a.name.localeCompare(b.name);
    });
}

function groupTripsByYear(trips) {
  const groups = new Map();
  trips.forEach(t => {
    const year = tripYear(t);
    if (!groups.has(year)) groups.set(year, []);
    groups.get(year).push(t);
  });
  const years = [...groups.keys()].sort((a, b) => {
    if (a === 'Unknown') return 1;
    if (b === 'Unknown') return -1;
    return b - a;
  });
  return years.map(year => ({ year, trips: groups.get(year) }));
}

// Per-vehicle trip count/miles for one year's trips, sorted by miles
// descending. Trips with no vehicle assigned are bucketed under "No
// vehicle". Returns [] if nobody used a vehicle that year — nothing
// useful to break down.
function vehicleSummary(trips) {
  if (!trips.some(t => t.vehicle_name)) return [];
  return groupSummary(trips, t => t.vehicle_name || 'No vehicle');
}

// Trips grouped by a label, with trip count and miles, ordered by miles.
function groupSummary(trips, labelOf) {
  const map = new Map();
  trips.forEach(t => {
    const name = labelOf(t);
    if (!map.has(name)) map.set(name, { trips: 0, miles: 0 });
    const entry = map.get(name);
    entry.trips += 1;
    entry.miles += t.miles ?? 0;
  });
  return [...map.entries()]
    .map(([name, v]) => ({ name, ...v }))
    .sort((a, b) => b.miles - a.miles);
}

// Explicit widths for every trip table on a year page, in mm. autoTable sizes
// columns from each table's own content, and each business section is its own
// call, so without a shared spec a section with long addresses would place its
// columns differently from one with short addresses, and the year-total row —
// which has almost no content to size from — would land its label and figure
// somewhere else entirely. Pinning the widths is what lets a subtotal be read
// straight down against the total beneath it.
// Sums to 268mm against the 269mm usable on landscape A4 (297mm less 14mm
// margins), so it fills the page without overflowing it.
const PDF_TRIP_COLUMN_STYLES = {
  0: { cellWidth: 44 },                    // Start Location
  1: { cellWidth: 42, overflow: 'linebreak' },  // Stops, wrapped like Notes
  2: { cellWidth: 44 },                    // End Location
  3: { cellWidth: 14, halign: 'right' },   // Miles
  4: { cellWidth: 26 },                    // Vehicle
  // 26mm each against the 20+16+16 the three separate date and time columns
  // took, so the page total is unchanged and one column is freed.
  5: { cellWidth: 26, overflow: 'linebreak' },  // Start (date and time)
  6: { cellWidth: 26, overflow: 'linebreak' },  // End (date and time)
  // Notes wrap onto as many lines as they need inside this width, growing the
  // row rather than spilling into the next column or off the page. A fixed
  // width is what makes wrapping possible: an auto-sized column would stretch
  // to the longest note and push the other columns off a landscape page.
  7: { cellWidth: 46, overflow: 'linebreak' },  // Notes
};

// receipts/returnDoc are passed only by the receipts export, which needs the
// same log plus a receipts section and wants the document rather than a
// download, so it can keep appending to it.
function exportPDF(receipts = null, returnDoc = false) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape' });
  const yearGroups = groupTripsByYear(tripsData);

  doc.setFontSize(16);
  doc.setTextColor(79, 70, 229);
  doc.text('Mileage Log', 14, 18);

  doc.setFontSize(9);
  doc.setTextColor(100, 116, 139);
  doc.text(`Exported on ${new Date().toLocaleDateString()}  ·  ${tripCount} trips  ·  ${(Math.round(totalMilesAccum * 100) / 100).toLocaleString()} mi total`, 14, 25);

  yearGroups.forEach((group, i) => {
    const headingY = i === 0 ? 32 : 20;
    if (i > 0) doc.addPage();

    const yearMiles = group.trips.reduce((sum, t) => sum + (t.miles ?? 0), 0);
    const yearLabel = group.year === 'Unknown' ? 'Unknown Year' : group.year;

    doc.setFontSize(13);
    doc.setTextColor(30, 41, 59);
    doc.text(yearLabel, 14, headingY);

    doc.setFontSize(9);
    doc.setTextColor(100, 116, 139);
    doc.text(
      `${group.trips.length} trip${group.trips.length === 1 ? '' : 's'}  ·  ${(Math.round(yearMiles * 100) / 100).toLocaleString()} mi total`,
      14, headingY + 6
    );

    let tableStartY = headingY + 11;
    const vehicleRows = vehicleSummary(group.trips);
    if (vehicleRows.length) {
      doc.setFontSize(8);
      doc.setTextColor(30, 41, 59);
      doc.text('By Vehicle', 14, tableStartY);
      tableStartY += 3;

      doc.autoTable({
        startY: tableStartY,
        head: [['Vehicle', 'Trips', 'Miles']],
        body: vehicleRows.map(v => [v.name, v.trips, Math.round(v.miles * 100) / 100]),
        theme: 'plain',
        styles: { fontSize: 7, cellPadding: 1 },
        headStyles: { fontStyle: 'bold', textColor: [100, 116, 139] },
        columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right' } },
        tableWidth: 90,
        margin: { left: 14, right: 14 },
      });
      tableStartY = doc.lastAutoTable.finalY + 6;
    }

    const businessRows = businessSummary(group.trips);
    if (businessRows.length) {
      doc.setFontSize(8);
      doc.setTextColor(30, 41, 59);
      doc.text('By Business', 14, tableStartY);
      tableStartY += 3;

      doc.autoTable({
        startY: tableStartY,
        head: [['Business', 'Trips', 'Miles']],
        body: businessRows.map(b => [b.name, b.trips, Math.round(b.miles * 100) / 100]),
        theme: 'plain',
        styles: { fontSize: 7, cellPadding: 1 },
        headStyles: { fontStyle: 'bold', textColor: [100, 116, 139] },
        columnStyles: { 1: { halign: 'right' }, 2: { halign: 'right' } },
        tableWidth: 90,
        margin: { left: 14, right: 14 },
      });
      tableStartY = doc.lastAutoTable.finalY + 6;
    }

    // One table per business inside the year, each with its own subtotal, so a
    // year's page can be read per business without adding it up by hand. The
    // Business column is dropped from these rows — the section heading already
    // says which business it is, and repeating it down every row wastes the
    // width that the location columns need.
    groupTripsByBusiness(group.trips).forEach(bGroup => {
      const bMiles = bGroup.trips.reduce((sum, t) => sum + (t.miles ?? 0), 0);

      doc.setFontSize(8);
      doc.setTextColor(79, 70, 229);
      doc.text(bGroup.name, 14, tableStartY);
      tableStartY += 3;

      doc.autoTable({
        startY: tableStartY,
        head: [['Start Location', 'Stops', 'End Location', 'Miles', 'Vehicle', 'Start', 'End', 'Notes']],
        body: bGroup.trips.map(t => [
          t.start, stopsText(t), t.end, t.miles ?? '',
          t.vehicle_name || '',
          formatDateTime(t.trip_date, t.start_time),
          formatDateTime(t.end_date || derivedEndDate(t.trip_date, t.start_time, t.end_time), t.end_time),
          t.notes        || ''
        ]),
        foot: [['', '', 'Subtotal', Math.round(bMiles * 100) / 100, '', '', '', '']],
        headStyles:  { fillColor: [79, 70, 229], fontSize: 7, fontStyle: 'bold' },
        footStyles:  { fillColor: [238, 242, 255], textColor: [79, 70, 229], fontStyle: 'bold', fontSize: 7 },
        bodyStyles:  { fontSize: 7, valign: 'top' },
        columnStyles: PDF_TRIP_COLUMN_STYLES,
        margin: { left: 14, right: 14 },
      });
      tableStartY = doc.lastAutoTable.finalY + 6;
    });

    // Year total across every business on the page.
    doc.autoTable({
      startY: tableStartY,
      body: [],
      foot: [['', '', `${yearLabel} total`, Math.round(yearMiles * 100) / 100, '', '', '', '']],
      showHead: 'never',
      headStyles:  { fillColor: [79, 70, 229], fontSize: 7, fontStyle: 'bold' },
      footStyles:  { fillColor: [238, 242, 255], textColor: [79, 70, 229], fontStyle: 'bold', fontSize: 7 },
      bodyStyles:  { fontSize: 7 },
      columnStyles: PDF_TRIP_COLUMN_STYLES,
      alternateRowStyles: { fillColor: [248, 250, 252] },
      margin: { left: 14, right: 14 },
    });
  });

  if (receipts) appendReceiptSection(doc, receipts);

  if (returnDoc) return doc;
  doc.save('mileage-log.pdf');
}

// ─── Log with receipts (one PDF) ──────────────────────────────────────────
// The trip table already spends 268 of the 269mm usable across a landscape A4
// page, so there is no column free for receipts. They go after the log
// instead, in three parts: a contact sheet of thumbnails, then one full page
// per image, then any attached PDF merged in whole.
//
// It is one file on purpose. The earlier shape was a ZIP holding the log, the
// original files and an index.html of links to them, because a PDF cannot be
// relied on to open a sibling file — Acrobat follows a relative link, the
// Chrome and Firefox viewers refuse, and phone viewers ignore it, all without
// saying so. That worked, but it meant opening two files to read one log. The
// cost of folding it in is that what you get is a rendered copy of each image
// rather than the original bytes; the originals stay in the app.
const RECEIPT_THUMB_MM = 34;

// A filename unique within its trip, so two receipts uploaded under the same
// name are still told apart in the overview and on their pages.
function uniqueFileName(filename, taken) {
  if (!taken.has(filename)) { taken.add(filename); return filename; }
  const dot = filename.lastIndexOf('.');
  const stem = dot > 0 ? filename.slice(0, dot) : filename;
  const ext = dot > 0 ? filename.slice(dot) : '';
  let n = 2, name;
  do { name = `${stem}-${n++}${ext}`; } while (taken.has(name));
  taken.add(name);
  return name;
}

function tripLabel(trip) {
  const when = trip.trip_date ? formatTripDate(trip.trip_date) : (trip.timestamp || 'Undated');
  return `${when} · ${trip.start || '?'} → ${trip.end || '?'}`;
}

// Downloads every attachment once. Returns the trips that have any, each with
// its files as blobs, so the overview, the pages and the merge all describe the
// same bytes rather than fetching them three times.
async function collectReceipts(trips, onProgress) {
  const out = [];
  const withFiles = trips.filter(t => (t.attachments || []).length);
  let done = 0;
  const total = withFiles.reduce((n, t) => n + t.attachments.length, 0);
  for (const trip of withFiles) {
    const names = new Set();
    const entry = { trip, files: [] };
    for (const att of trip.attachments) {
      const file = { ...att, name: uniqueFileName(att.filename, names), blob: null,
                     isPdf: att.mimetype === 'application/pdf' };
      try {
        const resp = await fetch(`/attachment/${att.id}`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        file.blob = await resp.blob();
      } catch (err) {
        // One unreadable file should not cost the whole export; it is recorded
        // so the overview can say it is missing rather than imply the trip had
        // nothing attached.
        console.warn('[export]', att.filename, err);
      }
      entry.files.push(file);
      onProgress?.(++done, total);
    }
    out.push(entry);
  }
  return out;
}

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
}

// The largest box of the image's own proportions that fits maxW x maxH, so a
// tall receipt is not stretched into a wide one. It always fills the box,
// including for an image smaller than it: a little blockiness costs less than
// a preview too small to see, and the alternative — clamping the scale at 1 —
// compares pixels against millimetres, which is what once drew an 8x8px image
// 8mm across.
function fitBox(width, height, maxW, maxH) {
  const scale = Math.min(maxW / width, maxH / height);
  return { w: width * scale, h: height * scale };
}

// Roughly print resolution for the size each image is drawn at, so the
// re-encode shrinks a 4MB phone photo to a few tens of KB for a thumbnail and
// a few hundred for a full page, instead of embedding it whole for either.
const THUMB_DPI = 200;
const PAGE_IMAGE_DPI = 150;

// Re-encodes an attachment to a JPEG data URL, at the box `pick` chooses for
// its natural size. This is the only reason the PDF can draw receipts at all:
// jsPDF decodes an image with the processor for the format it is *told*, and an
// attachment may be PNG, WebP or GIF. A PNG handed over as 'JPEG' throws
// ("Error while decompressing the data"), and WebP it cannot read in any
// format. Going through a canvas makes every image one format jsPDF definitely
// handles, at the pixel size actually needed.
async function renderToJpeg(file, pick, dpi, quality) {
  if (!file.blob || !file.previewable) return null;
  try {
    const dataUrl = await blobToDataUrl(file.blob);
    const img = await new Promise((resolve, reject) => {
      const el = new Image();
      el.onload = () => resolve(el);
      el.onerror = () => reject(new Error('not decodable'));
      el.src = dataUrl;
    });
    const box = pick(img);
    const scale = dpi / 25.4;
    const canvas = document.createElement('canvas');
    canvas.width  = Math.max(1, Math.round(box.w * scale));
    canvas.height = Math.max(1, Math.round(box.h * scale));
    const ctx = canvas.getContext('2d');
    // JPEG has no transparency, so a PNG or GIF with an alpha channel would
    // come out on black without this.
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    return { dataUrl: canvas.toDataURL('image/jpeg', quality), ...box };
  } catch (err) {
    // A file whose bytes passed the server's sniffing can still fail to decode
    // here — HEIC in anything but Safari is the usual case — and a browser
    // without canvas support lands here too. It is listed by name instead.
    console.warn('[export] could not render', file.filename, err);
    return null;
  }
}

const loadThumb = file =>
  renderToJpeg(file, img => fitBox(img.naturalWidth, img.naturalHeight,
                                  RECEIPT_THUMB_MM, RECEIPT_THUMB_MM),
               THUMB_DPI, 0.82);

const PAGE_MARGIN = 14;
const THUMB_GAP = 4;
const THUMB_CAPTION_H = 7;   // two lines: the filename, then where to find it
const NAMED_LINE_H = 5;
const ENTRY_HEADER_H = 9;
const PAGE_IMAGE_TOP = 22;   // below the trip and filename headings

// How much of a page is left for the image, in each orientation, for A4.
const PAGE_BOXES = {
  landscape: { w: 297 - PAGE_MARGIN * 2, h: 210 - PAGE_IMAGE_TOP - PAGE_MARGIN },
  portrait:  { w: 210 - PAGE_MARGIN * 2, h: 297 - PAGE_IMAGE_TOP - PAGE_MARGIN },
};

// A receipt gets the page shape that suits it: a phone photo of a till roll is
// portrait, and fitting it to a landscape page would waste half the paper and
// leave the print too small to read.
const loadPageImage = file =>
  renderToJpeg(file, img => {
    const orientation = img.naturalHeight >= img.naturalWidth ? 'portrait' : 'landscape';
    const box = PAGE_BOXES[orientation];
    return { ...fitBox(img.naturalWidth, img.naturalHeight, box.w, box.h), orientation };
  }, PAGE_IMAGE_DPI, 0.86);

// Thumbnails packed into rows that stop at the right margin, with the height
// each row needs. Measured before anything is drawn, because the page-break
// decision needs to know how tall the whole block is: laying out while drawing
// is what let thumbnails run off the page and text land on top of them.
function layOutThumbs(files, usableWidth) {
  const rows = [];
  let row = { files: [], width: 0, height: 0 };
  for (const file of files) {
    const needed = file.thumb.w + (row.files.length ? THUMB_GAP : 0);
    if (row.files.length && row.width + needed > usableWidth) {
      rows.push(row);
      row = { files: [], width: 0, height: 0 };
    }
    row.width += file.thumb.w + (row.files.length ? THUMB_GAP : 0);
    row.height = Math.max(row.height, file.thumb.h);
    row.files.push(file);
  }
  if (row.files.length) rows.push(row);
  return rows;
}

// The contact sheet: every receipt at a glance, grouped by trip. Each entry
// also records where its "page N" caption goes, on `file.slot`, because the
// pages it points at are not drawn until this section is finished.
function appendReceiptSection(doc, receipts) {
  if (!receipts.length) return;
  doc.addPage('a4', 'landscape');
  doc.setFontSize(13);
  doc.setTextColor(30, 41, 59);
  doc.text('Receipts & documents', PAGE_MARGIN, 20);
  doc.setFontSize(9);
  doc.setTextColor(100, 116, 139);
  doc.text('Each receipt has a full page of its own further on — click a thumbnail to jump to it.',
           PAGE_MARGIN, 26);

  const pageBottom = doc.internal.pageSize.getHeight() - PAGE_MARGIN;
  const usableWidth = doc.internal.pageSize.getWidth() - PAGE_MARGIN * 2;
  let y = 36;

  for (const entry of receipts) {
    // Split by what can actually be drawn here. A file whose thumbnail failed
    // to load is listed by name, as are PDFs — the two are the same case as far
    // as this layout is concerned, even though a PDF does get pages of its own.
    const drawable = entry.files.filter(f => f.thumb);
    const named    = entry.files.filter(f => !f.thumb);
    const rows = layOutThumbs(drawable, usableWidth);

    const thumbsHeight = rows.reduce((h, r) => h + r.height + THUMB_CAPTION_H + THUMB_GAP, 0);
    const blockHeight = ENTRY_HEADER_H + thumbsHeight + named.length * NAMED_LINE_H + 6;
    // A trip with many receipts can be taller than a page on its own, so it
    // only moves to a fresh page when that would actually help.
    if (y > 36 && y + blockHeight > pageBottom) { doc.addPage('a4', 'landscape'); y = 20; }

    doc.setFontSize(9.5);
    doc.setTextColor(30, 41, 59);
    doc.text(tripLabel(entry.trip), PAGE_MARGIN, y);
    doc.setFontSize(8);
    doc.setTextColor(100, 116, 139);
    doc.text(entry.files.length === 1 ? '1 file' : `${entry.files.length} files`, PAGE_MARGIN, y + 5);
    y += ENTRY_HEADER_H;

    for (const row of rows) {
      if (y + row.height + THUMB_CAPTION_H > pageBottom) { doc.addPage('a4', 'landscape'); y = 20; }
      let x = PAGE_MARGIN;
      for (const file of row.files) {
        try {
          doc.addImage(file.thumb.dataUrl, 'JPEG', x, y, file.thumb.w, file.thumb.h);
          doc.setFontSize(6.5);
          doc.setTextColor(100, 116, 139);
          doc.text(file.name.slice(0, 26), x, y + file.thumb.h + 3.5);
          file.slot = { page: doc.internal.getCurrentPageInfo().pageNumber,
                        x, y, w: file.thumb.w, h: file.thumb.h,
                        captionY: y + file.thumb.h + THUMB_CAPTION_H };
          x += file.thumb.w + THUMB_GAP;
        } catch (err) {
          // One image jsPDF will not take must not cost the whole export: it
          // falls back to being named below.
          console.warn('[export] could not draw', file.name, err);
          named.push(file);
        }
      }
      y += row.height + THUMB_CAPTION_H + THUMB_GAP;
    }

    // Below the thumbnails rather than beside them, each on its own line, so
    // nothing is drawn over anything else.
    for (const file of named) {
      if (y + NAMED_LINE_H > pageBottom) { doc.addPage('a4', 'landscape'); y = 20; }
      doc.setFontSize(8);
      doc.setTextColor(71, 85, 105);
      const label = `• ${file.name}${file.blob ? '' : '  (could not be read)'}`;
      doc.text(label, PAGE_MARGIN, y + 4);
      // No thumbnail to click, so only the caption is a slot, set beside the
      // name. A PDF still gets one: its own pages are merged in at the end.
      file.slot = { page: doc.internal.getCurrentPageInfo().pageNumber,
                    x: PAGE_MARGIN + doc.getTextWidth(label) + 3, y: y + 4, w: 0, h: 0,
                    captionY: y + 4 };
      y += NAMED_LINE_H;
    }
    y += 6;
  }
}

// One page per image, as large as the page allows, so the PDF is something a
// receipt can actually be read from rather than a sheet of 34mm previews.
// Records the page it landed on, on `file.pageNumber`.
function appendReceiptPages(doc, receipts) {
  for (const entry of receipts) {
    for (const file of entry.files) {
      if (!file.page) continue;
      doc.addPage('a4', file.page.orientation);
      doc.setFontSize(9.5);
      doc.setTextColor(30, 41, 59);
      doc.text(tripLabel(entry.trip), PAGE_MARGIN, 14);
      doc.setFontSize(8);
      doc.setTextColor(100, 116, 139);
      doc.text(file.name, PAGE_MARGIN, 19);
      const x = (doc.internal.pageSize.getWidth() - file.page.w) / 2;
      try {
        doc.addImage(file.page.dataUrl, 'JPEG', x, PAGE_IMAGE_TOP, file.page.w, file.page.h);
        file.pageNumber = doc.internal.getCurrentPageInfo().pageNumber;
      } catch (err) {
        // The page stays, saying so, rather than being removed: deleting it
        // would renumber every page after it, including ones already recorded.
        console.warn('[export] could not draw', file.name, err);
        doc.setTextColor(185, 28, 28);
        doc.text('This image could not be drawn. The original is in the app.',
                 PAGE_MARGIN, PAGE_IMAGE_TOP + 6);
      }
    }
  }
}

// Every attached PDF, and how many pages it has, read up front so the overview
// can say where each one starts before the merge actually happens. The parsed
// document is kept so the merge does not read the same bytes twice.
async function readAttachedPdfs(receipts) {
  const out = [];
  if (!window.PDFLib) return out;
  for (const entry of receipts) {
    for (const file of entry.files) {
      if (!file.isPdf || !file.blob) continue;
      try {
        file.pdfDoc = await PDFLib.PDFDocument.load(await file.blob.arrayBuffer(),
                                                   { ignoreEncryption: true });
        out.push(file);
      } catch (err) {
        // An encrypted or malformed PDF is listed by name like any other file
        // that cannot be rendered.
        console.warn('[export] could not read', file.name, err);
      }
    }
  }
  return out;
}

// Writes each receipt's "page N" caption and makes its thumbnail a link, once
// every page is known. Deferred because the overview is drawn before the pages
// it points at exist.
//
// Only images get a clickable link. A merged PDF's pages are added by pdf-lib
// after jsPDF has written the file, so there is no page object for a jsPDF
// annotation to point at — the caption says the number instead.
function resolveReceiptRefs(doc, receipts) {
  const current = doc.internal.getCurrentPageInfo().pageNumber;
  for (const entry of receipts) {
    for (const file of entry.files) {
      if (!file.slot || !file.pageNumber) continue;
      doc.setPage(file.slot.page);
      doc.setFontSize(6.5);
      doc.setTextColor(79, 70, 229);
      doc.text(`page ${file.pageNumber}`, file.slot.x, file.slot.captionY);
      if (file.slot.w && file.page) {
        doc.link(file.slot.x, file.slot.y, file.slot.w, file.slot.h,
                 { pageNumber: file.pageNumber });
      }
    }
  }
  doc.setPage(current);
}

// Appends every attached PDF whole, rather than redrawing it, so a multi-page
// invoice arrives intact and still selectable as text.
async function mergeAttachedPdfs(doc, pdfFiles) {
  const base = await PDFLib.PDFDocument.load(doc.output('arraybuffer'));
  for (const file of pdfFiles) {
    try {
      const pages = await base.copyPages(file.pdfDoc, file.pdfDoc.getPageIndices());
      for (const page of pages) base.addPage(page);
    } catch (err) {
      // The log and the images are already in `base`, so a PDF that will not
      // copy costs only itself.
      console.warn('[export] could not merge', file.name, err);
    }
  }
  return new Blob([await base.save()], { type: 'application/pdf' });
}

async function exportSinglePdf() {
  const btn = document.getElementById('exportFullBtn');
  const original = btn.innerHTML;
  btn.disabled = true;
  const setLabel = txt => { btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i><span class="export-label"> ${txt}</span>`; };
  setLabel('Collecting…');
  try {
    const receipts = await collectReceipts(tripsData, (done, total) => setLabel(`${done}/${total}…`));
    if (!receipts.length) { exportPDF(); return; }

    setLabel('Building…');
    // Both renders and the PDF page counts are done before anything is drawn,
    // because the overview's page references depend on all three.
    for (const entry of receipts) {
      for (const file of entry.files) {
        file.thumb = await loadThumb(file);
        file.page  = await loadPageImage(file);
      }
    }
    const pdfFiles = await readAttachedPdfs(receipts);

    const doc = exportPDF(receipts, true);
    appendReceiptPages(doc, receipts);
    // Merged pages land after everything jsPDF wrote, in the order they are
    // merged, so their numbers can be assigned now.
    let next = doc.internal.getNumberOfPages() + 1;
    for (const file of pdfFiles) {
      file.pageNumber = next;
      next += file.pdfDoc.getPageCount();
    }
    resolveReceiptRefs(doc, receipts);

    const stamp = new Date().toISOString().slice(0, 10);
    const blob = pdfFiles.length ? await mergeAttachedPdfs(doc, pdfFiles) : doc.output('blob');
    triggerDownload(`mileage-log-${stamp}.pdf`, 'application/pdf', blob);
  } catch (err) {
    console.warn('[export]', err);
    showError('Could not build the PDF with receipts. The log alone is still available from the PDF button.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

function triggerDownload(filename, type, content) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}
