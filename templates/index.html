  // cleared here: _userSet means a value worth submitting, which a partial
  // entry is not, and 'change' sets that once the time is complete.
  el.addEventListener('input', function() { this._defaulted = false; });
}

function getTimeValue(id) {
  const el = document.getElementById(id);
  return (el && el._userSet && el.value) ? el.value : null;
}

initTimeInput('tripStartTime');
initTimeInput('tripEndTime');
initTimeInput('editStartTime');
initTimeInput('editEndTime');

// Chrome's native date input lets the year segment keep accepting digits
// past 4 (e.g. typing "202500"), because the WHATWG date-string grammar
// technically allows a 4-or-more-digit year — so .value legitimately
// reports "202500-01-01" instead of being rejected as invalid. Truncate
// the year back to 4 digits so the field can't be left showing something
// like "01/01/202500". Month/day segments already cap at 2 digits on
// their own (typing a 3rd digit there just invalidates the value).
//
// The native control's internal segment-editing buffer doesn't reliably
// line up with 'input'/'change' while a multi-digit year is still being
// typed, so rather than depend on exactly when those fire, poll .value on
// every animation frame while the field has focus and correct it the
// instant it overflows — independent of which DOM event (if any) fires.
function fixOverflowedYear(el) {
  const val = el.value;
  if (!val) return;
  const [y, m, d] = val.split('-');
  if (y && y.length > 4) el.value = `${y.slice(0, 4)}-${m}-${d}`;
}

function guardDateInput(id) {
  const el = document.getElementById(id);
  if (!el) return;
  let rafId = null;
  const tick = () => { fixOverflowedYear(el); rafId = requestAnimationFrame(tick); };
  el.addEventListener('focus', () => { if (rafId === null) rafId = requestAnimationFrame(tick); });
  el.addEventListener('blur', () => {
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
    fixOverflowedYear(el);
  });
}
guardDateInput('tripDate');
guardDateInput('editTripDate');

// Cap the native picker/typing to today so the calendar UI can't even offer
// a future date (belt-and-suspenders alongside validateTripDate() below).
function localToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// Local wall-clock "HH:MM", matching what <input type="time"> expects.
function localNowTime() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
// Deliberately a function, not a constant: a value cached at load is wrong
// for any page still open after midnight.
function applyTripMaxDate() {
  const today = localToday();
  ['tripDate', 'editTripDate'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.max = today;
  });
}
applyTripMaxDate();

// Blocking check used by both the new-trip and edit-trip forms: a trip date
// is optional, but if set it must be a real calendar date (JS's Date
// constructor silently rolls "Feb 30" over into March, so components are
// checked explicitly rather than trusted) and can't be in the future.
function validateTripDate(value) {
  if (!value) return null;
  const m = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return 'Please enter a valid date.';
  const [y, mo, d] = m.slice(1).map(Number);
  const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) {
    return 'Please enter a valid date.';
  }
  if (value > localToday()) return 'Trip date cannot be in the future.';
  return null;
}


// ─── Trip time feasibility check ───────────────────────────────────────────

const FEASIBILITY_MIN_RATIO = 0.5;
const FEASIBILITY_MAX_RATIO = 3.0;
// Mirrors STOP_DWELL_ALLOWANCE_SECONDS in main.py: time at a stop is unknown,
// so each one adds this much headroom before a trip counts as too slow.
const STOP_DWELL_ALLOWANCE_SECONDS = 2 * 60 * 60;

function elapsedSeconds(startTime, endTime) {
  if (!startTime || !endTime) return null;
  const [sh, sm] = startTime.split(':').map(Number);
  const [eh, em] = endTime.split(':').map(Number);
  if ([sh, sm, eh, em].some(Number.isNaN)) return null;
  let startMin = sh * 60 + sm, endMin = eh * 60 + em;
  // Strictly earlier, matching endsNextDay(): equal times are a zero-length
  // trip, and reading them as a full day round-trip produced a nonsense
  // "much longer than typical" warning.
  if (endMin < startMin) endMin += 24 * 60;
  return (endMin - startMin) * 60;
}

function feasibilityWarning(startTime, endTime, distanceMiles, durationSeconds, stopCount = 0) {
  if (durationSeconds == null || !distanceMiles) return null;
  const elapsed = elapsedSeconds(startTime, endTime);
  if (elapsed == null || elapsed <= 0) return null;
  const elapsedMin = Math.round(elapsed / 60), expectedMin = Math.round(durationSeconds / 60);
  if (elapsed < durationSeconds * FEASIBILITY_MIN_RATIO) {
    return `${distanceMiles} miles in ${elapsedMin} min is much faster than the ` +
           `typical ~${expectedMin} min for this route — double check the times.`;
  }
  if (elapsed > durationSeconds * FEASIBILITY_MAX_RATIO + stopCount * STOP_DWELL_ALLOWANCE_SECONDS) {
    if (stopCount) {
      return `${distanceMiles} miles in ${elapsedMin} min is much longer than ` +
             `~${expectedMin} min of driving, even allowing ${STOP_DWELL_ALLOWANCE_SECONDS / 3600} h at each of ` +
             `${stopCount} stop${stopCount === 1 ? '' : 's'} — double check the times.`;
    }
    return `${distanceMiles} miles in ${elapsedMin} min is much longer than the ` +
           `typical ~${expectedMin} min for this route — double check the times.`;
  }
  return null;
}

function updateSpeedWarning(warningElId, textElId, warning) {
  document.getElementById(textElId).textContent = warning || '';
  document.getElementById(warningElId).classList.toggle('show', !!warning);
}

function checkEditSpeedLive() {
  const w = editingTrip && feasibilityWarning(
    getTimeValue('editStartTime'), getTimeValue('editEndTime'),
    editingTrip.miles, editingTrip.durationSeconds, editingTrip.calcStopCount || 0
  );
  updateSpeedWarning('editSpeedWarning', 'editSpeedWarningText', w);
}
document.getElementById('editStartTime').addEventListener('change', checkEditSpeedLive);
document.getElementById('editEndTime').addEventListener('change', checkEditSpeedLive);


// ─── Estimated end time ───────────────────────────────────────────────────
// The end time is start time plus however long the route takes to drive, so a
// trip logged as it is taken needs no arithmetic from the user. It re-derives
// whenever the start time or any location changes, and stops the moment the
// user types an end time of their own — from then on the field is theirs.
//
// Driving time only, with nothing added for stops: how long someone spends at a
// stop is unknown, and padding the estimate with a guess would put a wrong
// duration on the trip. An untouched estimate therefore sits exactly at the
// route's own duration, which is comfortably inside the feasibility bounds.
// The arrival after a drive of any length: a wall-clock time plus how many
// midnights it crossed. The day count is the point — a time alone cannot
// distinguish a two-hour drive from a twenty-six hour one, and an end date set
// from the time alone could never be more than one day on.
function arrivalAfter(hhmm, seconds) {
  const [h, m] = (hhmm || '').split(':').map(Number);
  if (Number.isNaN(h) || Number.isNaN(m)) return null;
  const total = h * 60 + m + Math.round(seconds / 60);
  const days = Math.floor(total / 1440);
  const mins = ((total % 1440) + 1440) % 1440;
  return {
    time: `${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`,
    days,
  };
}

function formatDuration(seconds) {
  const mins = Math.max(1, Math.round(seconds / 60));
  return mins < 60 ? `${mins} min`
    : `${Math.floor(mins / 60)} h ${String(mins % 60).padStart(2, '0')} min`;
}

// Writes the estimate into the end time field unless the user has entered one.
// Setting .value fires no input event, so the flags are maintained by hand:
// _userSet so getTimeValue() submits it, _derived so a later change can replace
// it and so it is not mistaken for a time the user chose.
function applyEndTimeEstimate() {
  const endEl = document.getElementById('tripEndTime');
  const startEl = document.getElementById('tripStartTime');
  const hint = document.getElementById('endTimeHint');
  if (!endEl || !startEl) return;
  if (endEl.value && !endEl._derived) { hint.textContent = ''; return; }

  const secs = tripMeasure.durationSeconds;
  if (secs == null || !startEl.value) {
    if (endEl._derived) {
      endEl.value = ''; estimatedEndValue = null; estimatedEndDays = null;
      endEl._userSet = false; endEl._derived = false;
    }
    hint.textContent = '';
    return;
  }
  const arrival = arrivalAfter(startEl.value, secs);
  if (!arrival) return;
  endEl.value = arrival.time;
  estimatedEndValue = arrival.time;
  // Kept so the end date follows the drive's real length rather than being
  // re-inferred from the time, which cannot say more than "next day".
  estimatedEndDays = arrival.days;
  endEl._userSet = true;
  endEl._derived = true;
  syncTripEndDate();

  // Said explicitly: an arrival on another date looks like a mistake unless the
  // reason is on screen, and the trip date stays the day the trip set out.
  const driving = `Estimated from ${formatDuration(secs)} of driving`;
  hint.textContent = arrival.days === 0
    ? `${driving} — edit it if the trip ran differently.`
    : `${driving} — arrives ${arrival.days === 1 ? 'the next day' : `${arrival.days} days later`}. ` +
      `The trip date stays the day you set out.`;
}

// Asks the server for the route's distance and duration, at most once per
// distinct route. The answer is kept so logging the trip can send it along and
// the server skips recalculating, which keeps this feature free of extra
// Routes requests rather than adding one per trip.
// A start time the user picks moves the estimate with it; no request needed,
// since the driving time has not changed.
['input', 'change'].forEach(ev =>
  document.getElementById('tripStartTime').addEventListener(ev, () => {
    document.getElementById('tripStartTime')._defaulted = false;
    applyEndTimeEstimate();
  }));

// Once the user types an end time it is theirs, and the estimate stops writing
// to the field. Clearing it again hands the field back.
['input', 'change'].forEach(ev =>
  document.getElementById('tripEndTime').addEventListener(ev, e => {
    if (!e.target.value) {
      estimatedEndValue = null;
      e.target._derived = false;
      applyEndTimeEstimate();
      // Also a retry: a route whose measurement failed left nothing for
      // applyEndTimeEstimate to use, and the route itself has not changed to
      // trigger another attempt. Handing the field back is the user asking for
      // an estimate, so ask again.
      if (tripMeasure.durationSeconds == null) scheduleRouteMeasurements();
      return;
    }
    // Unchanged from what the estimate wrote: this is the second event of the
    // same keystroke, not the user replacing it.
    if (e.target.value === estimatedEndValue) return;
    e.target._derived = false;
    document.getElementById('endTimeHint').textContent = '';
    syncTripEndDate();
  }));


document.getElementById('tripVehicle').addEventListener('change', () => vehicleHintChange('tripVehicle', 'tripVehicleHint'));
// A change event only comes from the user: preselecting a default sets .value
// in code and fires nothing. So these flags mean "the user chose this", which
// is what decides whether a draft keeps it.
['tripVehicle', 'tripBusiness'].forEach(id =>
  document.getElementById(id).addEventListener('change', e => { e.target._userSet = true; }));
// 'input' as well as 'change': a date is entered component by component, and
// a restamp must not land on one the user is partway through typing.
['input', 'change'].forEach(ev =>
  document.getElementById('tripDate').addEventListener(ev, e => {
    e.target._defaulted = false;
    // The implied end date counts from the trip date, so moving one moves both.
    syncTripEndDate();
  }));
document.getElementById('editVehicle').addEventListener('change', () => vehicleHintChange('editVehicle', 'editVehicleHint'));


// ─── Attachments ──────────────────────────────────────────────────────────
// Receipts and documents kept with a trip. Two paths, because the trip may not
// exist yet: files chosen on the log form are held until /log returns an id and
// then uploaded, while the edit modal uploads immediately.
//
// The limits mirror the server's so the common mistakes are caught without a
// round trip; the server enforces them regardless, since the client's word
// about a file is never what decides.
const MAX_ATTACHMENTS_PER_TRIP = 10;
const MAX_ATTACHMENT_BYTES = 5 * 1024 * 1024;

// Files picked on the log form, waiting for a trip to belong to.
let pendingAttachments = [];

function formatBytes(n) {
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${Math.round(n / 1024)} KB`;
  return `${(n / (1024 * 1024)).toFixed(1)} MB`;
}

function attachIcon(mimetype) {
  if (mimetype === 'application/pdf') return 'fa-file-pdf';
  if ((mimetype || '').startsWith('image/')) return 'fa-file-image';
  return 'fa-paperclip';
}

// Rejects what the server would reject anyway, but immediately and by name, so
// a 5MB photo does not travel the network to be refused. The type is not
// checked here: the browser's idea of a file's type comes from its extension,
// and the server decides from the bytes.
function attachmentProblem(file, currentCount) {
  if (currentCount >= MAX_ATTACHMENTS_PER_TRIP) {
    return `A trip can have at most ${MAX_ATTACHMENTS_PER_TRIP} attachments.`;
  }
  if (!file.size) return `${file.name} is empty.`;
  if (file.size > MAX_ATTACHMENT_BYTES) {
    return `${file.name} is ${formatBytes(file.size)} — each file must be under ` +
           `${MAX_ATTACHMENT_BYTES / (1024 * 1024)}MB.`;
  }
  return null;
}

// One row per attachment. A saved one links to the download route; a pending
// one has nothing to link to yet, so it reads as plain text until it uploads.
function attachmentRow(att, onRemove) {
  const row = document.createElement('div');
  row.className = att.id ? 'attach-row' : 'attach-row is-pending';
  const icon = document.createElement('i');
  icon.className = `fas ${attachIcon(att.mimetype)} attach-icon`;
  row.appendChild(icon);

  let name;
  if (att.id) {
    name = document.createElement('a');
    name.href = `/attachment/${att.id}`;
    name.target = '_blank';
    name.rel = 'noopener';
  } else {
    name = document.createElement('span');
  }
  name.className = 'attach-name';
  name.textContent = att.filename;
  name.title = att.filename;
  row.appendChild(name);

  const size = document.createElement('span');
  size.className = 'attach-size';
  size.textContent = att.id ? formatBytes(att.byte_size) : 'uploads with the trip';
  row.appendChild(size);

  const del = document.createElement('button');
  del.type = 'button';
  del.className = 'attach-del';
  del.title = 'Remove';
  del.innerHTML = '<i class="fas fa-times"></i>';
  del.addEventListener('click', onRemove);
  row.appendChild(del);
  return row;
}

function renderPendingAttachments() {
  const list = document.getElementById('tripAttachList');
  list.innerHTML = '';
  pendingAttachments.forEach((file, i) => {
    list.appendChild(attachmentRow(
      { filename: file.name, mimetype: file.type },
      () => { pendingAttachments.splice(i, 1); renderPendingAttachments(); }
    ));
  });
}

document.getElementById('tripAttachInput').addEventListener('change', (e) => {
  const hint = document.getElementById('tripAttachHint');
  hint.textContent = '';
  for (const file of e.target.files) {
    const problem = attachmentProblem(file, pendingAttachments.length);
    if (problem) { hint.textContent = problem; break; }
    pendingAttachments.push(file);
  }
  // Cleared so picking the same file again still fires a change event.
  e.target.value = '';
  renderPendingAttachments();
});

async function uploadAttachment(tripId, file) {
  const body = new FormData();
  body.append('file', file);
  try {
    const resp = await fetch(`/trip/${tripId}/attachments`, { method: 'POST', body });
    const data = await resp.json().catch(() => ({}));
    return resp.ok ? { ok: true, attachment: data.attachment }
                   : { ok: false, error: data.error || 'Upload failed.' };
  } catch {
    return { ok: false, error: 'Network error during upload.' };
  }
}

// Uploaded one at a time rather than in parallel: the per-trip cap is counted
// server-side per request, so concurrent uploads could race past it, and a
// phone on a slow connection copes better with one 5MB body at a time.
async function uploadPendingAttachments(tripId) {
  const failures = [];
  for (const file of pendingAttachments) {
    const result = await uploadAttachment(tripId, file);
    if (!result.ok) failures.push(`${file.name} (${result.error})`);
  }
  pendingAttachments = [];
  renderPendingAttachments();
  return failures;
}

// ── Edit modal: the trip exists, so these act immediately ──
function renderEditAttachments() {
  const list = document.getElementById('editAttachList');
  list.innerHTML = '';
  if (!editingTrip) return;
  (editingTrip.attachments || []).forEach(att => {
    list.appendChild(attachmentRow(att, async () => {
      const resp = await fetch(`/attachment/${att.id}`, { method: 'DELETE' });
      if (!resp.ok) {
        document.getElementById('editAttachHint').textContent = 'Could not remove that file.';
        return;
      }
      editingTrip.attachments = editingTrip.attachments.filter(a => a.id !== att.id);
      renderEditAttachments();
      // The trip row's paperclip count is the only other record of this on
      // screen, so it has to be re-read rather than left showing the old count.
      loadHistory();
    }));
  });
}

document.getElementById('editAttachInput').addEventListener('change', async (e) => {
  const hint = document.getElementById('editAttachHint');
  hint.textContent = '';
  if (!editingTrip) return;
  const files = [...e.target.files];
  e.target.value = '';
  for (const file of files) {
    const problem = attachmentProblem(file, (editingTrip.attachments || []).length);
    if (problem) { hint.textContent = problem; break; }
    hint.textContent = `Uploading ${file.name}…`;
    const result = await uploadAttachment(editingTrip.id, file);
    if (!result.ok) { hint.textContent = result.error; break; }
    editingTrip.attachments = [...(editingTrip.attachments || []), result.attachment];
    renderEditAttachments();
    hint.textContent = '';
  }
  loadHistory();
});


// ─── Live route measurement ───────────────────────────────────────────────
// The distance a trip covers depends on the order of its locations, so adding,
// removing, reordering or editing one changes the answer. Rather than leaving
// that to be discovered on save, each form measures its own route as it is
// edited and shows what it currently comes to.
//
// One measurement per distinct route, keyed by the ordered labels: an edit that
// leaves the route the same — retyping identical text, moving a row back —
// costs nothing. Routes bills per request, so that key is what keeps a live
// readout from being expensive.
function newMeasureState() {
  return { key: null, miles: null, durationSeconds: null, timer: null, inFlight: null,
           // Bumped by resetMeasure(). A request captures it when it starts and
           // compares it when it returns, so an answer from before a reset is
           // discarded rather than rendered. A boolean cannot do this job: the
           // reset has to clear the state the request would write into, which
           // would clear the flag with it.
           generation: 0 };
}

// Forgets a measurement and invalidates any request still on its way back.
// Fields are cleared individually rather than by assigning a fresh object, so
// the generation survives to be compared against.
function resetMeasure(state) {
  clearTimeout(state.timer);
  state.generation += 1;
  state.key = null;
  state.miles = null;
  state.durationSeconds = null;
  state.timer = null;
  state.inFlight = null;
}

function formatDriveTime(seconds) {
  if (seconds == null) return null;
  const mins = Math.max(1, Math.round(seconds / 60));
  return mins < 60 ? `${mins} min`
    : `${Math.floor(mins / 60)} h ${String(mins % 60).padStart(2, '0')} min`;
}

// Measures a route unless it is already the one measured. Returns the state so
// a caller that needs the number — logging, saving — can read it straight after
// awaiting, rather than racing the display.
async function measureRoute(state, editor, onChange) {
  const rows = editor.allRows();
  const route = routeFromLocations(rows);
  if (!route) {
    Object.assign(state, { key: null, miles: null, durationSeconds: null });
    onChange('incomplete');
    return state;
  }
  const key = routeKey(rows);
  if (key === state.key) { onChange('ready'); return state; }

  onChange('measuring');
  // Captured before the request so a reset arriving during it can be detected.
  const generation = state.generation;
  // Tracked so a save can wait for a measurement already running instead of
  // starting a second one for the same route.
  const request = (async () => {
    try {
      const resp = await fetch('/calculate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(route),
      });
      const data = await resp.json();
      if (!resp.ok) return { ok: false, error: data.error };
      return { ok: true, data };
    } catch {
      return { ok: false, error: 'Network error.' };
    }
  })();
  state.inFlight = request;
  const result = await request;
  if (state.inFlight === request) state.inFlight = null;

  // The state was reset while this was in flight — the modal closed, or a trip
  // was logged — so there is nothing to render into. Writing now would put a
  // number into a closed modal, or into the next trip opened in it.
  if (state.generation !== generation) return state;

  // An edit landed while this was in flight. That edit started its own
  // measurement, and this answer is for a route no longer on screen.
  if (routeKey(editor.allRows()) !== key) return state;

  if (!result.ok) {
    Object.assign(state, { key: null, miles: null, durationSeconds: null });
    onChange('failed', result.error);
    return state;
  }
  rememberBiasCenter(result.data.endpoints);
  Object.assign(state, { key, miles: result.data.distance_miles,
                         durationSeconds: result.data.duration_seconds });
  onChange('ready');
  return state;
}

function scheduleMeasure(state, editor, onChange) {
  clearTimeout(state.timer);
  // Said immediately, so a changed route never shows a stale number, or a stale
  // error, as though it still applied.
  //
  // An incomplete route is reported as such rather than as changed: a form with
  // a blank row has nothing to remeasure, and a failed measurement leaves the
  // key null, so comparing keys alone announced "remeasuring" on an empty form
  // and left a previous failure on screen on an edited one. Which of the two it
  // is decides which the user is told.
  if (!routeFromLocations(editor.allRows())) onChange('incomplete');
  else if (routeKey(editor.allRows()) !== state.key) onChange('stale');
  state.timer = setTimeout(() => measureRoute(state, editor, onChange), MEASURE_DEBOUNCE_MS);
}

// Returns the measurement for the route on screen, waiting for one already
// running and starting one if the route has changed since the last.
async function currentMeasurement(state, editor, onChange) {
  clearTimeout(state.timer);
  if (state.inFlight) await state.inFlight;
  if (routeKey(editor.allRows()) === state.key) return state;
  return measureRoute(state, editor, onChange);
}

// ── log form readout ──
function renderTripMeasure(status, detail) {
  const box = document.getElementById('tripMeasure');
  const text = document.getElementById('tripMeasureText');
  const idle = status !== 'ready';
  box.classList.toggle('is-idle', idle);
  const drive = formatDriveTime(tripMeasure.durationSeconds);
  const stops = Math.max(0, tripRoute.allRows().filter(l => l.label).length - 2);
  if (status === 'ready') {
    text.innerHTML = `<span class="rm-miles">${tripMeasure.miles} mi</span>` +
      `<span class="rm-sub"> · ${drive} driving${stops ? ` · through ${stops} stop${stops === 1 ? '' : 's'}` : ''}</span>`;
  } else if (status === 'measuring') {
    text.textContent = 'Measuring the route…';
  } else if (status === 'stale') {
    text.textContent = 'Route changed — remeasuring…';
  } else if (status === 'failed') {
    text.textContent = detail || 'Could not measure this route.';
  } else {
    text.textContent = 'Add two locations to see the distance.';
  }

  // The estimated end time is derived from this measurement, so it is refreshed
  // from here rather than by watching the route separately. On a failure the
  // hint says why, since the end time going blank otherwise looks like a glitch.
  applyEndTimeEstimate();
  if (status === 'failed') {
    const endEl = document.getElementById('tripEndTime');
    if (!endEl.value || endEl._derived) {
      document.getElementById('endTimeHint').textContent =
        detail || 'Could not measure this route, so there is no estimated end time.';
    }
  }
}

// ── edit modal readout ──
function renderEditMeasure(status, detail) {
  const box = document.getElementById('editMiles');
  if (status === 'ready') {
    box.textContent = editMeasure.miles;
    if (editingTrip) {
      editingTrip.miles = editMeasure.miles;
      editingTrip.durationSeconds = editMeasure.durationSeconds;
      editingTrip.calcRouteKey = editMeasure.key;
      editingTrip.calcStopCount = Math.max(0, editRoute.values().length - 2);
      checkEditSpeedLive();
    }
  } else if (status === 'measuring' || status === 'stale') {
    box.textContent = '…';
  } else if (status === 'failed') {
    box.textContent = '—';
    document.getElementById('editMeasureError').textContent = detail || 'Could not measure this route.';
  } else {
    // 'incomplete': a row was cleared, so there is no route to measure. Without
    // this the modal kept whichever ellipsis or error preceded it, for ever.
    box.textContent = '—';
  }
  if (status !== 'failed') document.getElementById('editMeasureError').textContent = '';
}

// Called from the one place every location change already funnels through.
function scheduleRouteMeasurements() {
  scheduleMeasure(tripMeasure, tripRoute, renderTripMeasure);
  if (editingTrip) scheduleMeasure(editMeasure, editRoute, renderEditMeasure);
}


// ─── Log trip ─────────────────────────────────────────────────────────────

document.getElementById('logTripBtn').addEventListener('click', async () => {
  hideError();
  updateSpeedWarning('tripSpeedWarning', 'tripSpeedWarningText', null);

  // Filled rows only, so a blank row left in the middle is simply not a stop.
  // Fewer than two and there is no route to measure — said in terms of the
  // list the user sees rather than of a start and end field that no longer exist.
  const route = routePayload(tripRoute);
  if (!route) {
    showError('Fill in the first and last locations — where the trip started and where it ended.');
    return;
  }

  const tripDateError = validateTripDate(document.getElementById('tripDate').value);
  if (tripDateError) { showError(tripDateError); return; }

  const endDateError = validateEndDate(document.getElementById('tripEndDate').value,
                                       document.getElementById('tripDate').value);
  if (endDateError) { showError(endDateError); return; }

  const btn = document.getElementById('logTripBtn');
  btn.disabled = true;

  // Measured while the route was built, so this is usually already known. It
  // still waits, because logging can land inside the debounce window, and /log
  // reuses a distance it is given instead of measuring the same route again.
  //
  // The button says what it is doing in order: measuring, then logging. The
  // "Logging…" label used to be set first and then captured as the label to
  // restore, so the button said "Logging…" during the measurement and again
  // after it.
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Measuring…';
  await currentMeasurement(tripMeasure, tripRoute, renderTripMeasure);
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Logging…';

  // Sent with the trip when it describes this exact route: /log reuses a
  // distance it is given rather than asking Routes again, so neither the live
  // readout nor the estimated end time costs an extra request per trip.
  // Anything short of an exact match is left out and the server measures it.
  const measured = tripMeasure.miles != null && tripMeasure.key === routeKey(tripRoute.allRows())
    ? { distance_miles: tripMeasure.miles, duration_seconds: tripMeasure.durationSeconds }
    : {};

  const vehicleVal = document.getElementById('tripVehicle').value;
  const businessVal = document.getElementById('tripBusiness').value;
  const payload = {
    ...route,
    ...measured,
    vehicle_id: vehicleVal ? parseInt(vehicleVal) : null,
    business_id: businessVal ? parseInt(businessVal) : null,
    notes:      document.getElementById('tripNotes').value,
    trip_date:  document.getElementById('tripDate').value      || null,
    end_date:   document.getElementById('tripEndDate').value   || null,
    start_time: getTimeValue('tripStartTime'),
    end_time:   getTimeValue('tripEndTime'),
    client_today: localToday(),
  };

  try {
    const resp = await fetch('/log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if (!resp.ok) { showError(data.error || 'Failed to log trip.'); return; }

    // Only now does the trip have an id to attach anything to. A file that
    // fails is reported by name rather than silently dropped — the trip itself
    // is already saved, so this is not a reason to fail the whole action.
    const attachFailures = pendingAttachments.length
      ? await uploadPendingAttachments(data.trip.id) : [];

    rememberBiasCenter(data.endpoints);
    await loadHistory();

    tripRoute.reset();
    // The next trip is a different route, so the measurement and the estimate
    // it fed both go with it.
    resetMeasure(tripMeasure);
    renderTripMeasure('incomplete');
    document.getElementById('endTimeHint').textContent = '';
    refreshPlaceWarnings();
    // Clear first, then re-apply: logging one trip and immediately logging
    // another should start from the default again, not from a blank select.
    document.getElementById('tripVehicle').value   = '';
    document.getElementById('tripVehicle')._userSet = false;
    document.getElementById('tripVehicleHint').textContent = '';
    applyDefaultVehicle();
    document.getElementById('tripBusiness').value = '';
    document.getElementById('tripBusiness')._userSet = false;
    applyDefaultBusiness();
    document.getElementById('tripNotes').value = '';
    document.getElementById('tripNotesCounter').textContent = '';
    document.getElementById('tripDate').value      = '';
    document.getElementById('tripEndDate').value   = '';
    document.getElementById('tripEndDate')._userSet = false;
    initTimeInput('tripStartTime');
    initTimeInput('tripEndTime');
    // Re-stamp after clearing, so a second trip logged back-to-back gets the
    // time it is being logged at rather than the one just submitted.
    applyTripDateTimeDefaults();

    if (attachFailures.length) {
      showError(`Trip logged, but ${attachFailures.length === 1 ? 'one file' : 'some files'} ` +
                `could not be attached: ${attachFailures.join('; ')}. ` +
                `You can attach them by editing the trip.`);
    } else if (data.distance_error) {
      showError(`Trip logged, but distance couldn't be calculated automatically (${data.distance_error}). You can add it later by editing the trip.`);
    } else {
      const ok = document.getElementById('successAlert');
      ok.classList.remove('d-none');
      setTimeout(() => ok.classList.add('d-none'), 3000);
    }

    if (data.warning) {
      updateSpeedWarning('tripSpeedWarning', 'tripSpeedWarningText', data.warning);
      setTimeout(() => updateSpeedWarning('tripSpeedWarning', 'tripSpeedWarningText', null), 6000);
    } else {
      updateSpeedWarning('tripSpeedWarning', 'tripSpeedWarningText', null);
    }
  } catch {
    showError('Network error. Could not save trip.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-plus-circle"></i> Log Trip';
  }
});


// ─── History ──────────────────────────────────────────────────────────────

let totalMilesAccum = 0;
let tripCount       = 0;
let tripsData       = [];
let headerInserted  = false;

async function loadHistory() {
  try {
    const resp  = await fetch('/history');
    const trips = await resp.json();

    // Re-render-safe: called both on initial page load and after logging/
    // editing a trip (so the list re-sorts by trip date), so it must clear
    // whatever it rendered last time before rebuilding.
    const wrap = document.getElementById('historyWrap');
    wrap.querySelectorAll('.trip-row, #tripsHeader').forEach(el => el.remove());
    headerInserted = false;

    totalMilesAccum = 0;
    tripCount = trips.length;
    tripsData = [...trips];

    if (!trips.length) {
      wrap.innerHTML = `
        <div class="history-empty" id="emptyState">
          <span class="empty-icon"><i class="fas fa-route"></i></span>
          No trips logged yet. Calculate your first trip above!
        </div>
      `;
      updateTotalDisplay();
      return;
    }

    document.getElementById('emptyState')?.remove();
    trips.forEach(t => { prependTripRow(t, false); totalMilesAccum += t.miles ?? 0; });
    updateTotalDisplay();
  } catch { /* non-fatal */ }
}

function prependTripRow(trip, prepend = true) {
  document.getElementById('emptyState')?.remove();
  const wrap = document.getElementById('historyWrap');

  if (!headerInserted) {
    const hdr = document.createElement('div');
    hdr.className = 'trips-header';
    hdr.id = 'tripsHeader';
    hdr.innerHTML = '<span>Date / Time</span><span>Start</span><span>End</span><span>Miles</span><span></span>';
    wrap.insertBefore(hdr, wrap.firstChild);
    headerInserted = true;
  }

  const timeRangeTxt = formatTimeRange(trip.start_time, trip.end_time,
                                       trip.trip_date, trip.end_date) || '–';
  const dateTxt = trip.trip_date
    ? formatTripDate(trip.trip_date)
    : escHtml((trip.timestamp || '').replace(/\s+\d{1,2}:\d{2}\s*[AP]M$/i, '').trim());

  const row = document.createElement('div');
  row.className = trip.miles == null ? 'trip-row trip-row-pending' : 'trip-row';
  row.id = `trip-${trip.id}`;
  row.dataset.start       = trip.start;
  row.dataset.end         = trip.end;
  row.dataset.miles       = trip.miles ?? '';
  row.dataset.vehicleId   = trip.vehicle_id   || '';
  row.dataset.vehicleName = trip.vehicle_name || '';
  row.dataset.businessId   = trip.business_id   || '';
  row.dataset.businessName = trip.business_name || '';
  row.dataset.notes        = trip.notes || '';
  row.dataset.stops        = JSON.stringify(trip.stops || []);
  row.dataset.attachments  = JSON.stringify(trip.attachments || []);
  row.dataset.vehicleSub  = trip.vehicle_sub  || '';
  row.dataset.tripDate    = trip.trip_date    || '';
  row.dataset.endDate     = trip.end_date     || '';
  row.dataset.startTime   = trip.start_time   || '';
  row.dataset.endTime     = trip.end_time     || '';
  row.dataset.durationSeconds = trip.duration_seconds || '';
  row.dataset.startPlaceId = trip.start_place_id || '';
  row.dataset.endPlaceId   = trip.end_place_id   || '';
  row.innerHTML = `
    <div class="trip-date">
      <div class="trip-date-main">${dateTxt}</div>
      <div class="trip-time-display trip-sub" data-raw-start="${escHtml(trip.start_time||'')}" data-raw-end="${escHtml(trip.end_time||'')}" data-trip-date="${escHtml(trip.trip_date||'')}" data-end-date="${escHtml(trip.end_date||'')}">${timeRangeTxt}</div>
    </div>
    <div class="trip-loc">
      <div class="trip-loc-main" title="${escHtml(trip.start)}">${escHtml(trip.start)}</div>
      <div class="trip-vehicle-sub trip-sub" style="${trip.vehicle_name ? '' : 'display:none'}">${escHtml(trip.vehicle_name || '')}</div>
    </div>
    <div class="trip-loc">
      <div class="trip-loc-main" title="${escHtml(trip.end)}">${escHtml(trip.end)}</div>
      ${(trip.stops || []).length ? `<div class="trip-stops-text" title="via ${escHtml(trip.stops.map(st => st.label).join(' → '))}">via ${escHtml(trip.stops.map(st => st.label.split(',')[0]).join(' → '))}</div>` : ''}
      <div class="trip-note-text" style="${trip.notes ? '' : 'display:none'}">${escHtml(trip.notes || '')}</div>
      ${(trip.attachments || []).length ? `<div class="trip-attach-count" title="Open the trip to view them"><i class="fas fa-paperclip"></i>${trip.attachments.length} file${trip.attachments.length === 1 ? '' : 's'}</div>` : ''}
    </div>
    <div class="trip-mi">${milesDisplay(trip.miles)}</div>
    <div class="trip-actions">
      <button class="trip-edit" onclick="openEditModal(${trip.id})" title="Edit trip">
        <i class="fas fa-pencil-alt"></i>
      </button>
      <button class="trip-del" onclick="deleteTrip(${trip.id}, ${trip.miles})" title="Delete trip">
        <i class="fas fa-trash-alt"></i>
      </button>
    </div>
  `;

  const hdr = document.getElementById('tripsHeader');
  if (prepend && hdr) {
    hdr.insertAdjacentElement('afterend', row);
  } else {
    wrap.appendChild(row);
  }
}

async function deleteTrip(id, miles) {
  if (!confirm('Delete this trip?')) return;
  try {
    const resp = await fetch(`/history/${id}`, { method: 'DELETE' });
    if (!resp.ok) return;
    document.getElementById(`trip-${id}`).remove();
    tripsData = tripsData.filter(t => t.id !== id);
    updateTotal(miles, false);

    const wrap = document.getElementById('historyWrap');
    if (!wrap.querySelector('.trip-row')) {
      document.getElementById('tripsHeader')?.remove();
      headerInserted = false;
      wrap.innerHTML = `
        <div class="history-empty" id="emptyState">
          <span class="empty-icon"><i class="fas fa-route"></i></span>
          No trips logged yet. Calculate your first trip above!
        </div>
      `;
    }
  } catch { /* silent */ }
}

function updateTotal(miles, add) {
  totalMilesAccum = add ? totalMilesAccum + miles : totalMilesAccum - miles;
  tripCount       = add ? tripCount + 1 : tripCount - 1;
  updateTotalDisplay();
}

function updateTotalDisplay() {
  const bar = document.getElementById('statsBar');
  const btns = document.getElementById('exportBtns');
  if (tripCount > 0) {
    document.getElementById('statTotalMiles').textContent =
      (Math.round(totalMilesAccum * 100) / 100).toLocaleString();
    document.getElementById('statTripCount').textContent = tripCount;
    bar.classList.remove('d-none');
    btns.classList.remove('d-none');
    // Only worth offering when there is something to add; otherwise it would
    // produce exactly what the PDF button already does.
    document.getElementById('exportFullBtn').classList
      .toggle('d-none', !tripsData.some(t => (t.attachments || []).length));
  } else {
    bar.classList.add('d-none');
    btns.classList.add('d-none');
  }
}
