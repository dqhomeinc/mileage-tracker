<style>
  .app-nav {
    background: var(--grad);
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 16px rgba(79,70,229,.3);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-brand {
    display: flex; align-items: center; gap: 10px;
    color: white; font-weight: 700; font-size: 1.05rem; text-decoration: none;
  }
  .nav-logo {
    width: 34px; height: 34px; border-radius: 8px;
    background: rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.95rem;
  }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .user-chip {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.15); border-radius: 20px;
    padding: 4px 12px 4px 4px;
    color: white; font-size: 0.83rem;
    border: none; cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .user-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,255,255,.3); overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem; font-weight: 700; color: white;
    flex-shrink: 0;
  }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .chip-caret { font-size: 0.6rem; opacity: 0.75; margin-left: 1px; }
  .logout-link {
    color: rgba(255,255,255,.8); font-size: 0.82rem;
    text-decoration: none; padding: 5px 10px; border-radius: 6px;
    transition: background .2s;
  }
  .logout-link:hover { background: rgba(255,255,255,.15); color: white; }
  .user-dropdown-menu {
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    box-shadow: var(--shadow); padding: 6px; margin-top: 10px !important;
    min-width: 170px;
  }
  .user-dropdown-menu .dropdown-item {
    border-radius: 8px; padding: 8px 12px; font-size: 0.86rem;
    color: var(--text); display: flex; align-items: center; gap: 10px;
  }
  .user-dropdown-menu .dropdown-item i { width: 14px; color: var(--muted); font-size: 0.8rem; }
  .user-dropdown-menu .dropdown-item:hover,
  .user-dropdown-menu .dropdown-item:focus { background: #EEF2FF; color: var(--primary); }
  .user-dropdown-menu .dropdown-item:hover i,
  .user-dropdown-menu .dropdown-item:focus i { color: var(--primary); }

  /* ── Time format toggle ──────────────────── */
  .time-toggle {
    display: flex; align-items: center; gap: 2px;
    background: rgba(255,255,255,.15); border-radius: 16px; padding: 3px;
  }
  .time-toggle-btn {
    padding: 3px 10px; border-radius: 12px; border: none;
    background: transparent; color: rgba(255,255,255,.7);
    cursor: pointer; font-size: .78rem; font-weight: 600;
    font-family: 'Inter', sans-serif; transition: all .2s;
  }
  .time-toggle-btn.active { background: rgba(255,255,255,.25); color: white; }
</style>

<nav class="app-nav">
  <a href="/" class="nav-brand">
    <div class="nav-logo"><i class="fas fa-route"></i></div>
    Mileage Tracker
  </a>
  <div class="nav-right">
    {% if show_time_toggle %}
    <div class="time-toggle">
      <button class="time-toggle-btn" id="toggle12h" onclick="setTimeFormat('12h')">12h</button>
      <button class="time-toggle-btn" id="toggle24h" onclick="setTimeFormat('24h')">24h</button>
    </div>
    {% endif %}
    <div class="dropdown">
      <button class="user-chip" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <div class="user-avatar" id="navAvatar">
          {% if photo_data %}
            <img src="{{ photo_data }}" alt="">
          {% else %}
            {{ username[0]|upper }}
          {% endif %}
        </div>
        <span id="navUsername">{{ username }}</span>
        <i class="fas fa-chevron-down chip-caret"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end user-dropdown-menu">
        <li><a class="dropdown-item" href="/profile"><i class="fas fa-user"></i> Profile</a></li>
        <li><a class="dropdown-item" href="/my-vehicles"><i class="fas fa-car"></i> Vehicles</a></li>
        <li><a class="dropdown-item" href="/my-businesses"><i class="fas fa-briefcase"></i> Businesses</a></li>
      </ul>
    </div>
    <a href="/logout" class="logout-link">Sign Out</a>
  </div>
</nav>
