name: Lint

on:
  # Deliberately not filtered to `branches: [main]`. A pull request that targets
  # another feature branch -- the second half of a stacked pair -- matched no
  # trigger at all and ran no checks whatsoever, which is worse than it sounds:
  # the PR showed a clean, empty check list rather than a warning, so a stack
  # looked reviewed when nothing had run against it.
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      # E9 (syntax errors) + F (pyflakes: undefined names, unused imports, etc).
      # Intentionally excludes style-only rule sets so this catches real bugs
      # without blocking merges over formatting preferences.
      - name: Lint with ruff
        run: ruff check . --select E9,F
