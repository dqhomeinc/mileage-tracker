name: Integration Checks

on:
  # Deliberately not filtered to `branches: [main]`. A pull request that targets
  # another feature branch -- the second half of a stacked pair -- matched no
  # trigger at all and ran no checks whatsoever, which is worse than it sounds:
  # the PR showed a clean, empty check list rather than a warning, so a stack
  # looked reviewed when nothing had run against it.
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # render_template() only runs at request time, so a plain `import app`
  # never catches broken Jinja syntax, undefined vars, or bad includes.
  template-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Render all templates
        run: python .github/scripts/check_templates.py

  # Templates mix Jinja and inline JS in the same <script> tags, so scripts
  # are rendered through Jinja first, then the resulting JS is syntax-checked
  # with Node — nothing else in CI touches the app's inline JS at all.
  js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check inline JS syntax
        run: python .github/scripts/check_js_syntax.py

  # The date/time rules are pure functions with a lot of edge cases — midnight,
  # month and year boundaries, leap days, multi-night trips, missing values — and
  # getting one wrong either changes recorded mileage or silently suppresses the
  # feasibility warning. Nothing else in CI calls them.
  trip-times:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check trip date and time rules
        run: python .github/scripts/check_trip_times.py

  # The logging key is the only thing between a session and a scripted write to
  # /log, and the password gate on revealing it is the only reason the key is
  # not simply readable by anything already signed in. Neither a template
  # render nor an import check can see either property.
  logging-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check the per-user logging key
        run: python .github/scripts/check_logging_key.py

  # SECRET_KEY signs session cookies and password-reset tokens. When it was
  # absent the app fell back to a constant in main.py -- a public file -- and
  # started anyway, looking healthy. The guard against that has to hold in three
  # directions at once, and every one of them fails quietly rather than loudly.
  secret-key-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check the SECRET_KEY startup guard
        run: python .github/scripts/check_secret_key.py

  # The login form used to say whether an email was registered, and -- after
  # that wording was fixed -- would still have said it in response time, since
  # a missing account skipped scrypt entirely. The timing half is invisible to
  # review and to every other check here.
  login-enumeration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check the login form does not reveal which emails exist
        run: python .github/scripts/check_login_enumeration.py

  # A user logged one journey twice. Catching that has to be server-side, since
  # the two entries can come from page loads that never saw each other, and it
  # has to ask rather than refuse, since two visits to one client in a day are
  # a real pair of trips. Both halves -- catching the repeat and not obstructing
  # the genuine pair -- are invisible to every other check here.
  duplicate-trips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check duplicate trip entries are queried
        run: python .github/scripts/check_duplicate_trips.py

  # pg8000 asks only for scramp>=1.4.5, so a scramp release can break a pinned
  # driver with no commit here to blame -- which is what took production down.
  # The postgres job below cannot catch it: the call sits behind `if resp == "S"`
  # and runs only when the server accepts SSL, and that container serves
  # plaintext while Neon requires TLS. This checks the fit without a database.
  db-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check the Postgres driver fits its SCRAM dependency
        run: python .github/scripts/check_db_driver.py

  # Without a limit the password is not a boundary, only slow. The properties
  # that make a limit real -- that it holds against the correct password, that
  # it reveals nothing about which addresses exist, and that one address being
  # limited does not limit everyone -- are each a line of code and none of them
  # are visible in review.
  login-rate-limit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check login attempts are bounded
        run: python .github/scripts/check_login_rate_limit.py

  # CI has no DATABASE_URL, so a plain `import app` always falls back to
  # SQLite and never exercises the pg8000 connection or the Postgres branch
  # of _migrate_db() — both of which production actually depends on.
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import against real Postgres
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          # Required now that a deployed app refuses to start without one, and
          # DATABASE_URL being set is what marks this as deployed. Any value
          # does; nothing here signs anything that outlives the job.
          SECRET_KEY: integration-check-not-a-real-secret
        run: python -c "import app"
      # The logging-key job runs this against SQLite. The gate's failure
      # counter is a single UPDATE with a CASE on each column, and SQLite
      # serialises writers — so the concurrent part of that check only asserts
      # the invariant there. Against real Postgres the guesses actually
      # interleave, which is the case the atomic statement exists for.
      - name: Check the logging key gate against real Postgres
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
        run: python .github/scripts/check_logging_key.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt
