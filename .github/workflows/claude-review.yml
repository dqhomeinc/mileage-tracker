name: Claude Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Forces tag mode instead of agent mode. Agent mode (the default when
          # a `prompt` input is supplied) never wires up the comment-posting
          # tool, so without this the review runs but nothing gets posted.
          track_progress: true
          # Tag mode's default --allowedTools does NOT include the inline-comment
          # tool (mcp__github_inline_comment__create_inline_comment) — confirmed
          # via a real job log showing 16 permission denials and zero buffered
          # inline comments, with everything folding into the one summary comment
          # instead. --allowedTools replaces the default list rather than adding
          # to it, so this is the default set (as seen in that same log) plus the
          # inline-comment tool, not just the one addition.
          claude_args: >-
            --allowedTools
            "Glob,Grep,LS,Read,mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log,Bash(git add:*),Bash(git commit:*),Bash(/home/runner/work/_actions/anthropics/claude-code-action/v1/scripts/git-push.sh:*),Bash(git rm:*)"
          prompt: |
            Review this pull request and:

            1. Post a single PR review comment with:
               - **Summary** — 2-3 sentences on what this PR actually changes and why,
                 based on the diff and PR description.
               - **Risk assessment** — Low/Medium/High, with a one-line reason (e.g.
                 touches auth, changes deploy config, migrates data, pure UI tweak).
               - **Minor notes** — style nits and non-blocking low-severity
                 observations only (e.g. naming, minor simplification/reuse
                 opportunities). Do not include correctness bugs, security issues,
                 or anything medium/high severity here — those go inline instead
                 (see below). If there are none, say so.

            2. For any HIGH or MEDIUM severity finding (correctness bugs, security
               issues, data loss, auth bypass, or bugs that would break the app for
               real users) — post it as an inline comment directly on the relevant
               line(s) in the diff, not in the summary comment. Low severity issues
               and style nits go in "Minor notes" above instead, not inline.

            Be concise throughout.
