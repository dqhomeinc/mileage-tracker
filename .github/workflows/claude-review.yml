name: Claude Code Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Forces tag mode instead of agent mode. Agent mode (the default when
          # a `prompt` input is supplied) never wires up the comment-posting
          # tool, so without this the review runs but nothing gets posted.
          track_progress: true
          prompt: |
            Review this pull request and post a single PR review comment with:

            1. **Summary** — 2-3 sentences on what this PR actually changes and why,
               based on the diff and PR description.
            2. **Risk assessment** — Low/Medium/High, with a one-line reason (e.g.
               touches auth, changes deploy config, migrates data, pure UI tweak).
            3. **Findings** — correctness bugs, security issues, and
               simplification/reuse opportunities. Only report concrete problems
               you find in the diff — skip style nits. If there are none, say so.

            Be concise throughout.
